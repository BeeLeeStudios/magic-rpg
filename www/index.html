  drawBackground(ctx, now) {
    if (!this._bg) return;
    const W = this.bw * this.ap, H = this.bh * this.ap;
    const fade = this._bgPrev ? Math.min(1, (now - this._bgFadeStart) / 700) : 1;
    if (this._bgPrev && fade < 1) ctx.drawImage(this._bgPrev.canvas, 0, 0, W, H);
    else this._bgPrev = null;
    ctx.globalAlpha = fade;
    ctx.drawImage(this._bg.canvas, 0, 0, W, H);
    ctx.globalAlpha = 1;
    const ap = this.ap;
    ctx.fillStyle = "#ffffff";
    for (const st of this._bg.extra.stars) {
      const tw = Math.sin(now / 400 + st.p);
      if (tw < -0.3) continue;
      ctx.globalAlpha = 0.5 + tw * 0.5;
      const r = (st.big && tw > 0.6 ? 1.4 : 0.8) * ap * 0.5;
      ctx.beginPath(); ctx.arc((st.x + 0.5) * ap, (st.y + 0.5) * ap, r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    const B = BIOMES[this._biome];
    if (B && B.id === "volcano") {
      ctx.globalAlpha = 0.1 + 0.07 * Math.sin(now / 520);
      ctx.fillStyle = "#ff5a1a"; ctx.fillRect(0, this.groundY - ap * 8, this.W, ap * 8);
      ctx.globalAlpha = 1;
    }
    if (B && B.id === "lagoon") {
      ctx.fillStyle = "#c8f4ff";
      for (let i = 0; i < 7; i++) {
        const x = ((i * 53 + now / 40) % (this.W + 40)) - 20;
        const y = this.groundY - ap * (2 + (i % 4) * 2);
        ctx.globalAlpha = 0.5; ctx.beginPath(); ctx.ellipse(x, y, ap * 2, ap * 0.4, 0, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  },

  groundShadow(ctx, rx, ry, glow) {
    const cx = this.dragonOriginX + 24 * this.unit, cy = this.dragonOriginY + 46 * this.unit;
    if (glow) {
      ctx.globalAlpha = 0.22;
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.ellipse(cx, cy, rx * this.unit * 1.25, ry * this.unit * 1.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    // soft contact shadow
    ctx.save();
    ctx.translate(cx, cy); ctx.scale(1, ry / rx);
    const R = rx * this.unit;
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, R);
    g.addColorStop(0, "rgba(0,0,0,0.5)"); g.addColorStop(0.6, "rgba(0,0,0,0.25)"); g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  },

  drawPlayer(ctx, now) {
    ctx.save();
    ctx.translate(this.playerLayer.x, this.playerLayer.y);
    if (this.playerLayer.scale !== 1) ctx.scale(this.playerLayer.scale, this.playerLayer.scale);
    this.groundShadow(ctx, 15, 2.6, null);
    const tierGlow = [null, null, null, "255,122,28", "143,233,255", "255,42,74"][this._swordTier || 0];
    if (tierGlow && this._blade && this._blade.length) {
      const mid = this._blade[Math.floor(this._blade.length / 2)];
      const gx = this._stripBaseX + mid.x, gy = this._stripBaseY + mid.y, R = this.unit * 9;
      const g = ctx.createRadialGradient(gx, gy, 0, gx, gy, R);
      g.addColorStop(0, `rgba(${tierGlow},${0.45 + 0.15 * Math.sin(now / 180)})`); g.addColorStop(1, `rgba(${tierGlow},0)`);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(gx, gy, R, 0, Math.PI * 2); ctx.fill();
    }
    const scale = this._pixScale || 1;
    const n = Math.max(1, this.dragonStrips.length);
    const frame = Math.floor(now / (n >= 4 ? (now < (this._flapFastUntil || 0) ? 85 : 170) : 420)) % n;   // wing flaps / cape sway
    const bobPx = (Math.sin(now / 500) + 1) * 0.5;   // smooth breathing bob
    const flash = now < this.playerFlashUntil;
    const strips = flash ? this.dragonFlash : this.dragonStrips;
    const img = strips[frame];
    if ((this._fire || 0) >= 3) this.drawSpeedLines(ctx, now);
    if (img) {
      img.visible = true; img.alpha = this.playerLayer.alpha;
      img.x = this._stripBaseX; img.y = this._stripBaseY - bobPx * scale;
      drawSprite(ctx, img);
    }
    if ((this._fire || 0) >= 1) this.drawStreakBlade(ctx, now, -bobPx * scale);
    ctx.restore();
  },

  /* Multi-enemy waves: the foes still waiting line up behind the one being
     fought -- smaller, higher and dimmer, each with a tiny HP bar -- so it
     reads at a glance that this is a group fight. */
  queueSlot(k) {
    const sc = Math.pow(0.76, k);
    const w = this._eTexW * sc, h = this._eTexH * sc;
    const frontCx = this.enemyBase.x + this._enemyBaseX + this._eTexW / 2;
    const cx = Math.min(this.W - w / 2 - 2, frontCx + k * this._eTexW * 0.42);
    const bottom = this.enemyBase.y + this._enemyBaseY + this._eTexH - k * this.unit * 5;
    return { x: cx - w / 2, y: bottom - h, w, h, sc, cx };
  },
  drawQueue(ctx, now) {
    const active = getActiveEnemy();
    if (!active || active.isChest || !this.enemyStrips.length || !this._eTexW) return;
    const waiting = S.enemies.filter((e) => e !== active && e.hp > 0);
    if (!waiting.length) return;
    const n = this.enemyStrips.length;
    for (let k = waiting.length; k >= 1; k--) {
      const img = this.enemyStrips[(Math.floor(now / 420) + k) % n];
      const q = this.queueSlot(k);
      const bob = (Math.sin(now / 560 + k * 1.7) + 1) * 0.5 * this.unit * 0.4;
      ctx.save();
      ctx.filter = "brightness(0.55) saturate(0.75)";
      ctx.drawImage(img.canvas, q.x, q.y - bob, q.w, q.h);
      ctx.restore();
      const en = waiting[k - 1];
      const bw = Math.max(18, q.w * 0.5), bh = Math.max(3, this.unit * 1.1);
      const bx = q.cx - bw / 2, by = q.y + q.h * 0.08 - bh * 2;
      ctx.fillStyle = "#140d10"; ctx.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
      ctx.fillStyle = "#3a2d4a"; ctx.fillRect(bx, by, bw, bh);
      ctx.fillStyle = en.glow || "#ff6b5b"; ctx.fillRect(bx, by, bw * Math.max(0, en.hp / en.maxHP), bh);
    }
  },

  drawEnemy(ctx, now) {
    const active = getActiveEnemy();
    if (active && this._deadRef === active && !active.isChest) return;
    ctx.save();
    ctx.translate(this.enemyLayer.x, this.enemyLayer.y);
    if (this.enemyLayer.scale !== 1) ctx.scale(this.enemyLayer.scale, this.enemyLayer.scale);
    ctx.globalAlpha = this.enemyLayer.alpha;
    this.groundShadow(ctx, 14, 2.4, this._enemyGlow);
    ctx.globalAlpha = this.enemyLayer.alpha;
    const hasPixel = this.enemyStrips.length > 0;
    if (hasPixel) {
      const scale = this._enemyPixScale || 1;
      const n = this.enemyStrips.length;
      const frame = Math.floor(now / 420) % n;
      const idle = this._enemyKind === "chest" && this._chestMode === "idle";
      const bobPx = idle ? Math.max(0, Math.sin(now / 260)) * 0.8 : (Math.sin(now / 560) + 1) * 0.5;
      const flash = now < this.enemyFlashUntil;
      const img = (flash ? this.enemyFlash : this.enemyStrips)[frame];
      if (img) {
        img.visible = true; img.alpha = this.enemyLayer.alpha;
        img.x = this._enemyBaseX; img.y = this._enemyBaseY - bobPx * scale;
        drawSprite(ctx, img);
      }
      if (this._enemyKind === "chest" && this._chestMode === "open" && Math.random() < 0.3) {
        // loot glitter while the lid is open
        this.spawn({ x: this.enemyLayer.x + (Math.random() - 0.5) * this.unit * 12, y: this.enemyLayer.y + this.dragonOriginY * 0.35, vy: -0.05, life: 700, color: Math.random() < 0.5 ? "#fff3a8" : "#ffcf3a", twinkle: true, seed: Math.random() * 999, front: true });
      }
    } else if (this._enemyKind === "text") {
      drawSprite(ctx, this.enemyText);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  },

  /* Short-lived vector-free effects: slash arcs, impact stars, rings. All
     plotted on the background art grid so they share the sprites' pixel
     size instead of looking like smooth vector overlays. */
  drawFx(ctx, now) {
    for (let i = this.fx.length - 1; i >= 0; i--) {
      const f = this.fx[i];
      const t = (now - f.t0) / f.dur;
      if (t < 0) continue;
      if (t >= 1) { this.fx.splice(i, 1); continue; }
      ctx.save();
      if (f.type === "slash") {
        // a bright crescent that sweeps across the target
        const r = this.unit * (f.big ? 20 : 16);
        const a0 = f.big ? 0.8 : -2.4, a1 = f.big ? -2.2 : 0.5;
        const head = a0 + (a1 - a0) * Math.min(1, t * 1.8);
        const tail = a0 + (a1 - a0) * Math.max(0, t * 1.8 - 0.6);
        ctx.translate(f.x, f.y); ctx.scale(1, 0.8);
        ctx.globalAlpha = 1 - t * 0.6;
        ctx.lineCap = "round";
        ctx.shadowColor = f.white ? "#ffffff" : "#ffcf3a"; ctx.shadowBlur = this.unit * (f.big ? 5 : 3);
        const cols = f.white ? [["#fff3c4", this.unit * 3.6], ["#ffffff", this.unit * 2], ["#ffffff", this.unit * 0.9]]
          : [["#ffb04a", this.unit * 3.2], ["#fff3a8", this.unit * 1.8], ["#ffffff", this.unit * 0.8]];
        cols.forEach(([col, w]) => {
          ctx.strokeStyle = col; ctx.lineWidth = w;
          ctx.beginPath(); ctx.arc(0, 0, r, tail, head, a1 < a0); ctx.stroke();
        });
      } else if (f.type === "star") {
        const len = this.unit * (4 + 10 * Math.sin(Math.min(1, t * 1.6) * Math.PI));
        ctx.translate(f.x, f.y); ctx.rotate(0.2);
        ctx.globalAlpha = 1 - t;
        ctx.shadowColor = f.color; ctx.shadowBlur = this.unit * 4;
        ctx.fillStyle = t < 0.3 ? "#ffffff" : f.color;
        ctx.beginPath();
        for (let k = 0; k < 16; k++) {
          const L = k % 2 ? len * 0.28 : (k % 4 === 0 ? len : len * 0.6);
          const a = k * Math.PI / 8;
          ctx.lineTo(Math.cos(a) * L, Math.sin(a) * L);
        }
        ctx.closePath(); ctx.fill();
      } else if (f.type === "ring") {
        const r = this.unit * f.r * (0.2 + t);
        ctx.globalAlpha = 1 - t;
        ctx.strokeStyle = f.color; ctx.lineWidth = this.unit * 1.4 * (1 - t) + 1;
        ctx.shadowColor = f.color; ctx.shadowBlur = this.unit * 3;
        ctx.beginPath(); ctx.ellipse(f.x, f.y, r, r * 0.75, 0, 0, Math.PI * 2); ctx.stroke();
      } else if (f.type === "breath") {
        this.drawBreath(ctx, f, t, now);
      } else if (f.type === "vial") {
        // tumbling glass flask on a high arc
        const e = Math.min(1, t);
        const x = f.x0 + (f.x1 - f.x0) * e;
        const y = f.y0 + (f.y1 - f.y0) * e - Math.sin(e * Math.PI) * this.unit * 18;
        const u = this.unit * 1.9;
        ctx.translate(x, y); ctx.rotate(-0.4 + e * Math.PI * 2.5);
        ctx.lineWidth = Math.max(1.5, u * 0.5); ctx.strokeStyle = "#140d10";
        ctx.fillStyle = "#cfe9f0";
        ctx.beginPath(); ctx.rect(-u * 0.7, -u * 3.6, u * 1.4, u * 1.6); ctx.fill(); ctx.stroke();           // neck
        ctx.fillStyle = "#8a5a2a"; ctx.beginPath(); ctx.rect(-u * 0.9, -u * 4.4, u * 1.8, u * 1); ctx.fill(); ctx.stroke(); // cork
        ctx.fillStyle = "#dff4f8"; ctx.beginPath(); ctx.arc(0, 0, u * 2.4, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); // bulb
        ctx.fillStyle = "#56d63a"; ctx.beginPath(); ctx.arc(0, 0, u * 1.9, -0.25, Math.PI + 0.25); ctx.closePath(); ctx.fill();
        ctx.fillStyle = "#9cff6a"; ctx.beginPath(); ctx.ellipse(0, u * 0.35, u * 1.5, u * 0.4, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#ffffff"; ctx.globalAlpha = 0.85; ctx.beginPath(); ctx.arc(-u * 0.9, -u * 0.9, u * 0.5, 0, Math.PI * 2); ctx.fill();
        if (Math.random() < 0.6) this.spawn({ x: x, y: y, vx: (Math.random() - 0.5) * 0.02, vy: 0.01, life: 380, color: Math.random() < 0.5 ? "#9cff6a" : "#56d63a", front: true });
      } else if (f.type === "fireball") {
        const e = EASE.cubicIn(Math.min(1, t));
        const x = f.x0 + (f.x1 - f.x0) * e;
        const y = f.y0 + (f.y1 - f.y0) * e - Math.sin(e * Math.PI) * this.unit * 8;
        const R = this.unit * (3 + e * 2.2);
        const g = ctx.createRadialGradient(x, y, 0, x, y, R * 1.8);
        g.addColorStop(0, "#ffffff"); g.addColorStop(0.2, "#fff3b0"); g.addColorStop(0.45, "#ffcf3a");
        g.addColorStop(0.7, "#ff7a1c"); g.addColorStop(1, "rgba(216,50,31,0)");
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, R * 1.8, 0, Math.PI * 2); ctx.fill();
        for (let k = 0; k < 3; k++) this.spawn({ x: x - R * 0.6, y: y + (Math.random() - 0.5) * R, vx: -0.05 - Math.random() * 0.08, vy: (Math.random() - 0.5) * 0.04, life: 380, color: ["#ffcf3a", "#ff7a1c", "#d8321f", "#5a2a1a"][(Math.random() * 4) | 0], front: true });
      }
      ctx.restore();
    }
  },

  /* ---------- state sync ---------- */
  syncFromState() {
    if (!this.ready) return;
    const levelInfo = levelFromXP(S.xp);
    const lvlStyle = LEVEL_STYLES[(levelInfo.level - 1) % LEVEL_STYLES.length];
    this._hue = lvlStyle.hue;
    const creature = COSMETICS.find((c) => c.id === S.equippedCreature);
    const pet = COSMETICS.find((c) => c.id === S.equippedPet);
    this._hero = S.hero || "boy";
    this._swordTier = getSwordTier();
    this._growth = dragonGrowth(levelInfo.level).id;
    this._mountPalette = creature && ELEMENT_PALETTES[creature.id]
      ? ELEMENT_PALETTES[creature.id] : (creature ? ELEMENT_PALETTES.starter : null);
    this._palette = creature && ELEMENT_PALETTES[creature.id]
      ? ELEMENT_PALETTES[creature.id] : hueRotatePalette(ELEMENT_PALETTES.starter, this._hue);
    this._petId = pet ? pet.id : null;
    this._breath = getDragonBreath();
    this.setBiome(arenaBiomeForWave(S.wave));
    const activeEnemy = getActiveEnemy();
    this._isBoss = !!(activeEnemy && activeEnemy.isBoss && activeEnemy.hp > 0);
    this._poisoned = !!(activeEnemy && activeEnemy.poisonTurns > 0 && activeEnemy.hp > 0);
    this._charging = !!(activeEnemy && activeEnemy.charging > 0);
    // Streak tiers: 3 glow + badge, 5 slash trails, 7 speed lines + sparks,
    // 10 white-gold blade and heavier hits. Built on the sword, not the ground.
    const fireLevel = S.streak >= 10 ? 4 : S.streak >= 7 ? 3 : S.streak >= 5 ? 2 : S.streak >= 3 ? 1 : 0;
    if (fireLevel > (this._fire || 0)) { Sound.play("fire"); this.streakFlare(fireLevel); }
    else if (fireLevel === 0 && (this._fire || 0) > 0) this.streakLost();
    this._fire = fireLevel;
    this._streak = S.streak;
    if (activeEnemy) {
      this._enemyGlow = activeEnemy.glow || "#ffffff";
      if (activeEnemy.isChest) {
        if (this._chestEnemyRef !== activeEnemy) { this._chestEnemyRef = activeEnemy; this._chestWasOpen = false; }
        this._enemyKind = "chest"; this._enemyName = null;
        const nowOpen = activeEnemy.hp <= 0;
        if (nowOpen && !this._chestWasOpen) {
          this._chestWasOpen = true;
          killTweensOf(this.enemyLayer);
          tweenTo(this.enemyLayer, { scale: { from: 1, to: 1.2 } }, { duration: 220, yoyo: true, ease: "quadOut" });
          const EB = this.enemyBox(), cx = EB.cx, cy = EB.cy;
          Sound.play("coin");
          this.burst(cx, cy, ["#ffcf3a", "#fff3a8", "#f2c440", "#ffffff"], 46, 0.28, { up: 0.22, g: 0.0011, life: 1100, extra: { front: true } });
          this.fx.push({ type: "ring", x: cx, y: cy, r: 18, color: "#fff3a8", t0: performance.now(), dur: 450 });
        }
        this._chestMode = nowOpen ? "open" : "idle";
      } else {
        this._enemyKind = "text"; this._chestEnemyRef = null;
        this._enemyName = activeEnemy.name || null;
        this.enemyText.text = activeEnemy.emoji;
        this.enemyText.glow = activeEnemy.glow || "#ffffff"; this.enemyText.glowBlur = 22;
      }
    }
    this.rebuildCaches();
    this.trackEnemyLife(activeEnemy);
  },

  /* Detects a kill (hp crossed to 0 on the enemy we were watching) and a
     new arrival (the active enemy object changed), which is what drives
     the dissolve-into-pixels death and the drop-in entrance. */
  trackEnemyLife(active) {
    if (!active) return;
    if (active !== this._trackRef) {
      const first = this._trackRef === null;
      const sameWave = !first && S.enemies.includes(this._trackRef);
      this._trackRef = active; this._trackHp = active.hp;
      if (!first && active.hp > 0) this.enemyEnter(active, sameWave);
      return;
    }
    if (this._trackHp > 0 && active.hp <= 0 && !active.isChest) this.enemyDie();
    this._trackHp = active.hp;
  },

  enemyEnter(enemy, fromQueue) {
    killTweensOf(this.enemyLayer);
    if (fromQueue && this._eTexW) {
      // The next foe in line steps forward from its spot in the queue.
      const q = this.queueSlot(1);
      tweenTo(this.enemyLayer, {
        y: { from: this.enemyBase.y - this.unit * 5, to: this.enemyBase.y },
        x: { from: this.enemyBase.x + (q.cx - (this.enemyBase.x + this._enemyBaseX + this._eTexW / 2)), to: this.enemyBase.x },
        scale: { from: q.sc, to: 1 }, alpha: { from: 0.6, to: 1 },
      }, { duration: 420, ease: "quadOut" });
      return;
    }
    this.enemyLayer.x = this.enemyBase.x;
    tweenTo(this.enemyLayer, { y: { from: this.enemyBase.y - this.H * 0.6, to: this.enemyBase.y }, alpha: { from: 0, to: 1 } }, {
      duration: 380, ease: "cubicIn",
      onComplete: () => {
        this.shakeUntil = performance.now() + 160; this.shakeMag = enemy.isBoss ? 1.4 : 0.6;
        this.burst(this.enemyBase.x, this.enemyBase.y - this.ap, BIOMES[this._biome] ? BIOMES[this._biome].ground : ["#aaa"], enemy.isBoss ? 30 : 16, 0.16, { up: 0.1, g: 0.0008, life: 500 });
      },
    });
  },

  enemyDie() {
    Sound.play("defeat");
    const strip = this.enemyStrips[0];
    this._deadRef = this._trackRef;
    const ox = this.enemyLayer.x + (this._enemyBaseX || 0), oy = this.enemyLayer.y + (this._enemyBaseY || 0);
    const glow = this._enemyGlow || "#ffffff";
    if (strip && strip.canvas) {
      // Sample the sprite texture on a coarse grid; every opaque sample
      // becomes a particle that keeps that spot's colour, so the monster
      // visibly bursts apart into its own colours.
      const c = strip.canvas, k = (strip.dw || c.width) / c.width;
      let data = null;
      try { data = c.getContext("2d").getImageData(0, 0, c.width, c.height).data; } catch (e) { data = null; }
      if (data) {
        const step = Math.max(2, Math.round(this.ap * 1.3 / k));
        for (let y = 0; y < c.height; y += step) for (let x = 0; x < c.width; x += step) {
          const o = (y * c.width + x) * 4;
          if (data[o + 3] < 128 || Math.random() < 0.35) continue;
          this.spawn({
            x: ox + x * k, y: oy + y * k, vx: (Math.random() - 0.5) * 0.12, vy: -0.05 - Math.random() * 0.14,
            g: 0.00025, life: 700 + Math.random() * 700, size: step * k * 1.1,
            color: `rgb(${data[o]},${data[o + 1]},${data[o + 2]})`, drag: 0.99, front: true,
          });
        }
      }
    }
    const EB = this.enemyBox(), cx = EB.cx, cy = EB.cy;
    this.fx.push({ type: "ring", x: cx, y: cy, r: 22, color: glow, t0: performance.now(), dur: 500 });
    this.burst(cx, cy, ["#ffcf3a", "#fff3a8"], 14, 0.22, { up: 0.18, g: 0.001, life: 900, extra: { front: true, shape: "plus" } });
  },

  /* ---------- geometry of the actual sprites ----------
     All effects aim at these, so slashes, impacts, numbers and the fireball
     land on the characters' bodies whatever their size. */
  enemyBox() {
    if (this._eTexW) {
      const x = this.enemyBase.x + this._enemyBaseX, y = this.enemyBase.y + this._enemyBaseY;
      return { x, y, w: this._eTexW, h: this._eTexH, cx: x + this._eTexW / 2, cy: y + this._eTexH * 0.55, top: y + this._eTexH * 0.12, left: x + this._eTexW * 0.12 };
    }
    const cy = this.enemyBase.y + this.dragonOriginY * 0.5;
    return { cx: this.enemyBase.x, cy, top: this.enemyBase.y + this.dragonOriginY * 0.9, left: this.enemyBase.x - this.unit * 12 };
  },
  playerBox() {
    const x = this.playerBase.x + (this._stripBaseX || 0), y = this.playerBase.y + (this._stripBaseY || 0);
    const w = this._texW || this.unit * 30, h = this._texH || this.unit * 36;
    return { x, y, w, h, cx: x + w * 0.5, cy: y + h * 0.55, top: y + h * 0.1, right: x + w * 0.9 };
  },

  /* ---------- combat hooks (called through BattleFX) ----------
     Timings are matched to the game logic: a correct answer deals its
     damage 350ms after the tap, and an enemy's hit lands 300ms after it
     starts its attack -- so each lunge PEAKS exactly when the hit lands. */
  playerAttack() {
    Sound.play("swing");
    killTweensOf(this.playerLayer);
    const P = this.playerBox(), E = this.enemyBox();
    const reach = Math.max(this.unit * 12, E.left - P.right + this.unit * 6);  // charge in and make contact
    tweenTo(this.playerLayer, { x: this.playerBase.x + reach }, {
      duration: 320, ease: "cubicIn",
      onComplete: () => tweenTo(this.playerLayer, { x: this.playerBase.x }, { duration: 240, ease: "quadOut" }),
    });
    const now = performance.now();
    this.fx.push({ type: "slash", x: E.cx, y: E.cy, t0: now + 250, dur: 280 });
    const lv = this._fire || 0;
    if (lv >= 2) this.fx.push({ type: "slash", x: E.cx, y: E.cy - this.unit * 2, t0: now + 290, dur: 320, big: true, white: lv >= 4 });
    if (lv >= 4) setTimeout(() => { const t = performance.now(); this.whiteUntil = t + 110; this.shakeUntil = t + 220; this.shakeMag = 1; }, 330);
    for (let k = 0; k < 8; k++) this.spawn({ x: P.x + P.w * 0.2, y: P.y + P.h * (0.75 + Math.random() * 0.2), vx: -0.04 - Math.random() * 0.05, vy: -0.02, life: 300, color: "#e8e0f0" });
  },
  playerHit() {
    Sound.play("hurt");
    const now = performance.now();
    this.shakeUntil = now + 300; this.shakeMag = 0.8; this.flashUntil = now + 350;
    this.playerFlashUntil = now + 110;
    killTweensOf(this.playerLayer);
    tweenTo(this.playerLayer, { x: this.playerBase.x - this.unit * 6 }, { duration: 55, yoyo: true, repeat: 3, ease: "sineInOut" });
    const P = this.playerBox();
    this.burst(P.cx, P.cy, ["#ff5a4a", "#ffffff", "#ffb04a"], 16, 0.25, { life: 420, extra: { front: true } });
  },
  enemyAttack() {
    Sound.play("enemySwing");
    killTweensOf(this.enemyLayer);
    this.enemyLayer.alpha = 1;
    const P = this.playerBox(), E = this.enemyBox();
    const reach = Math.max(this.unit * 12, E.left - P.right + this.unit * 6);
    tweenTo(this.enemyLayer, { x: this.enemyBase.x - reach }, {
      duration: 290, ease: "cubicIn",
      onComplete: () => tweenTo(this.enemyLayer, { x: this.enemyBase.x }, { duration: 240, ease: "quadOut" }),
    });
  },
  enemyHit() {
    Sound.play(this._enemyKind === "chest" ? "knock" : "hit");
    const now = performance.now();
    killTweensOf(this.enemyLayer); killTweensOf(this.enemyText);
    this.enemyLayer.alpha = 1; this.enemyLayer.y = this.enemyBase.y;
    this.enemyFlashUntil = now + 110;
    tweenTo(this.enemyText, { alpha: { from: 1, to: 0.25 } }, { duration: 60, yoyo: true, repeat: 1 });
    tweenTo(this.enemyLayer, { scale: { from: 1, to: 1.08 }, x: { from: this.enemyBase.x + this.unit * 4, to: this.enemyBase.x } }, { duration: 90, yoyo: true, ease: "quadOut" });
    const E = this.enemyBox();
    const glow = this._enemyGlow || "#ffffff";
    this.burst(E.cx, E.cy, [glow, "#ffffff", "#fff3a8"], 22, 0.3, { life: 480, extra: { front: true } });
    this.shakeUntil = now + 120; this.shakeMag = 0.4;
  },
  fireballCast() {
    Sound.play("fireball");
    const now = performance.now();
    const P = this.playerBox(), E = this.enemyBox();
    const m = this._mouth || { x: P.w, y: P.h * 0.3 };
    const x0 = P.x + m.x, y0 = P.y + m.y;          // from the dragon's mouth
    const x1 = E.cx, y1 = E.cy;                      // into the enemy's body
    this.fx.push({ type: "fireball", x0, y0, x1, y1, t0: now, dur: 500 });
    setTimeout(() => {
      const t = performance.now();
      this.fx.push({ type: "ring", x: x1, y: y1, r: 26, color: "#ffcf3a", t0: t, dur: 420 });
      this.fx.push({ type: "ring", x: x1, y: y1, r: 16, color: "#ff5a1a", t0: t + 60, dur: 420 });
      this.burst(x1, y1, ["#fff3b0", "#ffcf3a", "#ff7a1c", "#d8321f", "#5a2a1a"], 60, 0.42, { up: 0.08, g: 0.0007, life: 700, extra: { front: true } });
      this.whiteUntil = t + 140; this.shakeUntil = t + 320; this.shakeMag = 1.3;
      Sound.play("boom");
    }, 490);
  },
  showPopup(text, side, kind) {
    const B = side === "enemy" ? this.enemyBox() : this.playerBox();
    const colors = { dmg: "#ff6b5b", heal: "#6ee7a8", poison: "#9cff6a", crit: "#ffd700", block: "#9fd8ff", pet: "#ffd66e", breath: (this._breath && this._breath.colors[1]) || "#ffcf3a" };
    const color = colors[kind] || "#fff0e0";
    const fontSize = kind === "crit" ? Math.round(this.unit * 9) : Math.round(this.unit * 7.2);
    // Stagger popups that land at the same moment so "WEAK!" and the damage
    // number don't print on top of each other; keep them inside the stage.
    const stack = this.popups.filter((q) => q._side === side && q._age < 400).length;
    // Pet and dragon-breath numbers sit to the left, so they never print
    // over the sword's number that lands at nearly the same moment.
    const side2 = kind === "pet" || kind === "breath" ? -this.unit * 9 : 0;
    const x = Math.min(this.W - fontSize * 1.6, Math.max(fontSize * 1.6, B.cx + side2 + (stack % 2 ? this.unit * 7 : 0)));
    const y = Math.max(fontSize * 0.8, B.top - stack * fontSize * 0.9 + (side2 ? fontSize * 0.9 : 0));
    const p = makeSprite("text", {
      text, fontSize, color, x, y,
      stroke: "#140d10", strokeWidth: Math.max(3, Math.round(this.unit * 1.3)),
      fontFamily: "Nunito, sans-serif", fontWeight: 900, scale: 1.8, _side: side, _age: 0,
    });
    this.popups.push(p);
    tweenTo(p, { scale: 1, _age: 400 }, { duration: 160, ease: "quadOut" });
    tweenTo(p, { y: p.y - this.unit * 10 }, {
      delay: 120, duration: 2400, ease: "cubicOut",
      onComplete: () => { const i = this.popups.indexOf(p); if (i >= 0) this.popups.splice(i, 1); },
    });
    tweenTo(p, { alpha: { from: 1, to: 0 } }, { delay: 1100, duration: 1400 });
    if (kind === "crit") { Sound.play("crit"); const now = performance.now(); this.whiteUntil = now + 120; this.shakeUntil = now + 260; this.shakeMag = 1.1; }
    if (kind === "heal") this.burst(B.cx, B.cy, ["#6ee7a8", "#c8ffe0"], 12, 0.08, { up: 0.08, g: -0.00005, life: 900, extra: { shape: "plus", front: true } });
  },
  /* Poison potion: a green vial tumbles from the rider's hand in an arc and
     shatters on the enemy in a green splash. */
  poisonThrow() {
    Sound.play("swing");
    const P = this.playerBox(), E = this.enemyBox();
    const hilt = this._blade && this._blade.length ? this._blade[this._blade.length - 1] : { x: P.w * 0.6, y: P.h * 0.4 };
    const x0 = this.playerLayer.x - this.playerBase.x + P.x + hilt.x, y0 = P.y + hilt.y;
    const dur = 560;
    this.fx.push({ type: "vial", x0, y0, x1: E.cx, y1: E.cy, t0: performance.now(), dur });
    setTimeout(() => {
      const t = performance.now(), E2 = this.enemyBox();
      Sound.play("shatter"); Sound.play("poison");
      this.fx.push({ type: "ring", x: E2.cx, y: E2.cy, r: 22, color: "#7dff5a", t0: t, dur: 460 });
      this.burst(E2.cx, E2.cy, ["#b6ff7a", "#6ee04a", "#2f9a2a", "#e8ffd0"], 46, 0.34, { up: 0.12, g: 0.0012, life: 820, extra: { front: true } });
      this.burst(E2.cx, E2.cy, ["#e8f6ff", "#bfe9d0"], 10, 0.3, { up: 0.08, g: 0.0012, life: 520, extra: { front: true, shape: "plus" } });
      for (let k = 0; k < 10; k++) this.spawn({ x: E2.cx + (Math.random() - 0.5) * E2.w * 0.5, y: E2.cy - E2.h * 0.1 + Math.random() * E2.h * 0.3, vy: 0.02 + Math.random() * 0.03, g: 0.0004, life: 900 + Math.random() * 500, color: Math.random() < 0.5 ? "#6ee04a" : "#2f9a2a", front: true });
      this.enemyFlashUntil = t + 90;
      this.showPopup("POISONED!", "enemy", "poison");
    }, dur);
  },
  playerBlock(left) {
    Sound.play("clink");
    const P = this.playerBox(), now = performance.now();
    this.fx.push({ type: "ring", x: P.cx, y: P.cy, r: Math.max(P.w, P.h) * 0.42, color: "#9fd8ff", t0: now, dur: 420 });
    this.burst(P.x + P.w * 0.85, P.cy, ["#e8f6ff", "#9fd8ff", "#f2c440"], 18, 0.22, { life: 420, extra: { front: true, shape: "plus" } });
    this.showPopup(left > 0 ? `BLOCKED! (${left} left)` : "BLOCKED!", "player", "block");
    this.shakeUntil = now + 120; this.shakeMag = 0.3;
  },
  showImpact(side) {
    const B = side === "enemy" ? this.enemyBox() : this.playerBox();
    this.fx.push({ type: "star", x: B.cx, y: B.cy, color: side === "enemy" ? "#ffcf3a" : "#ff5a4a", t0: performance.now(), dur: 280 });
  },
};

/* Colours for the HD hero drawings, from the same per-hero palettes. */
function hdHeroLook(hero, tier) {
  const girl = hero === "girl";
  const P = heroPaletteForTier(tier, hero);
  return {
    hero: girl ? "girl" : "boy", skin: "#f3c08e",
    hair: girl ? P.hairF : "#3a2a20", armor: P.armor, cape: girl ? P.clothF : P.clothM,
    leather: girl ? "#6a3a4e" : "#7a4a2a", blade: P.bladeColor, hilt: "#f2c440",
    gem: girl ? "#ee5a9a" : SWORD_GEMS[Math.max(0, (tier || 1) - 1)],
  };
}

/* The rider's palette with the sword recoloured to the owned DMG tier. */
function heroPaletteForTier(tier, hero) {
  const t = SWORD_TIERS[Math.max(0, Math.min(SWORD_TIERS.length - 1, tier || 0))];
  const base = HERO_PALETTES[hero === "girl" ? "girl" : "boy"];
  return Object.assign({}, base, { bladeColor: t.blade, hiltColor: t.hilt });
}

/* ---------- plumbing: host element, loop, resize sync ---------- */
const battleStageHost = document.createElement("div");
battleStageHost.id = "battle-stage-host";
const battleCanvas = document.createElement("canvas");
battleStageHost.appendChild(battleCanvas);
document.body.appendChild(battleStageHost);

let stageAwake = false;
let lastFrame = 0;

function ensureBattleGame(width, height) {
  if (BattleStage.ready) return;
  BattleStage.init(battleCanvas);
  resizeStage(width, height);
  BattleStage.syncFromState();
  requestAnimationFrame(frameLoop);
}

function resizeStage(w, h) {
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  battleCanvas.width = Math.max(1, Math.round(w * dpr));
  battleCanvas.height = Math.max(1, Math.round(h * dpr));
  battleCanvas.style.width = `${w}px`;
  battleCanvas.style.height = `${h}px`;
  const ctx = battleCanvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  BattleStage.dpr = dpr;
  BattleStage.layout(w, h);
}

function setBattleLoopAwake(awake) { stageAwake = awake; }

function frameLoop(now) {
  requestAnimationFrame(frameLoop);
  const dt = Math.min(50, now - (lastFrame || now));
  lastFrame = now;
  if (!stageAwake || !BattleStage.ready || document.hidden) return;
  updateTweens(dt);
  BattleStage.draw(now);
}

function syncBattleStage() {
  const anchor = document.getElementById("battlefield-anchor");
  if (!anchor) { battleStageHost.style.display = "none"; setBattleLoopAwake(false); return; }
  const r = anchor.getBoundingClientRect();
  battleStageHost.style.display = "block";
  battleStageHost.style.left = `${r.left + window.scrollX}px`;
  battleStageHost.style.top = `${r.top + window.scrollY}px`;
  battleStageHost.style.width = `${r.width}px`;
  battleStageHost.style.height = `${r.height}px`;
  const w = Math.round(r.width), h = Math.round(r.height);
  if (w <= 0 || h <= 0) return;
  if (!BattleStage.ready) { ensureBattleGame(w, h); setBattleLoopAwake(true); return; }
  setBattleLoopAwake(true);
  if (BattleStage.W !== w || BattleStage.H !== h) resizeStage(w, h);
  BattleStage.syncFromState();
}
window.addEventListener("resize", syncBattleStage);
window.addEventListener("orientationchange", () => setTimeout(syncBattleStage, 250));

const BattleFX = {
  playerAttack() { if (BattleStage.ready) BattleStage.playerAttack(); },
  playerHit() { if (BattleStage.ready) BattleStage.playerHit(); },
  enemyAttack() { if (BattleStage.ready) BattleStage.enemyAttack(); },
  enemyHit() { if (BattleStage.ready) BattleStage.enemyHit(); },
  fireballCast() { if (BattleStage.ready) BattleStage.fireballCast(); },
  showPopup(text, side, kind) { if (BattleStage.ready) BattleStage.showPopup(text, side, kind); },
  showImpact(side) { if (BattleStage.ready) BattleStage.showImpact(side); },
  playerBlock(left) { if (BattleStage.ready) BattleStage.playerBlock(left); },
  poisonThrow() { if (BattleStage.ready) BattleStage.poisonThrow(); else Sound.play("poison"); },
  dragonBreath(b) { if (BattleStage.ready) BattleStage.dragonBreath(b); else Sound.play("breath_" + b.style); },
  petAttack(kind) { if (BattleStage.ready) BattleStage.petAttack(kind); else Sound.play("pet"); },
};

render();
</script>
