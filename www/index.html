<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#140b24" />
<meta name="color-scheme" content="dark" />
<title>Dragons vs Math</title>
<style>
/* Fonts are bundled in www/fonts (SIL OFL) instead of loaded from Google
   Fonts: the Android app has no INTERNET permission and must look right
   fully offline. "MedievalSharp" is aliased to Nunito so every
   existing heading picks up the readable UI font without touching each rule. */
@font-face { font-family: 'Pixelify Sans'; src: url('fonts/pixelify-sans.woff2') format('woff2'); font-weight: 400 700; font-display: block; }
@font-face { font-family: 'MedievalSharp'; src: url('fonts/nunito.woff2') format('woff2'); font-weight: 200 1000; font-display: swap; }
@font-face { font-family: 'Nunito'; src: url('fonts/nunito.woff2') format('woff2'); font-weight: 200 1000; font-display: swap; }

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

.wrap {
  width: 100%;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(circle at 50% 0%, #5a2d10 0%, transparent 55%),
    radial-gradient(circle at 90% 90%, #3a1f0a 0%, transparent 50%),
    linear-gradient(180deg, #1b120a 0%, #0f0906 100%);
  font-family: 'Nunito', sans-serif;
  color: #f0e0c0;
  padding: 16px;
  position: relative;
}

.card {
  width: 100%;
  max-width: 420px;
  background:
    radial-gradient(circle at 20% 0%, rgba(255,180,90,0.06), transparent 55%),
    #241708;
  border: 2px solid #8a5a1f;
  border-radius: 18px;
  padding: 28px 22px;
  text-align: center;
  box-shadow: 0 0 0 4px #120b04, 0 0 0 6px #c99a3f, 0 20px 50px rgba(0,0,0,0.6);
  position: relative;
}

.card::before, .card::after, .arena::before, .arena::after {
  content: "";
  position: absolute;
  width: 22px;
  height: 22px;
  border: 3px solid #e8c878;
  opacity: 0.9;
}
.card::before, .arena::before { top: 6px; left: 6px; border-right: none; border-bottom: none; }
.card::after, .arena::after { bottom: 6px; right: 6px; border-left: none; border-top: none; }

.title-emoji { font-size: 64px; margin-bottom: 4px; filter: drop-shadow(0 0 10px rgba(244,200,105,0.5)); }

h1 {
  font-family: 'MedievalSharp', serif;
  /* clamp(min, fluid, max) instead of a fixed size: shrinks automatically
     on a narrow phone rather than spilling past the card edge. */
  font-size: clamp(20px, 6.5vw, 28px);
  letter-spacing: 0.5px;
  margin: 6px 0 8px;
  color: #f4c869;
  text-shadow: 0 0 10px rgba(244,200,105,0.5);
  overflow-wrap: break-word;
  word-break: break-word;
}

.sub { color: #d8c3a0; font-size: 14px; margin-bottom: 16px; }

.rules {
  text-align: left;
  list-style: none;
  padding: 0;
  margin: 0 0 22px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  font-size: 13.5px;
  color: #ecd9b8;
}

.btn {
  border: none;
  cursor: pointer;
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
}

.btn.primary {
  background: linear-gradient(180deg, #ff8a4c, #e85d2e);
  color: #2a1206;
  border-radius: 14px;
  box-shadow: 0 6px 0 #7a3a10, 0 10px 20px rgba(232,93,46,0.35);
}

.btn.primary:active { transform: translateY(4px); box-shadow: 0 2px 0 #7a3a10; }
.btn.big { padding: 16px 28px; font-size: 18px; width: 100%; }

.btn.ghost {
  background: transparent;
  color: #d8c3a0;
  border: 1px solid #8a5a1f;
  border-radius: 12px;
  padding: 10px 18px;
  width: 100%;
  margin-top: 10px;
  font-size: 14px;
}

.arena {
  width: 100%;
  max-width: 420px;
  /* Default torch-lit dungeon backdrop, shown whenever no background
     cosmetic is equipped (see BACKGROUND_STYLES) so the arena never
     reads as an empty black box out of the box. */
  background:
    radial-gradient(circle at 12% 100%, rgba(255,150,60,0.22), transparent 55%),
    radial-gradient(circle at 88% 100%, rgba(255,150,60,0.22), transparent 55%),
    radial-gradient(circle at 50% -10%, rgba(255,200,120,0.10), transparent 60%),
    linear-gradient(180deg, #2a1a0c 0%, #17100a 55%, #0d0803 100%);
  border: 2px solid #8a5a1f;
  border-radius: 18px;
  padding: 16px;
  box-shadow: 0 0 0 4px #120b04, 0 0 0 6px #c99a3f, 0 20px 50px rgba(0,0,0,0.6);
  position: relative;
  overflow: hidden;
}

.arena.damage-flash::before {
  content: "";
  position: absolute;
  inset: 0;
  box-shadow: inset 0 0 60px 12px rgba(255,40,40,0.65);
  animation: dmgFlash 0.4s ease;
  pointer-events: none;
  z-index: 6;
}

@keyframes dmgFlash {
  0% { opacity: 0; }
  30% { opacity: 1; }
  100% { opacity: 0; }
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: 'MedievalSharp', serif;
  font-size: 14px;
  color: #f4c869;
  letter-spacing: 0.5px;
}

.topbar-actions { display: flex; gap: 6px; align-items: center; }

.topbar.sub-row { color: #d8c3a0; font-size: 12px; margin-top: 2px; font-family: 'Nunito', sans-serif; font-weight: 800; }

.icon-btn {
  background: #3a2814;
  border: 1px solid #8a5a1f;
  color: #f4c869;
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
  font-size: 12px;
  padding: 5px 10px;
  border-radius: 10px;
  cursor: pointer;
}

/* Math Rank: the kid's visible skill track. Deliberately styled as an
   achievement badge (purple/gold, like the XP bar) rather than as a score,
   so it reads as "look what I unlocked" not "here is your grade". */
.hero-pick {
  display: flex;
  gap: 14px;
  justify-content: center;
  margin: 18px 0 8px;
}
.hero-card {
  flex: 1;
  max-width: 160px;
  background: linear-gradient(180deg, #2b1b0b, #1d1207);
  border: 2px solid #8a5a1f;
  border-radius: 16px;
  padding: 12px 8px 10px;
  cursor: pointer;
  font-family: 'MedievalSharp', serif;
  color: #f4c869;
  font-size: 16px;
}
.hero-card:active { transform: scale(0.97); }
.hero-portrait {
  display: block;
  margin: 0 auto 6px;
}

.rank-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin: 4px 0 2px;
}
.rank-badge {
  font-family: 'MedievalSharp', serif;
  font-size: 12px;
  color: #e9d5ff;
  background: linear-gradient(180deg, rgba(147,197,253,0.18), rgba(192,132,252,0.18));
  border: 1px solid #7c5aa8;
  border-radius: 999px;
  padding: 3px 10px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.rank-prog { font-size: 10px; color: #b09a78; white-space: nowrap; }

/* Full-screen boss takeover: the arena fades to black, the warning scales
   up, and nothing continues until FIGHT is pressed. */

/* Journey screen: replaces the old rules card. Same full-bleed treatment
   as the boss intro so the game has one consistent "something is about to
   happen" visual language, with a painted forest behind it instead of a
   flat fade to black. */
.journey {
  position: relative;
  width: 100%;
  max-width: 420px;
  margin: 0 auto;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 0 0 4px #120b04, 0 0 0 6px #c99a3f, 0 20px 50px rgba(0,0,0,0.6);
}
.journey-bg {
  display: block;
  width: 100%;
  height: auto;
}
.journey-inner {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
  background: linear-gradient(180deg, rgba(10,8,4,0.15) 0%, rgba(8,6,3,0.55) 100%);
}
.journey-title {
  font-family: 'MedievalSharp', serif;
  font-size: clamp(22px, 7.5vw, 34px);
  color: #f4c869;
  text-shadow: 0 0 16px rgba(244,200,105,0.7), 0 3px 0 #4a2f04;
  margin-bottom: 6px;
  max-width: 92%;
  overflow-wrap: break-word;
}
.journey-lead {
  font-family: 'MedievalSharp', serif;
  font-size: clamp(15px, 4.5vw, 19px);
  letter-spacing: 1px;
  color: #ffd9c8;
  text-shadow: 0 0 12px rgba(255,150,90,0.6);
  margin-bottom: 4px;
}
.journey-sub {
  font-size: 13px;
  color: #d8c3a0;
  margin-bottom: 22px;
  max-width: 88%;
  overflow-wrap: break-word;
}
.journey-btn {
  font-family: 'MedievalSharp', serif;
  font-size: 22px;
  letter-spacing: 2px;
  color: #2a1206;
  background: linear-gradient(180deg, #ffcf6e, #e0972e);
  border: 3px solid #ffe6a8;
  border-radius: 14px;
  padding: 12px 48px;
  cursor: pointer;
  box-shadow: 0 0 22px rgba(255,200,90,0.5);
  margin-bottom: 16px;
}
.journey-btn:active { transform: scale(0.96); }
.journey-links {
  display: flex;
  gap: 10px;
}

.boss-intro {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.92);
  animation: bossFadeIn 0.55s ease forwards;
}
.boss-intro-inner { text-align: center; padding: 0 20px; }
/* Any later re-render while the takeover is up must not replay its entrance. */
.boss-intro.seen, .boss-intro.seen .boss-intro-lead, .boss-intro.seen .boss-intro-name { animation: none; }
.boss-intro-warn {
  font-size: 54px;
  margin-bottom: 6px;
  animation: bossPulse 1.1s ease-in-out infinite;
}
.boss-intro-lead {
  font-family: 'MedievalSharp', serif;
  font-size: 30px;
  letter-spacing: 3px;
  color: #ff3b2a;
  text-shadow: 0 0 18px rgba(255,59,42,0.75), 0 3px 0 #4a0a04;
  animation: bossZoom 0.6s cubic-bezier(.2,1.4,.4,1) forwards;
}
.boss-intro-name {
  font-family: 'MedievalSharp', serif;
  font-size: clamp(24px, 9vw, 40px);
  color: #ffd9c8;
  text-shadow: 0 0 22px rgba(255,110,80,0.9);
  margin: 10px 0 26px;
  max-width: 92vw;
  overflow-wrap: break-word;
  word-break: break-word;
  animation: bossZoom 0.6s 0.12s cubic-bezier(.2,1.4,.4,1) backwards;
}
.boss-intro-btn {
  font-family: 'MedievalSharp', serif;
  font-size: 28px;
  letter-spacing: 2px;
  color: #fff0e8;
  background: linear-gradient(180deg, #d8321f, #7a1108);
  border: 3px solid #ff8a6a;
  border-radius: 14px;
  padding: 14px 52px;
  cursor: pointer;
  box-shadow: 0 0 26px rgba(255,70,40,0.55);
  animation: bossPulse 1.4s ease-in-out infinite;
}
.boss-intro-btn:active { transform: scale(0.96); }

@keyframes bossFadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes bossZoom {
  from { opacity: 0; transform: scale(2.1); }
  to   { opacity: 1; transform: scale(1); }
}
@keyframes bossPulse {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.07); }
}

/* Boss announcements are red and shake, so they read as a warning rather
   than the celebratory purple used for a Math Rank promotion. */
.boss-banner {
  background: linear-gradient(180deg, #b8231a, #6e0f0a) !important;
  color: #ffe3d8 !important;
  border-color: #ff6a4a !important;
  letter-spacing: 1px;
  animation: bossShake 0.5s ease;
}
@keyframes bossShake {
  0%   { transform: translateX(0) scale(0.9); opacity: 0; }
  25%  { transform: translateX(-4px) scale(1.04); opacity: 1; }
  50%  { transform: translateX(4px) scale(1); }
  75%  { transform: translateX(-2px); }
  100% { transform: translateX(0); }
}


.xpbar-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 6px 0 10px;
}

.xpbar {
  flex: 1;
  height: 8px;
  background: #150d05;
  border-radius: 6px;
  overflow: hidden;
  border: 1px solid #6a4a20;
}

.xpfill {
  height: 100%;
  background: linear-gradient(90deg, #93c5fd, #c084fc);
  transition: width 0.4s ease;
}

.xptext { font-size: 10px; color: #d8c3a0; white-space: nowrap; }

.combatant { margin-bottom: 6px; }

.name-row {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  font-weight: 800;
  margin-bottom: 4px;
  color: #ecd9b8;
}

.hpbar {
  width: 100%;
  height: 12px;
  background: #150d05;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid #6a4a20;
}

.hpfill { height: 100%; transition: width 0.4s ease; }
.player-fill { background: linear-gradient(90deg, #34d399, #10b981); }

.stage {
  position: relative;
  height: 100px;
  display: flex;
  align-items: center;
  margin: 4px 0 10px;
}

.enemy-stage { justify-content: flex-end; }
.player-stage { justify-content: flex-start; }

.portrait-frame {
  width: 92px;
  height: 92px;
  border-radius: 50%;
  border: 3px solid #d4af37;
  background: radial-gradient(circle, rgba(255,200,120,0.10), transparent 70%);
  box-shadow: inset 0 0 14px rgba(0,0,0,0.65), 0 0 14px rgba(212,175,55,0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  flex-shrink: 0;
}

.enemy-frame { margin-left: 8px; }
.player-frame { margin-right: 8px; }

.portrait-frame .emoji-sprite { font-size: 56px; }

.emoji-sprite {
  font-size: 68px;
  line-height: 1;
  transition: transform 0.15s ease;
}

.player-sprite { transform: scaleX(-1); position: relative; z-index: 1; }
.player-sprite-wrap { position: relative; display: inline-block; }

.player-canvas {
  width: 92px;
  height: auto;
  position: relative;
  z-index: 1;
  display: block;
  image-rendering: pixelated;
  image-rendering: -moz-crisp-edges;
  image-rendering: crisp-edges;
}

.pet-badge {
  position: absolute;
  bottom: -6px;
  left: -6px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #3a2814, #201408);
  border: 2px solid #d4af37;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  box-shadow: 0 0 8px rgba(0,0,0,0.65), 0 0 6px rgba(212,175,55,0.5);
  z-index: 3;
}

.aura-ring {
  position: absolute;
  inset: -12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 76px;
  opacity: 0.55;
  animation: auraPulse 1.6s ease-in-out infinite;
  z-index: 0;
}

@keyframes auraPulse {
  0%, 100% { transform: scale(0.9); opacity: 0.4; }
  50% { transform: scale(1.05); opacity: 0.65; }
}

.lunge-right { animation: lungeRight 0.35s ease; }
.lunge-left { animation: lungeLeft 0.3s ease; }
.hit { animation: hitFlash 0.4s ease; }

@keyframes lungeRight {
  0% { transform: scaleX(-1) translateX(0); }
  50% { transform: scaleX(-1) translateX(60px) rotate(-8deg); }
  100% { transform: scaleX(-1) translateX(0); }
}

@keyframes lungeLeft {
  0% { transform: translateX(0); }
  50% { transform: translateX(-60px) rotate(8deg); }
  100% { transform: translateX(0); }
}

@keyframes hitFlash {
  0% { filter: brightness(1); }
  30% { filter: brightness(2.2) saturate(3); }
  100% { filter: brightness(1); }
}

.popup-overlay-layer {
  position: fixed;
  pointer-events: none;
  z-index: 50;
}

.popup {
  position: absolute;
  top: 0;
  font-family: 'MedievalSharp', serif;
  font-weight: 400;
  font-size: 57.6px;
  animation: floatUp 2.6s ease forwards;
  pointer-events: none;
  z-index: 4;
}

.popup.dmg { color: #ff6b5b; text-shadow: 0 0 8px rgba(255,107,91,0.8); left: 30%; }
.popup.heal { color: #6ee7a8; text-shadow: 0 0 8px rgba(110,231,168,0.8); left: 30%; }
.popup.poison { color: #6ee76e; text-shadow: 0 0 8px rgba(110,231,110,0.8); left: 30%; }
.popup.crit { color: #ffd700; text-shadow: 0 0 12px rgba(255,215,0,0.9); left: 30%; font-size: 69px; }

@keyframes floatUp {
  0%   { opacity: 0; transform: translateY(10px); }
  12%  { opacity: 1; }
  55%  { opacity: 1; transform: translateY(-24px); }
  100% { opacity: 0; transform: translateY(-56px); }
}

.impact-burst {
  position: absolute;
  top: 14%;
  left: 34%;
  font-size: 46px;
  animation: impactPop 0.45s ease forwards;
  pointer-events: none;
  z-index: 5;
  filter: drop-shadow(0 0 10px rgba(255,180,60,0.85));
}

@keyframes impactPop {
  0% { opacity: 0; transform: scale(0.3) rotate(-10deg); }
  30% { opacity: 1; transform: scale(1.35) rotate(8deg); }
  100% { opacity: 0; transform: scale(1) rotate(0deg); }
}

.fireball-projectile {
  position: absolute;
  left: 12%;
  bottom: 66px;
  font-size: 40px;
  z-index: 5;
  animation: fireballFly 0.5s ease-in forwards;
  filter: drop-shadow(0 0 14px #ff6a2c);
}

@keyframes fireballFly {
  0% { left: 12%; transform: scale(0.6) rotate(0deg); opacity: 1; }
  100% { left: 80%; transform: scale(1.4) rotate(320deg); opacity: 1; }
}

.banner {
  text-align: center;
  font-family: 'MedievalSharp', serif;
  color: #f4c869;
  font-size: 15px;
  margin: 4px 0 8px;
  animation: floatUp 1.1s ease forwards;
}

.problem-card {
  background: #17100a;
  border: 1px solid #6a4a20;
  border-radius: 16px;
  padding: 16px;
  margin-top: 8px;
  text-align: center;
}

.streak { font-size: 12px; color: #f4c869; height: 16px; margin-bottom: 2px; }

.problem {
  font-family: 'MedievalSharp', serif;
  font-size: 34px;
  font-weight: 400;
  color: #f4e6c8;
  margin-bottom: 14px;
  letter-spacing: 1px;
}

.choices {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 10px;
}

.choice {
  background: #3a2814;
  border: 1px solid #6a4a20;
  color: #f0e0c0;
  font-size: 22px;
  padding: 14px 0;
  border-radius: 12px;
  transition: transform 0.1s ease, background 0.15s ease;
}

.choice:active { transform: scale(0.95); background: #4a3420; }
.choice:disabled { opacity: 0.6; }

.fireball-btn {
  width: 100%;
  margin-top: 8px;
  background: #3a2814;
  border: 1px solid #6a4a20;
  color: #d8c3a0;
  font-size: 12.5px;
  padding: 10px 0;
  border-radius: 10px;
}

.fireball-btn.ready {
  background: linear-gradient(180deg, #ff8a4c, #e85d2e);
  color: #2a1206;
  border-color: #a83e18;
  box-shadow: 0 0 14px rgba(255,120,50,0.7);
  animation: fireballPulse 1s ease-in-out infinite;
}

.fireball-btn:disabled { opacity: 0.55; }

@keyframes fireballPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.03); }
}

.shake { animation: shakeScreen 0.35s ease; }
@keyframes shakeScreen {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-8px); }
  40% { transform: translateX(8px); }
  60% { transform: translateX(-5px); }
  80% { transform: translateX(5px); }
}

.shop-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10,6,15,0.75);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 50;
}

.shop-card {
  width: 100%;
  max-width: 420px;
  max-height: 85vh;
  overflow-y: auto;
  background: #241708;
  border: 2px solid #8a5a1f;
  border-radius: 18px;
  padding: 18px;
}

.shop-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.shop-header h2 { font-family: 'MedievalSharp', serif; color: #f4c869; font-size: 22px; margin: 0; }

.shop-section-title {
  font-family: 'MedievalSharp', serif;
  color: #f4c869;
  font-size: 15px;
  margin: 14px 0 8px;
  text-align: left;
}
.shop-section-title .dmg-total { font-family: 'Nunito', sans-serif; font-size: 11px; color: #93c5fd; font-weight: 800; }

.close-btn {
  background: #3a2814;
  border: 1px solid #8a5a1f;
  color: #f0e0c0;
  border-radius: 8px;
  width: 30px;
  height: 30px;
  cursor: pointer;
  font-size: 14px;
}

.shop-coins { color: #f4c869; font-weight: 800; font-size: 14px; margin: 8px 0 14px; }

.shop-list { display: flex; flex-direction: column; gap: 10px; }

.shop-item {
  display: flex;
  align-items: center;
  gap: 12px;
  background: #17100a;
  border: 1px solid #6a4a20;
  border-radius: 12px;

.levelup-choice-icon { font-size: 28px; flex-shrink: 0; }
.levelup-choice-info { flex: 1; }
.levelup-choice-name {
  font-weight: 800;
  font-size: 14px;
  color: #f4c869;
  overflow-wrap: break-word;
  word-break: break-word;
}
.levelup-choice-desc { font-size: 12px; color: #d8c3a0; margin-top: 2px; }

.choose-note { color: #f4c869 !important; font-weight: 800; margin: 10px 0 12px !important; }

.save-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }

.save-slot {
  display: flex;
  align-items: center;
  gap: 12px;
  background: #17100a;
  border: 1px solid #6a4a20;
  border-radius: 12px;

}

.save-slot-info { flex: 1; }
.save-slot-name-row { display: flex; align-items: center; gap: 6px; }
.save-slot-name {
  font-family: 'MedievalSharp', serif;
  color: #f4c869;
  font-size: 16px;

}
.save-slot-summary { font-size: 11.5px; color: #b09a78; margin-top: 3px; }

.save-slot-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

.delete-btn {
  background: #3a2814;
  border: 1px solid #8a5a1f;
  color: #d8c3a0;
  font-size: 13px;
  padding: 8px 9px;

}

.confirm-delete {
  background: linear-gradient(180deg, #f4574f, #c0281f);
  color: #fff3ee;
  border: 1px solid #7a1a14;

}

.cancel-delete {

  border: 1px solid #8a5a1f;

}

.edit-btn {

.play-slot {

.levelup-overlay {

.fireworks { position: absolute; inset: 0; }

@keyframes fireworkBurst {

.levelup-card {

  max-width: 420px;

.levelup-emoji { font-size: 46px; margin-bottom: 6px; }
.levelup-card h2 { font-family: 'MedievalSharp', serif; color: #f4c869; font-size: 26px; margin: 0 0 10px; }
.levelup-card p { font-size: 14px; color: #ecd9b8; margin: 4px 0; }
.range-note { color: #93c5fd !important; font-weight: 800; margin-bottom: 16px !important; }

/* ---------- multi-enemy row ---------- */
.enemy-multi-row {

.enemy-mini {

.mini-hpbar {

/* ---------- potions ---------- */
.potion-row {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}

.potion-btn {

.potion-btn.ready.hp-ready {

}

.potion-charge-note { font-size: 10.5px; color: #b09a78; margin-top: 4px; text-align: center; }

/* ---------- canvas battle stage ----------
   This anchor is just an empty placeholder sized by CSS; the actual
   <canvas> (BattleStage, no engine dependency) is a persistent element
   outside #root -- so it survives the innerHTML rewrites in render() --
   and gets positioned on top of this div every render via
   syncBattleStage(). */
.battlefield-anchor {
  width: 100%;
  height: 230px;
  margin: 4px 0 6px;
  position: relative;
}
/* Positioned in DOCUMENT coordinates (absolute), not viewport coordinates
   (fixed). With `fixed`, the canvas only moved when syncBattleStage() ran
   -- on render and resize, but never on scroll -- so scrolling the page
   left the sprites glued to the screen while the arena moved out from
   under them. `absolute` + scroll-offset coords means the browser scrolls
   it natively and no scroll listener is needed. */
#battle-stage-host {
  position: absolute;
  pointer-events: none;
  z-index: 3;
}

/* =====================================================================
   GAME SKIN (v3: smooth)
   Everything below overrides the original look so the game reads as one
   consistent world: rounded gold-trimmed panels, a heavy rounded font,
   bevelled buttons and glossy HP bars. The original rules above are left
   in place so layout and behaviour don't change -- this block only
   restyles them.
   ===================================================================== */
:root {
  --ink: #0c0714;
  --gold: #f4c869;
  --gold-hi: #ffe7a3;
  --gold-lo: #8a5a1c;
  --text: #f3e9ff;
  --text-dim: #b9a9d6;
  --panel: #221634;
  --panel-2: #1b1329;
  --ember: #ff7a3c;
  --px: 3px;
  /* Rounded, heavy and unambiguous for early readers (the pixel font's
     5/S, 2/Z and 6/8 were too alike). The pixel font is kept only for
     the title logo, where it is decoration rather than information. */
  --font-ui: 'Nunito', system-ui, sans-serif;
  --safe-top: max(env(safe-area-inset-top, 0px), var(--safe-area-inset-top, 0px));
  --safe-bottom: max(env(safe-area-inset-bottom, 0px), var(--safe-area-inset-bottom, 0px));
  --safe-left: max(env(safe-area-inset-left, 0px), var(--safe-area-inset-left, 0px));
  --safe-right: max(env(safe-area-inset-right, 0px), var(--safe-area-inset-right, 0px));
}

html, body {
  background: #140b24;
  color: var(--text);
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  touch-action: manipulation;
}

/* Night-sky page: a deep violet gradient plus two tiled layers of pixel
   stars (hard-edged 2px dots), so the space around the game card never
   reads as an empty browser page on tablets. */
.wrap {
  font-family: 'Nunito', sans-serif;
  image-rendering: auto;
  color: var(--text);
  padding: calc(12px + var(--safe-top)) calc(12px + var(--safe-right)) calc(12px + var(--safe-bottom)) calc(12px + var(--safe-left));
  background:
    radial-gradient(circle, #fff6 1px, transparent 1.5px) 0 0 / 97px 89px,
    radial-gradient(circle, #ffe7a355 1px, transparent 1.5px) 40px 30px / 151px 131px,
    radial-gradient(ellipse at 50% 120%, #ff7a3c33 0%, transparent 55%),
    radial-gradient(ellipse at 50% -10%, #6b3fa044 0%, transparent 60%),
    linear-gradient(180deg, #1d1033 0%, #140b24 55%, #0d0718 100%);
}

/* ---------- pixel frames ---------- */
.card, .arena, .shop-card, .levelup-card, .journey {
  --frame: #e0a838;
  border: 3px solid var(--frame);
  border-radius: 22px;
  background-clip: padding-box;
  box-shadow: 0 0 0 3px var(--ink), inset 0 0 0 2px rgba(255,231,163,0.18), 0 0 26px rgba(224,168,56,0.18), 0 18px 40px rgba(0,0,0,0.55);
}
.card, .shop-card, .levelup-card {
  background:
    linear-gradient(180deg, rgba(255,231,163,0.06), transparent 40%),
    var(--panel);
  background-clip: padding-box;
}
.card { padding: 22px 18px; }
.arena { padding: 14px 14px 16px; background: var(--panel-2); background-clip: padding-box; overflow: visible; }
.shop-card { padding: 16px; --frame: #7d6fa0; border-color: var(--frame); }
.levelup-card { --frame: #a26cf0; border-color: var(--frame); padding: 22px 16px; box-shadow: 0 0 0 3px var(--ink), 0 0 40px rgba(162,108,240,0.45); }
.journey { background: var(--ink); overflow: hidden; }

.card::before, .card::after, .arena::before, .arena::after { display: none; }
.arena.damage-flash::before {
  display: block; width: auto; height: auto; border: none; inset: -12px;
  box-shadow: inset 0 0 60px 16px rgba(255,40,40,0.6);
}

h1, .journey-title, .shop-header h2, .levelup-card h2 {
  font-family: var(--font-ui);
  font-weight: 900;
  letter-spacing: 1px;
  color: var(--gold);
  text-shadow: 0 3px 0 var(--ink), 3px 0 0 var(--ink), -3px 0 0 var(--ink), 0 -3px 0 var(--ink), 0 6px 0 #00000066;
}
.title-emoji { filter: drop-shadow(0 3px 0 var(--ink)); }
.sub { color: var(--text-dim); }

/* ---------- pixel buttons ----------
   The four 0-offset box-shadows draw a 3px outline with the corners
   missing, which is exactly a hand-drawn pixel button's chamfered edge.
   The inset shadows are the bevel: light top-left, dark bottom-right. */
.btn, .icon-btn, .close-btn, .delete-btn, .cancel-delete, .journey-btn, .boss-intro-btn, .hero-card, .levelup-choice-card {
  border: none !important;
  border-radius: 14px !important;
  font-family: var(--font-ui);
  font-weight: 900;
  letter-spacing: 0.5px;
  --b-face: #3b2d57; --b-hi: #5d4a85; --b-lo: #241a38; --b-ink: var(--ink); --b-text: var(--text);
  background: var(--b-face);
  color: var(--b-text);
  box-shadow:
    0 0 0 3px var(--b-ink),
    inset 3px 3px 0 0 var(--b-hi), inset -3px -4px 0 0 var(--b-lo);
  transition: transform 60ms ease, filter 120ms ease;
  cursor: pointer;
}
.btn:active:not(:disabled), .icon-btn:active, .journey-btn:active, .boss-intro-btn:active, .hero-card:active, .levelup-choice-card:active {
  transform: translateY(3px);
  box-shadow:
    0 0 0 3px var(--b-ink),
    inset 3px 4px 0 0 var(--b-lo), inset -3px -2px 0 0 var(--b-hi);
}
.btn:disabled { filter: grayscale(0.6) brightness(0.7); opacity: 1; }

.btn.primary, .play-slot, .journey-btn, .shop-btn.buy:not(:disabled) {
  --b-face: #ff8a3c; --b-hi: #ffd08a; --b-lo: #b8471c; --b-text: #2a0f04;
}
.btn.primary.big { padding: 16px 20px; font-size: 22px; }
.btn.ghost {
  --b-face: #2a203f; --b-hi: #463a63; --b-lo: #19122a; --b-text: var(--text-dim);
  width: 100%; margin-top: 14px; padding: 11px 14px; font-size: 15px;
}
.journey-btn { font-size: 30px; padding: 14px 52px; letter-spacing: 3px; margin-bottom: 20px; animation: pxPulse 1.6s ease-in-out infinite; }
.journey-links { gap: 14px; }
.journey-links .btn.ghost { margin-top: 0; width: auto; padding: 9px 14px; font-size: 14px; }
.icon-btn { padding: 5px 9px; font-size: 13px; --b-face: #2e2346; }
.close-btn { width: 34px; height: 34px; font-size: 15px; --b-face: #5a2338; --b-hi: #8a3a55; --b-lo: #3a1424; }
.delete-btn, .cancel-delete { --b-face: #3a2440; padding: 8px 10px; }
.confirm-delete { --b-face: #e0452e !important; --b-hi: #ff9a7a; --b-lo: #8a1a10; --b-text: #fff3ee !important; }
.shop-btn { padding: 9px 12px; font-size: 13px; }
.shop-btn.equip { --b-face: #3b2d57; --b-text: var(--text); }
.shop-btn.equipped { --b-face: #2e8a58; --b-hi: #6ee7a8; --b-lo: #145534; --b-text: #eafff3; }
.edit-btn { filter: drop-shadow(0 2px 0 var(--ink)); }

@keyframes pxPulse { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.18); } }

/* ---------- save select ---------- */
.save-slot, .shop-item {
  background: #150e22;
  border: none;
  border-radius: 14px;
  box-shadow: 0 0 0 3px var(--ink),
              inset 0 3px 0 0 #2d2344, inset 0 -3px 0 0 #0f0a18;
}
.save-list, .shop-list { gap: 14px; }
.save-slot-name { font-family: var(--font-ui); font-weight: 900; color: var(--gold); font-size: 17px; }
.save-slot-summary { color: var(--text-dim); font-weight: 900; }
.parent-link {
  display: inline-block; margin-top: 16px; background: none; border: none; color: var(--text-dim);
  font: 700 12px 'Nunito', sans-serif; text-decoration: underline; cursor: pointer; padding: 6px;
}

/* ---------- hero select ---------- */
.hero-title { font-size: clamp(26px, 8vw, 36px); margin: 0 0 4px; text-align: center; }
.hero-sub { text-align: center; color: var(--text-dim); font-weight: 800; margin: 0 0 6px; }
.hero-pick { gap: 18px; margin-top: 22px; }
.hero-card {
  --b-face: #2a1f40; --b-hi: #4a3a6e; --b-lo: #150e22;
  padding: 14px 10px 12px; font-size: 20px; color: var(--gold);
  background:
    radial-gradient(ellipse at 50% 88%, #ffcf6e55 0%, transparent 45%),
    linear-gradient(180deg, #2f2248, #1b1329);
}
.hero-card span { display: block; text-shadow: 0 2px 0 var(--ink); }

.name-field { display: flex; flex-direction: column; align-items: center; gap: 6px; margin: 10px 0 8px; }
.name-field span { color: var(--gold); font-weight: 900; font-size: 15px; }
.name-field input {
  width: min(260px, 90%); padding: 12px 14px; border-radius: 14px; border: 3px solid #e0a838;
  background: #150e22; color: #fff; font: 900 20px var(--font-ui); text-align: center; outline: none;
  -webkit-user-select: text; user-select: text;
}
.name-field input:focus { box-shadow: 0 0 0 3px rgba(224,168,56,0.4); }
.dmg-plus { color: #ffcf3a; }

/* ---------- settings ---------- */
.settings-overlay { position: fixed; inset: 0; z-index: 70; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(8,4,16,0.82); }
.settings-card { width: 100%; max-width: 380px; padding: 20px 18px; }
.settings-card h2 { margin: 0 0 14px; text-align: center; font-size: 28px; font-weight: 900; color: var(--gold); text-shadow: 0 3px 0 var(--ink); }
.shop-item-emoji.px-icon.sword-icon { width: 54px; height: 54px; }
.setting-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 14px 0; font-weight: 900; font-size: 16px; }
.setting-row input[type=range] { flex: 1; accent-color: #ffb04a; height: 28px; }
.vol-label { min-width: 48px; text-align: right; color: var(--gold); }

/* ---------- journey / title ---------- */
.journey { height: min(calc(100vh - 24px - var(--safe-top) - var(--safe-bottom)), 780px); min-height: 480px; }
.journey-bg { width: 100%; height: 100%; object-fit: cover; object-position: 50% 100%; }
.journey-inner { background: linear-gradient(180deg, rgba(12,7,20,0.25) 0%, rgba(12,7,20,0) 30%, rgba(12,7,20,0) 55%, rgba(12,7,20,0.7) 100%); justify-content: space-between; padding: 22px 16px 20px; }
.journey-bottom { display: flex; flex-direction: column; align-items: center; }
.logo {
  font-family: var(--font-ui); font-weight: 1000; line-height: 0.95; letter-spacing: 1px;
  text-align: center; margin-bottom: 10px; animation: logoFloat 3s ease-in-out infinite;
}
.logo-top, .logo-bottom {
  display: block; font-size: clamp(34px, 11vw, 52px); color: var(--gold);
  background: linear-gradient(180deg, #fff3c4 0%, #ffd66e 45%, #f08a24 55%, #c8501a 100%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  filter: drop-shadow(3px 0 0 var(--ink)) drop-shadow(-3px 0 0 var(--ink)) drop-shadow(0 3px 0 var(--ink)) drop-shadow(0 -3px 0 var(--ink)) drop-shadow(0 6px 0 #3a0f06);
}
.logo-vs {
  border-radius: 10px;
  display: inline-block; margin: 4px 0; padding: 2px 12px 4px; font-size: clamp(18px, 5.5vw, 24px);
  color: #fff; background: #d8321f; letter-spacing: 2px;
  box-shadow: 0 0 0 3px var(--ink), inset 0 3px 0 #ff8a6a, inset 0 -3px 0 #7a1108;
  transform: rotate(-4deg);
}
@keyframes logoFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
.journey-lead { font-family: var(--font-ui); font-weight: 900; color: #ffe0cc; text-shadow: 0 2px 0 var(--ink); letter-spacing: 2px; }
.journey-sub { color: var(--text); font-weight: 800; text-shadow: 0 2px 0 var(--ink); margin-bottom: 16px; }

/* ---------- battle HUD ---------- */
.topbar { font-family: var(--font-ui); font-weight: 900; font-size: 16px; color: var(--gold); text-shadow: 0 2px 0 var(--ink); }
.topbar.sub-row { font-family: 'Nunito', sans-serif; color: var(--text-dim); font-size: 12px; text-shadow: none; margin-top: 4px; }
.wave-chip { display: inline-flex; align-items: center; gap: 6px; }
.wave-chip .boss-tag {
  border-radius: 6px;
  font-size: 11px; color: #fff; background: #d8321f; padding: 1px 6px;
  box-shadow: 0 0 0 2px var(--ink);
  animation: pxPulse 0.8s ease-in-out infinite;
}
.rank-badge {
  font-family: var(--font-ui); font-weight: 900; border: none; border-radius: 999px;
  background: #4c1d95; color: #f3e8ff;
  box-shadow: 0 0 0 2px var(--ink), inset 0 2px 0 #7c3aed;
}
.rank-prog { color: var(--text-dim); font-weight: 800; }
.xpbar, .hpbar, .mini-hpbar {
  position: relative; border: none; border-radius: 999px; background: #0f0a18; overflow: visible;
  box-shadow: 0 0 0 2px var(--ink), inset 0 2px 0 #00000088;
}
.xpbar { height: 8px; }
.hpbar { height: 14px; }
.xpfill { background: linear-gradient(180deg, #e2c8ff, #a26cf0 55%, #6d3fc0); transition: width 0.5s ease-out; }
.hpfill { position: relative; z-index: 1; border-radius: 999px; transition: width 0.35s ease-out; }
.xpfill, .hpghost { border-radius: 999px; }
/* Segment ticks + a 1-row specular stripe, painted over whatever fill
   colour the bar has (the enemy bar is tinted per-monster inline). */
.hpfill::after {
  content: ""; position: absolute; inset: 0;
  background:
    linear-gradient(180deg, rgba(255,255,255,0.45) 0 3px, transparent 3px calc(100% - 3px), rgba(0,0,0,0.3) calc(100% - 3px)),
    repeating-linear-gradient(90deg, transparent 0 18px, rgba(0,0,0,0.18) 18px 20px);
  border-radius: 999px;
}
.player-fill { background: #2fd47a; }
.player-fill.low { background: #ff4a3a; animation: pxPulse 0.6s ease-in-out infinite; }
/* Trailing "damage ghost": stays at the previous width for a moment and
   then drains, so the kid can SEE how much a hit took. */
.hpghost { position: absolute; left: 0; top: 0; bottom: 0; background: #fff2c8; z-index: 0; transition: width 0.6s ease 0.25s; }
.name-row { font-weight: 900; font-size: 13px; margin: 6px 0 5px; }
.name-row .cname { font-family: var(--font-ui); font-weight: 900; font-size: 15px; color: #fff; text-shadow: 0 2px 0 var(--ink); }
.name-row .hp-num { font-family: var(--font-ui); color: var(--text-dim); }
.enemy-mini-emoji { display: none; }
.enemy-mini { width: 36px; }
.enemy-mini .mini-icon { width: 32px; height: 28px; display: block; margin: 0 auto 3px; }

.battlefield-anchor { height: 250px; margin: 10px 0 12px; }
#battle-stage-host {
  border-radius: 16px;
  box-shadow: 0 0 0 3px var(--ink), 0 0 0 6px #e0a838, 0 0 0 9px var(--ink), 0 0 24px rgba(224,168,56,0.25);
  background: #0c0714;
  overflow: hidden;
}
#battle-stage-host canvas { display: block; }

.banner {
  border-radius: 12px;
  font-family: var(--font-ui); font-weight: 900; font-size: 15px; color: var(--gold);
  background: #150e22; padding: 6px 8px; margin: 8px 3px;
  box-shadow: 0 0 0 3px var(--ink), inset 0 3px 0 #2d2344;
  animation: bannerIn 0.35s ease-out;
}
@keyframes bannerIn { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.boss-banner { background: #9a1c12 !important; box-shadow: 0 0 0 3px var(--ink), inset 0 3px 0 #ff6a4a !important; border: none !important; }

/* ---------- problem card ---------- */
.problem-card {
  border: none; border-radius: 18px; margin: 14px 3px 3px; padding: 12px 12px 14px;
  background:
    repeating-linear-gradient(0deg, transparent 0 22px, rgba(255,255,255,0.025) 22px 24px),
    #150e22;
  box-shadow: 0 0 0 3px var(--ink), inset 0 3px 0 #2d2344, inset 0 -3px 0 #0a0612;
}
.streak { font-family: var(--font-ui); font-weight: 900; font-size: 14px; color: #ffb35c; text-shadow: 0 2px 0 var(--ink); height: 18px; }
.problem {
  font-family: var(--font-ui); font-weight: 900; font-size: clamp(38px, 12vw, 50px); color: #fff;
  letter-spacing: 2px; margin: 2px 0 14px;
  text-shadow: 0 4px 0 var(--ink), 3px 0 0 var(--ink), -3px 0 0 var(--ink), 0 -3px 0 var(--ink), 0 7px 0 #00000066;
}
.problem .op { color: var(--gold); }
.problem .q { color: #7fe3ff; display: inline-block; animation: qBlink 1s ease-in-out infinite; }
@keyframes qBlink { 50% { opacity: 0.45; } }
.choices { gap: 14px; margin: 0 3px 14px; }
.choice {
  --b-face: #3a2d5c; --b-hi: #6a58a0; --b-lo: #221838;
  font-size: 30px; padding: 12px 0 14px; color: #fff; text-shadow: 0 3px 0 var(--ink);
}
.choice:disabled { filter: brightness(0.75) saturate(0.6); }
.choice.correct { --b-face: #22b566; --b-hi: #7ff0b0; --b-lo: #0f6a3a; filter: none !important; animation: pickPop 0.3s ease-out; }
.choice.wrong { --b-face: #d8321f; --b-hi: #ff8a6a; --b-lo: #7a1108; filter: none !important; animation: pickShake 0.3s ease-out; }
.choice.reveal { --b-face: #1a7a48; --b-hi: #6ee7a8; --b-lo: #0c4a2a; filter: none !important; }
@keyframes pickPop { 50% { transform: scale(1.08); } }
@keyframes pickShake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

.fireball-btn { --b-face: #3a2440; --b-text: var(--text-dim); margin: 4px 3px 0; width: calc(100% - 6px); font-size: 15px; padding: 11px 0; }
.fireball-btn.ready { --b-face: #ff6a24; --b-hi: #ffd08a; --b-lo: #a8320c; --b-text: #2a0f04; border: none; animation: pxPulse 0.7s ease-in-out infinite; }
.charge-pips { display: inline-flex; gap: 4px; margin-left: 8px; vertical-align: middle; }
.charge-pips i { width: 11px; height: 11px; border-radius: 50%; background: #150e22; box-shadow: 0 0 0 2px var(--ink); display: inline-block; }
.charge-pips i.on { background: #ffcf3a; box-shadow: 0 0 0 2px var(--ink), inset 0 -3px 0 #e0701c; }
.potion-row { gap: 14px; margin: 14px 3px 0; }
.potion-btn { font-size: 13px; padding: 10px 4px; --b-face: #2e2346; --b-text: var(--text-dim); }
.potion-btn.ready.hp-ready { --b-face: #22b566; --b-hi: #7ff0b0; --b-lo: #0f6a3a; --b-text: #042010; border: none; }
.potion-btn.ready.poison-ready { --b-face: #8b5cf6; --b-hi: #c4b5fd; --b-lo: #4c1d95; --b-text: #16072e; border: none; }
.potion-charge-note { color: var(--text-dim); font-weight: 900; margin-top: 10px; }

/* Answer streak: the problem card catches fire. */
.problem-card.on-fire {
  box-shadow: 0 0 0 3px #ff7a1c,
              inset 0 3px 0 #2d2344, inset 0 -3px 0 #0a0612, 0 0 22px 2px rgba(255,122,28,0.55);
  animation: fireGlow 0.5s ease-in-out infinite;
}
.problem-card.blazing { animation-duration: 0.25s; }
.problem-card.on-fire .streak { font-size: 16px; color: #ffcf3a; }
@keyframes fireGlow {
  50% { box-shadow: 0 0 0 3px #ffcf3a,
                    inset 0 3px 0 #2d2344, inset 0 -3px 0 #0a0612, 0 0 32px 6px rgba(255,160,40,0.7); }
}

/* Level up: rotating rays of light behind the reward card. */
.levelup-overlay::before, .celebrate-overlay::before {
  content: ""; position: absolute; left: 50%; top: 45%; width: 220vmax; height: 220vmax;
  transform: translate(-50%, -50%);
  background: repeating-conic-gradient(from 0deg, rgba(255,215,110,0.16) 0deg 9deg, transparent 9deg 22.5deg);
  animation: raysSpin 14s linear infinite;
  pointer-events: none;
}
@keyframes raysSpin { to { transform: translate(-50%, -50%) rotate(360deg); } }

/* ---------- shop ---------- */
.shop-overlay { background: rgba(8,4,16,0.82); padding: calc(16px + var(--safe-top)) 16px calc(16px + var(--safe-bottom)); }
.shop-hint { margin: -4px 0 4px; font-size: 12.5px; font-weight: 800; color: var(--text-dim); }
.shop-coins { font-family: var(--font-ui); font-size: 18px; color: var(--gold); text-shadow: 0 2px 0 var(--ink); }
.shop-section-title { font-family: var(--font-ui); font-weight: 900; font-size: 17px; color: var(--gold); text-shadow: 0 2px 0 var(--ink); margin: 20px 0 12px; }
.shop-item { margin: 0 3px; }
.goal-star {
  flex: 0 0 auto; width: 34px; height: 34px; margin-right: 6px; border: none; border-radius: 50%;
  background: #1a1230; color: #8c7fb0; font-size: 20px; line-height: 1; cursor: pointer;
  box-shadow: 0 0 0 2px var(--ink);
}
.goal-star.on { color: #ffd66e; background: #3a2a10; text-shadow: 0 0 8px rgba(255,214,110,0.8); }
.shop-item-name { font-family: var(--font-ui); font-weight: 900; font-size: 15px; color: #fff; }
.shop-item-type { color: var(--text-dim); font-weight: 900; }
.shop-item-emoji { filter: drop-shadow(0 2px 0 var(--ink)); }
.shop-item-emoji.dragon-icon, .shop-item-emoji.px-icon { width: 44px; height: 36px; filter: none; }
.shop-item-emoji.px-icon canvas { width: 100%; height: 100%; display: block; }

/* ---------- level up ---------- */
.levelup-overlay { background: rgba(10,4,24,0.86); }
.firework-particle { border-radius: 0; width: 6px; height: 6px; animation-timing-function: ease-out; }
.levelup-emoji { filter: drop-shadow(0 3px 0 var(--ink)); }
.levelup-card h2 { font-size: 34px; }
.levelup-card p { color: var(--text); }
.range-note { color: #c4b5fd !important; }
.levelup-choice-card { --b-face: #2a1f40; --b-hi: #4a3a6e; --b-lo: #150e22; margin: 0 3px; padding: 12px; }
.levelup-choice-name { font-family: var(--font-ui); font-size: 17px; color: var(--gold); }
.levelup-choice-desc { color: var(--text); font-family: 'Nunito', sans-serif; font-weight: 800; }

/* ---------- boss intro ---------- */
.boss-intro { background: radial-gradient(ellipse at 50% 55%, #4a0a0acc 0%, #0a0206f2 65%); }
.boss-intro-lead { font-family: var(--font-ui); font-weight: 900; text-shadow: 0 3px 0 var(--ink), 0 0 18px rgba(255,59,42,0.75); }
.boss-intro-name { font-family: var(--font-ui); font-weight: 900; color: #ffd9c8; text-shadow: 0 4px 0 var(--ink), 0 0 22px rgba(255,110,80,0.9); margin: 6px 0 18px; }
.boss-portrait { display: block; margin: 8px auto 0; animation: bossBob 1.6s ease-in-out infinite; filter: drop-shadow(0 0 18px #ff3b2a88); }
@keyframes bossBob { 50% { transform: translateY(-6px); } }
.boss-intro-btn { --b-face: #d8321f; --b-hi: #ff8a6a; --b-lo: #7a1108; --b-text: #fff0e8; font-size: 30px; padding: 14px 52px; }
.boss-intro-warn { filter: drop-shadow(0 3px 0 var(--ink)); }

/* ---------- celebrations ---------- */
.celebrate-overlay {
  position: fixed; inset: 0; z-index: 70; display: flex; align-items: center; justify-content: center;
  background: rgba(10,4,24,0.84); overflow: hidden; animation: celebrateIn 0.25s ease-out;
}
.celebrate-card { position: relative; text-align: center; max-width: 340px; margin: 0 16px; padding: 22px 24px; }
.celebrate-icon { font-size: 64px; line-height: 1.1; filter: drop-shadow(0 3px 0 var(--ink)); animation: celebratePop 0.6s cubic-bezier(.2,1.6,.4,1) both; }
.celebrate-kicker { font-family: var(--font-ui); font-weight: 900; font-size: 15px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); margin-top: 6px; }
.celebrate-card h2 { font-size: 30px; margin: 6px 0; }
.celebrate-card p { color: var(--text); font-size: 17px; margin: 0 0 18px; }
@keyframes celebrateIn { from { opacity: 0; } }
@keyframes celebratePop { from { transform: scale(0.2); opacity: 0; } }
html.reduce-motion .celebrate-overlay::before, html.reduce-motion .celebrate-icon { animation: none !important; }
html.reduce-motion .celebrate-overlay .fireworks { display: none; }
/* ---------- parents / privacy sheet ---------- */
.info-card { text-align: left; }
.info-card h1 { text-align: center; font-size: 26px; }
.info-card h3 { font-family: var(--font-ui); color: var(--gold); margin: 16px 0 6px; font-size: 17px; }
.info-card p, .info-card li { font-size: 14px; line-height: 1.5; color: var(--text); font-weight: 600; }
.info-card ul { padding-left: 20px; margin: 6px 0; }
/* ---------- parent area ---------- */
.gate-card { text-align: center; }
.gate-question { font-family: var(--font-ui); font-weight: 900; font-size: 34px; margin: 10px 0 14px; }
.gate-input { color: #7fe3ff; display: inline-block; min-width: 60px; }
.gate-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.gate-key { font-size: 22px; padding: 10px 0; }
.parents-card { max-height: calc(100vh - 32px); overflow-y: auto; }
.parent-tabs { display: flex; gap: 8px; justify-content: center; margin: 4px 0 12px; }
.parent-slot { background: #1a1230; border-radius: 12px; margin: 10px 0; padding: 10px 12px; box-shadow: 0 0 0 2px var(--ink); }
.parent-slot summary { cursor: pointer; display: flex; flex-direction: column; gap: 2px; list-style: none; }
.parent-slot summary::-webkit-details-marker { display: none; }
.parent-slot-name { font-family: var(--font-ui); font-weight: 900; font-size: 17px; color: #fff; }
.parent-slot-name::before { content: "▸ "; color: var(--gold); }
.parent-slot[open] .parent-slot-name::before { content: "▾ "; }
.parent-slot-rank { color: var(--text-dim); font-weight: 800; font-size: 13px; }
.parent-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 10px 0; text-align: center; }
.parent-stats b { display: block; font-family: var(--font-ui); color: var(--gold); font-size: 15px; }
.parent-stats span { font-size: 11px; color: var(--text-dim); font-weight: 800; }
.parent-rank-ctl { display: flex; align-items: center; gap: 10px; font-weight: 900; }
.parent-rank-ctl span { flex: 1; }
.parent-rank-ctl .gate-key { width: 44px; padding: 4px 0; }
.info-card .parent-note { font-size: 12px; color: var(--text-dim); margin: 8px 0; }
.skill-list { list-style: none; padding: 0 !important; margin: 6px 0 0; }
.skill-row { display: grid; grid-template-columns: 1fr auto; gap: 0 8px; padding: 5px 0; border-top: 1px solid #2d2344; font-size: 13px !important; }
.skill-row.current .skill-name { color: #fff; }
.skill-status { font-weight: 900; white-space: nowrap; }
.skill-acc { grid-column: 1 / -1; color: var(--text-dim); font-size: 12px; }

/* ---------- battle fits the phone: no page scroll ----------
   The arena is a full-height column; the canvas stage takes whatever
   height is left, so every phone shows the whole fight at once. Menus
   (shop, settings) are overlays that still scroll inside themselves. */
html.battle-fit, html.battle-fit body { height: 100%; overflow: hidden; overscroll-behavior: none; }
.wrap.playing {
  height: 100vh; height: 100dvh; min-height: 0; overflow: hidden;
  align-items: stretch; justify-content: center;
  padding: calc(8px + var(--safe-top)) calc(8px + var(--safe-right)) calc(8px + var(--safe-bottom)) calc(8px + var(--safe-left));
}
.arena.fit { display: flex; flex-direction: column; height: 100%; max-height: 100%; padding: 10px 10px 10px; overflow: hidden; }
.arena.fit > * { flex: 0 0 auto; }
.arena.fit .topbar { font-size: 15px; }
.arena.fit .topbar.sub-row { margin-top: 3px; gap: 8px; min-height: 20px; }
.arena.fit .rank-row { margin: 3px 0 0; }
.arena.fit .rank-badge { font-size: 11px; padding: 2px 9px; }
.arena.fit .xpbar-row { margin: 5px 0 4px; }
.hp-duo { display: flex; gap: 12px; }
.hp-duo .combatant { flex: 1 1 0; min-width: 0; margin: 0; }
.hp-duo .name-row { margin: 4px 0 4px; display: flex; justify-content: space-between; gap: 6px; }
.hp-duo .name-row .cname { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hp-duo .name-row .hp-num { font-size: 12px; white-space: nowrap; }
.hp-duo .hpbar { height: 11px; }
.foe-count { font-size: 11px; color: #ffb35c; }
.arena.fit { justify-content: center; }
.arena.fit .battlefield-anchor { flex: 1 1 auto; height: auto; min-height: 140px; max-height: 520px; margin: 10px 3px 8px; }
.stage-banners { position: absolute; left: 6px; right: 6px; top: 6px; z-index: 5; display: flex; flex-direction: column; gap: 4px; pointer-events: none; }
.stage-banners .banner { margin: 0; font-size: 13px; padding: 5px 8px; text-align: center; opacity: 0.96; }
.arena.fit .problem-card { margin: 6px 3px 3px; padding: 6px 10px 10px; }
.arena.fit .streak { height: 16px; font-size: 13px; }
.arena.fit .problem-card.on-fire .streak { font-size: 14px; }
.arena.fit .problem { font-size: clamp(32px, 10vw, 44px); margin: 0 0 8px; }
.arena.fit .choices { gap: 10px; margin: 0 3px 10px; }
.arena.fit .choice { font-size: 26px; padding: 7px 0 9px; }
.action-row { display: flex; gap: 8px; margin: 0 3px; }
.action-row .btn { flex: 1 1 0; min-width: 0; margin: 0; width: auto; font-size: 12.5px; padding: 9px 2px; line-height: 1.2; white-space: nowrap; }
.action-row .fireball-btn { flex: 1.2 1 0; }
.action-row .potion-btn[data-action="use-potion-poison"] { flex: 1.15 1 0; }
.action-row .btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 6px 2px 5px; }
.action-row .charge-pips, .action-row .cd { margin: 0; gap: 3px; }
.action-row .charge-pips i { width: 8px; height: 8px; }
.charge-pips i.on.poison { background: #a78bfa; box-shadow: 0 0 0 2px var(--ink), inset 0 -2px 0 #6d28d9; }
.action-row .cd { display: inline-block; min-width: 16px; line-height: 12px; border-radius: 8px; background: #0f0a18; color: var(--text-dim); font-size: 11px; padding: 0 4px; }
.goal-chip {
  display: inline-flex; align-items: center; gap: 5px; min-width: 0; max-width: 58%; flex: 0 1 auto;
  border: none; border-radius: 999px; padding: 2px 8px; cursor: pointer;
  font-family: var(--font-ui); font-weight: 900; font-size: 11px; color: #ffe7a3;
  background: #2a1d44; box-shadow: 0 0 0 2px var(--ink);
  white-space: nowrap; overflow: hidden;
}
.lvl-line { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.goal-chip .goal-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.goal-chip .goal-bar { position: relative; flex: 0 0 30px; height: 6px; border-radius: 999px; background: #0f0a18; overflow: hidden; }
.goal-chip .goal-bar i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #f2c440, #ffe7a3); border-radius: 999px; }
.goal-chip.ready { background: #6b4a0a; color: #fff3c4; animation: pxPulse 0.9s ease-in-out infinite; }
/* Short phones: squeeze the header before the stage gets too small. */
@media (max-height: 700px) {
  .arena.fit .rank-row { display: none; }
  .arena.fit .problem { font-size: 34px; }
  .arena.fit .choice { font-size: 24px; padding: 5px 0 7px; }
}

@media (prefers-reduced-motion: reduce) {
  .logo, .journey-btn, .boss-portrait, .problem .q, .fireball-btn.ready, .player-fill.low,
  .problem-card.on-fire, .levelup-overlay::before, .celebrate-overlay::before, .celebrate-icon { animation: none !important; }
  .celebrate-overlay .fireworks { display: none; }
}

/* ---------- Dragon Book, badges, world map ---------- */
.map-btn { border: none; background: none; padding: 0; margin: 0; color: inherit; font: inherit; letter-spacing: inherit; text-shadow: inherit; cursor: pointer; white-space: nowrap; }
.topbar-actions { gap: 4px; }
.topbar-actions .icon-btn { white-space: nowrap; }
.arena.fit .topbar-actions .icon-btn { padding: 5px 7px; }
.book-count { text-align: center; color: var(--text-dim); font-weight: 800; font-size: 13px; margin: 4px 0 10px; }
.book-section { font-family: var(--font-ui); color: var(--gold); font-size: 16px; margin: 14px 0 8px; }
.book-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.book-entry { background: #1a1230; border-radius: 12px; padding: 8px 4px; text-align: center; box-shadow: 0 0 0 2px var(--ink); }
.book-entry.boss { box-shadow: 0 0 0 2px #c9a227; }
.book-pic { height: 58px; display: flex; align-items: center; justify-content: center; font-size: 34px; }
.book-pic canvas { max-width: 100%; max-height: 58px; image-rendering: pixelated; }
.book-entry.locked .book-pic { filter: brightness(0) opacity(0.45); }
.book-name { font-family: var(--font-ui); font-weight: 900; font-size: 12px; color: #fff; margin-top: 4px; line-height: 1.2; }
.book-entry.locked .book-name { color: var(--text-dim); }
.book-sub { font-size: 11px; color: var(--gold); font-weight: 800; }
.badge-list { display: flex; flex-direction: column; gap: 8px; }
.badge-row { display: flex; align-items: center; gap: 10px; background: #1a1230; border-radius: 12px; padding: 8px 10px; box-shadow: 0 0 0 2px var(--ink); }
.badge-row.locked { opacity: 0.55; }
.badge-row.locked .badge-icon { filter: grayscale(1); }
.badge-icon { font-size: 28px; }
.badge-text { flex: 1; display: flex; flex-direction: column; }
.badge-text b { font-family: var(--font-ui); color: #fff; font-size: 14px; }
.badge-text small { color: var(--text-dim); font-weight: 700; font-size: 12px; }
.badge-reward { font-weight: 900; color: var(--gold); white-space: nowrap; }
.badge-toast {
  position: fixed; left: 50%; top: calc(12px + var(--safe-top, 0px)); transform: translateX(-50%); z-index: 80;
  display: flex; align-items: center; gap: 10px; width: min(92vw, 380px); padding: 10px 14px; border-radius: 14px;
  background: #2a1f40; box-shadow: 0 0 0 3px #c9a227, 0 8px 24px rgba(0,0,0,0.5); animation: toastIn 0.35s ease-out; pointer-events: none;
}
.badge-toast-icon { font-size: 30px; }
.badge-toast-text { display: flex; flex-direction: column; }
.badge-toast-text b { font-family: var(--font-ui); color: var(--gold); font-size: 15px; }
.badge-toast-text small { color: var(--text); font-weight: 700; font-size: 12px; }
@keyframes toastIn { from { transform: translate(-50%, -30px); opacity: 0; } }
html.reduce-motion .badge-toast { animation: none; }
.map-world { background: #1a1230; border-radius: 12px; padding: 8px 10px 10px; margin: 8px 0; box-shadow: 0 0 0 2px var(--ink); }
.map-world.current { box-shadow: 0 0 0 3px var(--gold); }
.map-world.ahead { opacity: 0.6; }
.map-world-name { font-family: var(--font-ui); font-weight: 900; color: #fff; font-size: 15px; display: flex; justify-content: space-between; align-items: baseline; }
.map-world-name small { color: var(--text-dim); font-size: 11px; }
.map-path { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; margin-top: 8px; }
.map-node {
  position: relative; aspect-ratio: 1; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font: 900 10px var(--font-ui); color: var(--text-dim); background: #2d2344;
}
.map-node.done { background: #1f6a3a; color: #bff5d0; }
.map-node.boss { font-size: 12px; }
.map-node.here { background: var(--gold); font-size: 14px; box-shadow: 0 0 0 2px #fff; }
.map-flag { position: absolute; top: -10px; right: -4px; font-style: normal; font-size: 12px; }

/* ---------- comfort & accessibility settings (see Prefs) ---------- */
