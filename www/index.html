<body>
<div id="root"></div>
<script src="hd-art.js"></script>
<script>
/* ===================================================================
   FILE MAP -- search for these exact strings to jump straight to a
   section instead of scanning. Kept short on purpose; update it when
   a section moves or a new top-level system is added.

   Math/difficulty ......... MATH_BANDS, MASTERY, evaluateBandChange
   Combat math .............. getProblemDamage, getEnemyDamage, getExpectedPlayerDamage
   Enemies/bosses ........... ENEMIES, decideChest, BOSSES, getEnemyForWave, tickBossCharge
   Shop items ............... LEVEL_STYLES, COSMETICS, BIOMES (arena backdrops),
                               DMG_UPGRADES, SWORD_TIERS (rider's held sword, tier-colored)
   Level-up cards ........... LEVEL_UP_CARDS, pickLevelUpCardChoices
   Celebrations ............ celebrate, dismissCelebration, celebrationHTML (queued full-screen moments)
   Worlds / growth / badges . WORLDS, DRAGON_GROWTH, BADGES, checkBadges, bookHTML, mapHTML
   Parents / prefs / voice .. openParentGate, parentsHTML, setSlotRank, Prefs, applyPrefs, Speech, buzz
   Save slots (localStorage). loadSaves, persistSaves, makeSlot, selectSave
   Game state object ........ const S = {  (single source of truth; read/written all over)
   Turn resolution ........... handleAnswer, enemyStrikePlayer, finishRound, handleWaveClear
   Shop buy/equip logic ..... buyItem, toggleEquip, equippedIdForType
   HTML view functions ...... saveSelectHTML, heroSelectHTML, titleHTML, playingHTML,
                               gameOverHTML, shopHTML, levelUpHTML  (each returns a string;
                               render() below picks one and sets #root.innerHTML)
   render() + click routing.. function render()  /  root.addEventListener("click", ...)
                               (data-action attributes in the HTML fns above route here)
   Pixel-art sprite data ..... PIX_DRAGON, PIX_SLIME, PIX_HERO_BOY(_SEAT), PIX_HERO_GIRL(_SEAT),
                               PIX_GOBLIN..PIX_ANCIENT_EFFIGY (one block per monster),
                               PIX_SLOT_KEY (letter -> palette field), PIX_ENEMY_ART (name -> art+palette)
                               Format: each row is a string of 2-char cells "XN" where X is a
                               PIX_SLOT_KEY letter and N is a 0/1/2 shade index (see pixRamp);
                               "." = empty, "e" = outline-black, "W" = white. paintPixelFrame()
                               is what actually reads this format.
   Battle stage (canvas) .... BIOMES/paintBiome (pixel backdrops), const BattleStage
                               (init/layout/bake.../draw/syncFromState, particles, fx).
                               No engine dependency -- plain canvas 2D, works fully offline.
   Stage <-> DOM bridge ...... battleStageHost, ensureBattleGame, syncBattleStage, BattleFX
                               (BattleFX.xxx() calls are what combat logic above fires into
                               BattleStage -- e.g. BattleFX.playerAttack())
   =================================================================== */
/* ---------- helpers ---------- */
const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

const shuffle = (arr) => {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = randInt(0, i);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

/* ================= MATH BANDS =================
   Difficulty is driven by demonstrated MASTERY, not by dragon level. Dragon
   level is the reward curve (HP, pets, shop unlocks) and keeps climbing as
   long as you play; the band is what the kid has actually proven they can
   do. That split is what lets a 6-year-old and a 12-year-old share the same
   build -- they can both be running a Lv.15 dragon on completely different
   math.

   Ranks 1-11 are addition/subtraction; ranks 12-17 are times tables and
   division, after rank 11 so they never show up for a kid who isn't ready.

   `gen` returns { a, op, b, answer }. `errors` lists the characteristic
   wrong answers for that skill -- see makeChoices() for why. */
const MATH_BANDS = [
  // Ranks 1-7 grow the numbers a few at a time (1-4, then up to 8, 12,
  // 16, 20, 25, 30) so no rank is a big jump from the one before it.
  // Bigger place-value work only starts at rank 8.
  {
    id: 1,
    name: "Hatchling",
    desc: "Numbers 1 to 4",
    speedMs: 5000,
    gen() { return smallFact(1, 4, 1, 4); },
    errors: smallErrors,
  },
  {
    id: 2,
    name: "Fledgling",
    desc: "Numbers up to 8",
    speedMs: 6000,
    gen() { return smallFact(5, 8, 1, 8); },
    errors: smallErrors,
  },
  {
    id: 3,
    name: "Ember Scale",
    desc: "Numbers up to 12",
    speedMs: 6500,
    gen() { return smallFact(9, 12, 1, 9); },
    errors: smallErrors,
  },
  {
    id: 4,
    name: "Flame Wing",
    desc: "Numbers up to 16",
    speedMs: 7000,
    gen() { return smallFact(13, 16, 1, 9); },
    errors: teenErrors,
  },
  {
    id: 5,
    name: "Sky Rider",
    desc: "Numbers up to 20",
    speedMs: 7500,
    gen() { return smallFact(17, 20, 1, 10); },
    errors: teenErrors,
  },
  {
    id: 6,
    name: "Storm Rider",
    desc: "Numbers up to 25",
    speedMs: 8000,
    gen() { return smallFact(21, 25, 1, 10); },
    errors: teenErrors,
  },
  {
    id: 7,
    name: "Cloud Breaker",
    desc: "Numbers up to 30",
    speedMs: 8000,
    gen() { return smallFact(26, 30, 1, 10); },
    errors: teenErrors,
  },
  {
    id: 8,
    name: "Ten-Stacker",
    desc: "Whole tens: 30 + 20",
    speedMs: 7000,
    gen() {
      if (Math.random() < 0.5) {
        const a = randInt(1, 7) * 10;
        const b = randInt(1, Math.min(9 - a / 10, 5)) * 10;
        return { a, op: "+", b, answer: a + b };
      }
      const a = randInt(3, 9) * 10;
      const b = randInt(1, a / 10 - 1) * 10;   // never 40 - 40: always leaves some tens
      return { a, op: "-", b, answer: a - b };
    },
    // Treating tens as ones (30+20 -> 5) is THE error to catch here.
    errors: (p) => [p.answer / 10, p.answer + 10, p.answer - 10, p.a + p.b + 10],
  },
  {
    id: 9,
    name: "Tens & Ones",
    desc: "Two-digit and one-digit",
    speedMs: 8500,
    gen() {
      const r = Math.random();
      if (r < 0.3) {
        // No regrouping: ones digit stays under 10.
        const tens = randInt(1, 8) * 10;
        const ones = randInt(1, 5);
        const b = randInt(1, 9 - ones);
        return { a: tens + ones, op: "+", b, answer: tens + ones + b };
      }
      if (r < 0.55) {
        // Carrying: ones digits sum past 10.
        const tens = randInt(1, 8) * 10;
        const ones = randInt(4, 9);
        const b = randInt(11 - ones, 9);
        return { a: tens + ones, op: "+", b, answer: tens + ones + b };
      }
      if (r < 0.8) {
        const tens = randInt(1, 9) * 10;
        const ones = randInt(2, 9);
        const b = randInt(1, ones - 1);
        return { a: tens + ones, op: "-", b, answer: tens + ones - b };
      }
      // Borrowing: subtrahend bigger than the ones digit.
      const tens = randInt(2, 9) * 10;
      const ones = randInt(0, 5);
      const b = randInt(ones + 1, 9);
      return { a: tens + ones, op: "-", b, answer: tens + ones - b };
    },
    // Forgot to carry / forgot to borrow -- both land exactly 10 off.
    errors: (p) => [p.answer - 10, p.answer + 10, p.answer + 1, p.answer - 1],
  },
  {
    id: 10,
    name: "Double Digits",
    desc: "Two-digit sums, no regrouping",
    speedMs: 10000,
    gen() {
      if (Math.random() < 0.5) {
        const aT = randInt(1, 5), aO = randInt(1, 4);
        const bT = randInt(1, Math.max(1, 8 - aT)), bO = randInt(1, 9 - aO);
        return { a: aT * 10 + aO, op: "+", b: bT * 10 + bO, answer: (aT + bT) * 10 + aO + bO };
      }
      const bT = randInt(1, 4), bO = randInt(1, 4);
      const aT = randInt(bT + 1, 9), aO = randInt(bO, 9);
      return { a: aT * 10 + aO, op: "-", b: bT * 10 + bO, answer: (aT - bT) * 10 + aO - bO };
    },
    errors: (p) => [p.answer + 10, p.answer - 10, p.answer + 9, p.answer - 9],
  },
  {
    id: 11,
    name: "Dragon Mathematician",
    desc: "Two-digit sums with regrouping",
    speedMs: 11000,
    gen() {
      if (Math.random() < 0.5) {
        const aT = randInt(1, 5), aO = randInt(4, 9);
        const bT = randInt(1, Math.max(1, 7 - aT)), bO = randInt(11 - aO, 9);
        return { a: aT * 10 + aO, op: "+", b: bT * 10 + bO, answer: aT * 10 + aO + bT * 10 + bO };
      }
      const bT = randInt(1, 4), bO = randInt(2, 9);
      const aT = randInt(bT + 1, 9), aO = randInt(0, bO - 1);
      return { a: aT * 10 + aO, op: "-", b: bT * 10 + bO, answer: aT * 10 + aO - (bT * 10 + bO) };
    },
    errors: (p) => [p.answer - 10, p.answer + 10, p.answer + 1, p.answer - 1],
  },
  // Ranks 12-17: times tables and division facts up to 10 x 10, in the
  // order schools teach them -- the easy tables, then sharing by them,
  // then the hard tables, then sharing by those, then everything mixed.
  {
    id: 12,
    name: "Twin Flame",
    desc: "Times tables: ×\u00a02, ×\u00a05, ×\u00a010",
    speedMs: 8000,
    gen() { return mulFact([2, 5, 10], 1, 10); },
    errors: mulErrors,
  },
  {
    id: 13,
    name: "Triple Claw",
    desc: "Times tables: ×\u00a03, ×\u00a04",
    speedMs: 9000,
    gen() { return mulFact([3, 4], 1, 10); },
    errors: mulErrors,
  },
  {
    id: 14,
    name: "Splitter",
    desc: "Sharing: ÷\u00a02, ÷\u00a05, ÷\u00a010",
    speedMs: 9000,
    gen() { return divFact([2, 5, 10], 1, 10); },
    errors: divErrors,
  },
  {
    id: 15,
    name: "Rune Weaver",
    desc: "Times tables: ×\u00a06 to ×\u00a09",
    speedMs: 10000,
    gen() { return mulFact([6, 7, 8, 9], 2, 10); },
    errors: mulErrors,
  },
  {
    id: 16,
    name: "Shard Breaker",
    desc: "Sharing: ÷\u00a03 to ÷\u00a09",
    speedMs: 10000,
    gen() { return divFact([3, 4, 5, 6, 7, 8, 9], 2, 10); },
    errors: divErrors,
  },
  {
    id: 17,
    name: "Dragon Sage",
    desc: "All × and ÷ facts to 10 ×\u00a010",
    speedMs: 9000,
    gen() {
      const all = [2, 3, 4, 5, 6, 7, 8, 9, 10];
      return Math.random() < 0.5 ? mulFact(all, 2, 10) : divFact(all, 2, 10);
    },
    errors: (p) => (p.op === "×" ? mulErrors(p) : divErrors(p)),
  },
];

/* Ranks 1-7: one number comes from this rank's new range [lo, hi], the
   other from 1..otherMax, so every problem practises the new numbers.
   Subtraction always starts from the bigger number and never gives 0. */
function smallFact(lo, hi, otherMin, otherMax) {
  const big = randInt(lo, hi);
  if (Math.random() < 0.5) {
    const other = randInt(otherMin, otherMax);
    return Math.random() < 0.5
      ? { a: big, op: "+", b: other, answer: big + other }
      : { a: other, op: "+", b: big, answer: big + other };
  }
  if (big < 2) return { a: big, op: "+", b: 1, answer: big + 1 };
  const b = randInt(1, Math.min(otherMax, big - 1));
  return { a: big, op: "-", b, answer: big - b };
}
// Small facts: off-by-one counting slips, and adding when it said subtract.
function smallErrors(p) {
  return [p.answer + 1, p.answer - 1, p.answer + 2, p.answer - 2, p.op === "-" ? p.a + p.b : Math.abs(p.a - p.b)];
}
// Past 12, the ten is where kids slip: 10 off, or 1 off from counting.
function teenErrors(p) {
  return [p.answer + 10, p.answer - 10, p.answer + 1, p.answer - 1, p.op === "-" ? p.a + p.b : Math.abs(p.a - p.b)];
}

/* Ranks 12-17. One factor comes from this rank's tables, the other from
   lo..hi, in either order so 3 x 7 and 7 x 3 both show up. */
function mulFact(tables, lo, hi) {
  const t = tables[randInt(0, tables.length - 1)];
  const n = randInt(lo, hi);
  return Math.random() < 0.5
    ? { a: t, op: "×", b: n, answer: t * n }
    : { a: n, op: "×", b: t, answer: t * n };
}
/* Division is built backwards from a product, so it always comes out even. */
function divFact(divisors, lo, hi) {
  const d = divisors[randInt(0, divisors.length - 1)];
  const q = randInt(lo, hi);
  return { a: d * q, op: "÷", b: d, answer: q };
}
// Times tables: a neighbouring fact (7 x 8 -> 49 or 64), adding instead of
// multiplying, and a slip of one.
function mulErrors(p) {
  return [p.a * (p.b + 1), p.a * (p.b - 1), (p.a + 1) * p.b, (p.a - 1) * p.b, p.a + p.b, p.answer + 1, p.answer - 1];
}
// Division: off by one or two, and subtracting instead of dividing.
function divErrors(p) {
  return [p.answer + 1, p.answer - 1, p.answer + 2, p.answer - 2, p.a - p.b];
}

/* Saves from before the 11-rank ladder used 8 bigger ranks. Each old rank
   maps to the new rank at or below the skill it proved, so nobody lands on
   harder math than they were already doing. */
const MATH_LADDER_VERSION = 2;
const OLD_BAND_TO_NEW = { 1: 1, 2: 3, 3: 5, 4: 6, 5: 7, 6: 8, 7: 9, 8: 10 };

const MAX_BAND = MATH_BANDS.length;
function getBand(id) {
  return MATH_BANDS[Math.max(0, Math.min(MAX_BAND - 1, id - 1))];
}

/* Roughly 1 in 5 problems is pulled from an already-mastered band instead
   of the current one. Without this, a kid "masters" ten-crossing in week
   one and has completely lost it by week four -- promotion would quietly
   retire every skill the moment it was learned. Review problems still
   count toward that older band's stats, so a skill going stale is
   detected and can pull the kid back down. */
const REVIEW_CHANCE = 0.2;

function pickProblemBand() {
  const cur = S.mathBand;
  if (cur > 1 && Math.random() < REVIEW_CHANCE) {
    // Weight review toward the band they've been weakest on recently.
    const candidates = [];
    for (let i = 1; i < cur; i++) {
      const st = S.mastery[i];
      const acc = st && st.seen > 0 ? st.correct / st.seen : 1;
      // Weaker bands get more tickets in the draw.
      const weight = Math.max(1, Math.round((1 - acc) * 8) + 1);
      for (let w = 0; w < weight; w++) candidates.push(i);
    }
    if (candidates.length) return candidates[randInt(0, candidates.length - 1)];
  }
  return cur;
}

function generateProblem(bandId) {
  const band = getBand(bandId);
  const p = band.gen();
  p.band = band.id;
  return p;
}

/* Distractors are drawn from the band's characteristic ERROR PATTERNS
   rather than random noise. Two reasons: a plausible wrong answer forces
   the kid to actually compute instead of eyeballing which number "looks
   about right", and when they do pick wrong, the specific distractor they
   chose tells us which misconception is in play (see recordAnswer). */
function makeChoices(problem) {
  const answer = problem.answer;
  const band = getBand(problem.band || S.mathBand);
  const set = new Set([answer]);
  const candidates = (band.errors ? band.errors(problem) : [])
    .filter((v) => Number.isInteger(v) && v >= 0 && v !== answer);

  for (const c of shuffle(candidates)) {
    if (set.size >= 4) break;
    set.add(c);
  }
  // Top up with near misses if the band didn't supply enough usable ones.
  let guard = 0;
  const spread = answer > 30 ? 10 : 3;
  while (set.size < 4 && guard < 200) {
    guard++;
    const delta = randInt(-spread, spread);
    const val = answer + (delta || 1);
    if (val >= 0) set.add(val);
  }
  return shuffle([...set]);
}

/* ================= MASTERY =================
   Per-band rolling stats, stored in the kid's save slot so each child on
   the same device carries their own progression.

   Promotion needs all three of: enough problems seen (no promoting off a
   lucky streak of 3), high accuracy, and answering within the band's time
   budget. Speed matters because a kid who counts on their fingers for
   every single problem gets there eventually but hasn't got fluency yet --
   and fluency is the whole point of drilling facts. */
const MASTERY = {
  // Raised from 12. A simulation of real play patterns showed 12 was
  // nowhere near enough evidence: an average kid (90% accuracy) reached
  // two-digit REGROUPING -- the hardest arithmetic in the game -- in about
  // 90 answers, roughly one sitting. Mastery of a skill should take
  // sustained practice, not a lucky dozen problems.
  minSeen: 30,        // never promote before this many problems in the band
  window: 32,         // rolling window of recent attempts (>= minSeen, so
                       // the accuracy check reflects the full requirement)
  promoteAcc: 0.85,
  demoteAcc: 0.55,
  demoteMinSeen: 10,
  // Flawless AND fast -> jump two bands. This was the biggest single
  // accelerant: a strong kid could clear minSeen at the exact moment they
  // qualified for the jump, skipping a whole skill after ~12 problems.
  // fastTrackMinSeen below decouples "you may advance" from "you may
  // skip a skill entirely" -- the jump now needs meaningfully more
  // practice than a plain single-band promotion.
  fastTrackAcc: 1.0,
  fastTrackSpeed: 0.5, // median time under half the band's budget
  // Hysteresis. Without these, a kid who gets promoted and then struggles
  // drops back to a band whose rolling window is still full of old
  // successes -- so promotion instantly re-fires and they ping-pong,
  // seeing "RANK UP!" every few problems. Each time a band is bounced
  // out of, the bar to leave it again gets a little higher.
  retryExtraSeen: 10,   // + this many problems required per past demotion
  retryExtraAcc: 0.03,  // + this much accuracy required per past demotion
  maxPromoteAcc: 0.95,
  // After being dropped into a band, promotion out of it isn't even
  // evaluated until this many more problems have been answered there. A
  // borderline kid should get a settled stretch of winnable math, not a
  // re-test every dozen problems.
  retryCooldown: 24,
  retryCooldownStep: 14, // grows with each additional demotion
};

function makeBandStat() {
  // seen/correct are LIFETIME totals (kept for the future parent report).
  // recent/times are the rolling judgement window. demotions drives the
  // hysteresis that stops band ping-ponging.
  return { seen: 0, correct: 0, recent: [], times: [], demotions: 0, cooldown: 0 };
}

/* A fresh slot starts every kid at band 1 regardless of age. The
   fast-track below is what keeps that from being an insult to an older
   kid: a flawless, quick run through a band promotes TWO bands at once,
   so a 12-year-old clears the easy material in a couple of minutes while a
   6-year-old moves one careful step at a time. */
function makeMastery() {
  const m = {};
  for (const b of MATH_BANDS) m[b.id] = makeBandStat();
  return m;
}

function ensureMastery(raw) {
  const m = makeMastery();
  if (raw && typeof raw === "object") {
    for (const b of MATH_BANDS) {
      const src = raw[b.id];
      if (!src) continue;
      m[b.id] = {
        seen: src.seen || 0,
        correct: src.correct || 0,
        recent: Array.isArray(src.recent) ? src.recent.slice(-MASTERY.window) : [],
        times: Array.isArray(src.times) ? src.times.slice(-MASTERY.window) : [],
        demotions: src.demotions || 0,
        cooldown: src.cooldown || 0,
      };
    }
  }
  return m;
}

function median(arr) {
  if (!arr.length) return Infinity;
  const s = [...arr].sort((x, y) => x - y);
  const mid = Math.floor(s.length / 2);
  return s.length % 2 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
}

function bandAccuracy(bandId) {
  const st = S.mastery[bandId];
  if (!st || !st.recent.length) return 0;
  return st.recent.reduce((a, b) => a + b, 0) / st.recent.length;
}

/* Records one answer against whichever band the PROBLEM came from (which
   may be an older band, if it was a review question). Returns a promotion
   or demotion event for the UI to celebrate/ignore. */
function recordAnswer(problem, wasCorrect, elapsedMs) {
  const bandId = problem.band || S.mathBand;
  const st = S.mastery[bandId] || (S.mastery[bandId] = makeBandStat());
  st.seen += 1;
  if (wasCorrect) st.correct += 1;
  if (st.cooldown > 0) st.cooldown -= 1;
  st.recent.push(wasCorrect ? 1 : 0);
  if (st.recent.length > MASTERY.window) st.recent.shift();
  if (wasCorrect) {
    st.times.push(elapsedMs);
    if (st.times.length > MASTERY.window) st.times.shift();
  }
  return evaluateBandChange(bandId);
}

/* Drops the kid to `toBand` and clears that band's rolling window, so it
   has to be re-earned from scratch rather than promoting again off stale
   evidence from before the demotion. */
function demoteTo(toBand, reason) {
  const target = Math.max(1, toBand);
  const st = S.mastery[target] || (S.mastery[target] = makeBandStat());
  const priorDemotions = st.demotions || 0;
  st.recent = [];
  st.times = [];
  st.demotions = priorDemotions + 1;
  st.cooldown = MASTERY.retryCooldown + priorDemotions * MASTERY.retryCooldownStep;
  S.mathBand = target;
  return { type: "demote", band: target, reason };
}

/* Promotion bar rises each time the kid has bounced off this band, so a
   borderline kid converges on the right band instead of oscillating. */
function promotionBar(bandId) {
  const d = (S.mastery[bandId] && S.mastery[bandId].demotions) || 0;
  return {
    seen: MASTERY.minSeen + d * MASTERY.retryExtraSeen,
    acc: Math.min(MASTERY.maxPromoteAcc, MASTERY.promoteAcc + d * MASTERY.retryExtraAcc),
  };
}

function evaluateBandChange(answeredBandId) {
  const cur = S.mathBand;

  // A review problem going badly can pull the kid back down to reinforce
  // a skill that's gone stale.
  if (answeredBandId < cur) {
    const st = S.mastery[answeredBandId];
    if (st.recent.length >= MASTERY.demoteMinSeen && bandAccuracy(answeredBandId) < MASTERY.demoteAcc) {
      return demoteTo(answeredBandId, "review");
    }
    return null;
  }

  const st = S.mastery[cur];
  const acc = bandAccuracy(cur);

  // Struggling badly at the current band -> step back down. Silent: the
  // game just quietly becomes winnable again, with no "you failed" moment.
  if (cur > 1 && st.recent.length >= MASTERY.demoteMinSeen && acc < MASTERY.demoteAcc) {
    return demoteTo(cur - 1);
  }

  if (cur >= MAX_BAND) return null;

  if (st.cooldown > 0) return null; // settling in after a recent drop
  const bar = promotionBar(cur);
  if (st.seen < bar.seen || st.recent.length < Math.min(bar.seen, MASTERY.window)) return null;
  if (acc < bar.acc) return null;

  const budget = getBand(cur).speedMs;
  const med = median(st.times);
  if (med > budget) return null; // accurate but still counting it out

  // Flawless and fast -> skip a band. Only offered to kids who haven't
  // already bounced off this band; a retry should be a careful step.
  // Note: this now needs to clear the SAME raised bar.seen threshold as
  // an ordinary promotion (24, up from 12), which alone roughly doubled
  // how much evidence a double-jump requires -- a separate, higher gate
  // was tried and found to be unreachable (see comment history), since
  // promotion fires the instant the bar clears and resets the counter.
  // The skip is only allowed through the tiny-number ranks (1-4), so an
  // older kid isn't stuck on 2 + 1 but nobody skips past the teens.
  const clean = (st.demotions || 0) === 0;
  const jump = (clean && cur < 4 && acc >= MASTERY.fastTrackAcc && med <= budget * MASTERY.fastTrackSpeed) ? 2 : 1;
  const from = cur;
  S.mathBand = Math.min(MAX_BAND, cur + jump);
  // Fresh window for the new band, but preserve its demotion history so a
  // band the kid has already failed out of stays appropriately hard to pass.
  for (let b = from + 1; b <= S.mathBand; b++) {
    const prior = (S.mastery[b] && S.mastery[b].demotions) || 0;
    const lifeSeen = (S.mastery[b] && S.mastery[b].seen) || 0;
    const lifeCorrect = (S.mastery[b] && S.mastery[b].correct) || 0;
    S.mastery[b] = makeBandStat();
    S.mastery[b].demotions = prior;
    S.mastery[b].seen = lifeSeen;
    S.mastery[b].correct = lifeCorrect;
  }
  return { type: "promote", band: S.mathBand, from, jumped: jump > 1 };
}

const MAX_LEVEL = 25;
// 24 thresholds to climb from Lv.1 to Lv.25: 10, 13, 16 ... a gentle +3 each time
// instead of the old 10/20/40/60 curve that ballooned too fast.
const XP_THRESHOLDS = Array.from({ length: MAX_LEVEL - 1 }, (_, i) => 10 + i * 3);
function levelFromXP(xp) {
  let level = 1;
  let remaining = xp;
  let idx = 0;
  while (level < MAX_LEVEL && remaining >= XP_THRESHOLDS[idx]) {
    remaining -= XP_THRESHOLDS[idx];
    level += 1;
    idx += 1;
  }
  if (level >= MAX_LEVEL) {
    return { level: MAX_LEVEL, remaining: 1, needed: 1, maxed: true };
  }
  return { level, remaining, needed: XP_THRESHOLDS[idx], maxed: false };
}

/* Max HP is now tied permanently to dragon level: Lv.1 = 30 HP, +2 HP every
   level after that (Lv.2 = 32, Lv.3 = 34, ... Lv.25 = 78). */
function getMaxHPForLevel(level) {
  return 28 + level * 2;
}

/* ---------- damage, decoupled from the answer's VALUE ----------
   Damage used to be the answer itself (`Math.max(S.problem.answer, 5)`,
   and on a miss the enemy hit for exactly `S.problem.answer`). That was
   survivable while answers capped at 20, but with two-digit bands a single
   wrong answer on 67 + 28 would have hit a 40 HP dragon for 95 -- a
   one-shot kill from full health. It also rewarded the luck of drawing a
   big number rather than knowing anything.

   Damage now comes from the DIFFICULTY of the problem plus how fast it was
   answered, so a hard-won 8 + 7 at band 2 hits about as hard as 47 + 38 at
   band 8, and the numbers on screen can grow without touching balance. */
/* A full-health player can always take this many hits before dying, which
   is what stops late waves turning into a two-turn loss. */
const MIN_HITS_TO_DIE = 5;

const BASE_HIT = 8;
const BAND_HIT_BONUS = 1.05;  // per rank above 1 (11 ranks: same top damage as the old 8 x 1.5)
const SPEED_HIT_BONUS = 6;    // max bonus for an instant answer

function getProblemDamage(problem, elapsedMs) {
  const band = getBand(problem.band || S.mathBand);
  let dmg = BASE_HIT + (band.id - 1) * BAND_HIT_BONUS;
  // Speed bonus: full value at instant, tapering to zero at the band's
  // time budget. Rewards recall over finger-counting.
  const ratio = Math.max(0, 1 - (elapsedMs / band.speedMs));
  dmg += SPEED_HIT_BONUS * ratio;
  return { dmg: Math.max(5, Math.round(dmg)), fast: ratio > 0.6 };
}

/* What the monster hits back for on a wrong answer. Scales with the wave
   (so it stays threatening) and is capped at a share of max HP so it can
   never one-shot the player from full. */
function getEnemyDamage() {
  let raw = 4 + Math.floor(S.wave * 0.9) + Math.floor(getBand(S.mathBand).id * 0.35);
  // Every living minion piles on. Without this the spawn cost the player
  // nothing, so ignoring them was strictly faster than killing them -- the
  // exact opposite of what the summon mechanic is for.
  const minions = S.enemies.filter((e) => e.isMinion && e.hp > 0).length;
  if (minions > 0) raw = Math.round(raw * (1 + 0.35 * minions));
  // Hard floor on survivability: a full-health player always gets at least
  // MIN_HITS_TO_DIE strikes before dying, at any wave. Without this the
  // wave-scaled damage eventually one- or two-shots them.
  const cap = Math.floor(S.playerMaxHP / MIN_HITS_TO_DIE);
  return Math.max(2, Math.min(raw, cap));
}

/* Treasure chest: a random bonus "wave" that replaces a normal enemy.
   It never attacks and always yields a random 10-20 gold + flat 20 XP. */
/* Roughly a 1-in-5 chance per wave (never on boss waves, never twice in a
   row) that the next wave is a treasure chest instead of a real enemy. */
function decideChest(wave) {
  if (wave <= 1 || wave % 5 === 0) return false;
  S.wavesSinceChest = (S.wavesSinceChest || 0) + 1;
  if (S.wavesSinceChest < 2) return false;
  const trigger = Math.random() < 0.18;
  if (trigger) S.wavesSinceChest = 0;
  return trigger;
}

/* Which creature shows up is random, but drawn from a shuffled bag rather
   than rolled fresh each wave. A plain random pick will happily serve the
   same monster three waves running, which reads as a bug to a kid; a bag
   guarantees you see the whole roster before anything repeats, while the
   order still differs every run.

   This only chooses the CREATURE. Boss cadence and HP scaling below are
   untouched, and chests still replace the enemy entirely in spawnWave(). */
function refillEnemyBag() {
  const idx = ENEMIES.map((_, i) => i);
  S.enemyBag = shuffle(idx);
  // Don't let the reshuffle hand back the same monster that just appeared.
  if (S.enemyBag.length > 1 && ENEMIES[S.enemyBag[0]].name === S.lastEnemyName) {
    const swap = 1 + Math.floor(Math.random() * (S.enemyBag.length - 1));
    const t = S.enemyBag[0];
    S.enemyBag[0] = S.enemyBag[swap];
    S.enemyBag[swap] = t;
  }
}

function drawEnemyFromBag() {
  if (!Array.isArray(S.enemyBag) || S.enemyBag.length === 0) refillEnemyBag();
  const pick = ENEMIES[S.enemyBag.shift()];
  S.lastEnemyName = pick.name;
  return pick;
}


/* ---------- enemy scaling, anchored to the player ----------
   Enemy HP used to be `15 + wave * 6`, growing without limit. Player damage
   does NOT grow without limit: it comes from a base hit, the math band
   (capped at 8), shop upgrades (capped), and a speed bonus. So the two
   curves diverge, and by wave 70 a boss had ~950 HP against a player
   hitting for ~25 -- roughly 38 correct answers -- while its own damage was
   capped at 45% of the player's health, killing them in three hits.

   Enemy health is now expressed in HITS instead of raw points: work out
   what the player actually deals right now, then multiply. A fight is a
   predictable length at every wave, and it stays fair if the player is
   under-levelled because the number follows their real output. */

function getExpectedPlayerDamage() {
  const band = getBand(S.mathBand);
  let dmg = BASE_HIT + (band.id - 1) * BAND_HIT_BONUS;
  dmg += SPEED_HIT_BONUS * 0.45;              // assume a middling answer speed
  dmg += getDmgBonus();
  const eff = getActiveBuffs();
  dmg *= 1 + (eff.dmgPct || 0) / 100;
  dmg *= 1 + getPetDmgPercent() / 100;
  return Math.max(4, dmg);
}

/* How many clean hits a normal enemy should survive. Climbs early so the
   game gets meatier, then flattens -- past this point extra difficulty
   comes from harder maths, not from longer fights. */
function hitsToKillForWave(wave) {
  return Math.min(7, 2.5 + wave * 0.09);
}

function scaledEnemyHP(wave, mult) {
  const hp = getExpectedPlayerDamage() * hitsToKillForWave(wave) * (mult || 1);
  return Math.max(6, Math.round(hp));
}

/* ================= BOSSES =================
   Bosses are their own roster. They never appear as ordinary wave enemies,
   which fixes the problem the shuffled bag created: with every creature
   equally likely, a Muck Slime could headline a boss wave with nothing but
   extra HP to show for it.

   Each boss owns a mechanic rather than just a bigger health bar, so a kid
   can tell them apart by how the fight goes, not only by what it looks
   like. */
const BOSSES = [
  {
    name: "Ooze Monarch",
    emoji: "\u{1F451}",
    glow: "#8ef0a8",
    hpMult: 1.8,
    // Splits off two smaller oozes each time it drops past a threshold.
    // The blobs are already visible inside its body in the sprite, so the
    // summon reads as something it was always going to do.
    summon: {
      at: [0.66, 0.33],
      count: 2,
      name: "Ooze Spawn",
      // Trimmed from 16%: with reabsorption in play the spawn have to be
      // killable inside the timer, or the fight just stalls.
      hpPct: 0.12,
      line: "The Monarch splits!",
      // Rounds a spawn can survive before the Monarch pulls it back in and
      // heals for whatever health it had left. This is the pressure valve
      // -- it turns "kill the small ones" into something with a clock on
      // it, which rewards answering fast rather than merely correctly.
      absorbAfter: 4,
      absorbLine: "The Monarch reabsorbs its spawn!",
    },
    // Takes double damage from subtraction. Thematically it's a creature
    // that divides, and mechanically it gives the kid a lever: a boss that
    // only gets harder with no counter is frustrating rather than exciting.
    weakness: { op: "-", mult: 2 },
  },
  {
    name: "Rime Warden",
    emoji: "\u{1F9CA}",
    glow: "#cfe8f5",
    hpMult: 1.8,
    /* Frozen plate. Answers slower than half the band's time budget are
       mostly absorbed. Every other boss rewards being CORRECT; this one
       only rewards being FLUENT, which is the gap between knowing a fact
       and having recalled it. The threshold follows the band rather than
       being a fixed millisecond count, or Band 8 would be impossible while
       Band 1 was free. */
    armor: { speedPct: 0.5, mult: 0.35, crackBelow: 0.3 },
    weakness: { op: "+", mult: 2 },
  },
  {
    name: "Ancient Effigy",
    emoji: "\u{1F5FF}",
    glow: "#7de0c4",
    hpMult: 1.8,
    /* Spends two rounds winding up, then unleashes. Answer both charging
       rounds correctly and you break its focus; miss either and it lands
       hard. The only boss where a wrong answer has a delayed consequence
       instead of an immediate one. */
    charge: {
      // Starts winding up after 2 answers, not 4. Boss fights run 4-7
      // answers for a fluent player, so a 4-round delay meant the charge
      // never fired once -- the mechanic existed but was unreachable.
      every: 2, rounds: 2, mult: 2.2,
      startLine: "The Effigy begins to channel...",
      breakLine: "You broke its focus!",
      fireLine: "The Effigy unleashes!",
    },
    weakness: { op: "-", mult: 2 },
  },
];

/* The first boss is always the Ooze Monarch, so every kid meets the same
   creature at wave 5 and learns what a boss wave is against a fight that's
   been tuned for it. Every boss wave after that draws from a shuffled bag,
   same as normal enemies -- varied order, but no repeats until the whole
   boss roster has been seen. */
function refillBossBag() {
  S.bossBag = shuffle(BOSSES.map((_, i) => i));
  if (S.bossBag.length > 1 && BOSSES[S.bossBag[0]].name === S.lastBossName) {
    const swap = 1 + Math.floor(Math.random() * (S.bossBag.length - 1));
    const t = S.bossBag[0];
    S.bossBag[0] = S.bossBag[swap];
    S.bossBag[swap] = t;
  }
}

function getBossForWave(wave) {
  let base;
  if (wave === 5) {
    base = BOSSES[0];                       // always the Ooze Monarch
    S.lastBossName = base.name;
  } else {
    if (!Array.isArray(S.bossBag) || S.bossBag.length === 0) refillBossBag();
    base = BOSSES[S.bossBag.shift()];
    S.lastBossName = base.name;
  }
  const maxHP = scaledEnemyHP(wave, base.hpMult || 1.5);
  return { ...base, isBoss: true, maxHP };
}

/* Called after every hit on a boss. Returns a banner line if a phase
   actually fired, so the caller can announce it. */
function checkBossSummon(target) {
  if (!target || !target.isBoss || !target.summon) return null;
  const spec = target.summon;
  target.summonsDone = target.summonsDone || 0;
  const pct = target.hp / target.maxHP;
  const nextAt = spec.at[target.summonsDone];
  if (nextAt === undefined || pct > nextAt || target.hp <= 0) return null;

  target.summonsDone += 1;
  const minionHP = Math.max(3, Math.round(target.maxHP * spec.hpPct));
  for (let i = 0; i < spec.count; i++) {
    S.enemies.push({
      name: spec.name, emoji: "\u{1F7E2}", glow: target.glow,
      isBoss: false, isMinion: true, age: 0,
      maxHP: minionHP, hp: minionHP, poisonTurns: 0,
    });
  }
  // Targeting is automatic in this game -- the player never picks a foe --
  // so the spawn have to be put in front to matter at all. They shield the
  // Monarch: attacks land on them until they're cleared. Combined with the
  // absorb timer this turns the phase into "clear these fast", which is a
  // real ask, rather than a choice the player has no way to make.
  const firstMinion = S.enemies.findIndex((e) => e.isMinion && e.hp > 0);
  if (firstMinion !== -1) S.activeEnemyIdx = firstMinion;
  return spec.line;
}

/* Ages the living spawn one round. Any that survive their timer are pulled
   back into the boss, healing it for their remaining HP. Returns a banner
   line if an absorb happened.

   Removing entries mid-array would shift activeEnemyIdx out from under the
   UI, so the index is repaired against the boss afterwards. */
function tickBossMinions() {
  const boss = S.enemies.find((e) => e.isBoss && e.hp > 0);
  if (!boss || !boss.summon || !boss.summon.absorbAfter) return null;

  let healed = 0;
  const survivors = [];
  for (const e of S.enemies) {
    if (!e.isMinion || e.hp <= 0) { survivors.push(e); continue; }
    e.age = (e.age || 0) + 1;
    if (e.age >= boss.summon.absorbAfter) {
      // The boss recovers the spawn WHOLE, not just what's left of it, so
      // chipping at a minion and leaving it alive is the worst outcome.
      healed += e.maxHP;
    } else {
      survivors.push(e);
    }
  }
  if (healed <= 0) return null;

  S.enemies = survivors;
  boss.hp = Math.min(boss.maxHP, boss.hp + healed);
  const bossIdx = S.enemies.indexOf(boss);
  if (S.activeEnemyIdx >= S.enemies.length || !S.enemies[S.activeEnemyIdx] ||
      S.enemies[S.activeEnemyIdx].hp <= 0) {
    S.activeEnemyIdx = Math.max(0, bossIdx);
  }
  addPopup(`+${healed}`, "enemy", "heal");
  return boss.summon.absorbLine;
}

/* Armour multiplier. Returns 1 when the hit lands clean, or the armour's
   reduction when the answer was too slow. Cracks for good once the boss is
   low, so the fight has a finish where speed stops mattering. */
function getArmorMult(target, elapsedMs, problem) {
  if (!target || !target.armor) return 1;
  if (target.hp / target.maxHP <= target.armor.crackBelow) return 1;
  const band = getBand((problem && problem.band) || S.mathBand);
  const threshold = band.speedMs * target.armor.speedPct;
  return elapsedMs <= threshold ? 1 : target.armor.mult;
}

/* Advances the wind-up on a charging boss. Called once per answered
   problem. Reads S.lastAnswerCorrect rather than taking a parameter,
   because finishRound() is reached through several callback paths that
   don't all know how the answer went. */
function tickBossCharge() {
  const boss = S.enemies.find((e) => e.isBoss && e.hp > 0);
  if (!boss || !boss.charge) return null;

  if (boss.charging > 0) {
    if (S.lastAnswerCorrect) boss.chargeHits = (boss.chargeHits || 0) + 1;
    boss.charging -= 1;
    if (boss.charging > 0) return null;
    // Wind-up finished: did the player answer every round of it correctly?
    if ((boss.chargeHits || 0) >= boss.charge.rounds) {
      boss.chargeCounter = 0;
      return { type: "break", line: boss.charge.breakLine };
    }
    boss.chargeCounter = 0;
    // Capped so even a charged hit leaves at least three from full health.
    const dmg = Math.min(
      Math.round(getEnemyDamage() * boss.charge.mult),
      Math.floor(S.playerMaxHP / 3)
    );
    return { type: "fire", line: boss.charge.fireLine, dmg };
  }

  boss.chargeCounter = (boss.chargeCounter || 0) + 1;
  if (boss.chargeCounter >= boss.charge.every) {
    boss.charging = boss.charge.rounds;
    boss.chargeHits = 0;
    return { type: "start", line: boss.charge.startLine };
  }
  return null;
}

/* Damage multiplier for the current problem against this enemy. */
function getWeaknessMult(target, problem) {
  if (!target || !target.weakness || !problem) return 1;
  return target.weakness.op === problem.op ? (target.weakness.mult || 2) : 1;
}

function getEnemyForWave(wave) {
  const base = drawEnemyFromBag();
  const isBoss = wave % 5 === 0;
  const maxHP = scaledEnemyHP(wave, isBoss ? 1.5 : 1);
  return { ...base, isBoss, maxHP };
}

/* Deterministic pseudo-random in [0,1) from an integer seed -- same input
   always gives the same output, so re-renders within the same wave-pair
   don't flicker between backgrounds. */
function seededRandom01(n) {
  n = (n << 13) ^ n;
  return ((n * (n * n * 15731 + 789221) + 1376312589) & 0x7fffffff) / 0x7fffffff;
}

   The skill tree is gone. Instead, every level-up offers the dragon 3
   randomly-drawn cards (out of this pool of 5) to choose between -- pick

   are instant one-offs (heal / gold), two are timed buffs that last for

    // cards are offered (see pickLevelUpCardChoices), so the number shown

/* Gold card scales with both dragon level and how far the run has gone. */
/* Worth about two boss kills, so the card is a nice bonus but not a
   shortcut past playing: 10 gold, +1 for every 2 waves reached. */
function goldCardAmount(level, wave) {
  return 10 + Math.floor(wave / 2);
}

/* Shuffles the 5-card pool and offers the first 3 -- called once per
   level-up so the same 3 cards stay on screen until the player picks. */
function pickLevelUpCardChoices() {
  return shuffle(LEVEL_UP_CARDS.map((c) => c.id)).slice(0, 3);

/* Snapshot of anything a card's desc/apply needs that could otherwise
   change between "cards shown" and "card chosen" (S.wave ticks forward
   as soon as the player picks). Freezing it here keeps the number on the
   card and the number actually granted in sync. */
function makeLevelUpCardCtx(level) {
  return { level, wave: S.wave, goldAmount: goldCardAmount(level, S.wave) };

}

function makeFireworks(count = 20) {
  return Array.from({ length: count }).map((_, i) => ({
    id: i,
    angle: Math.random() * 360,
    distance: 50 + Math.random() * 90,
    color: FIREWORK_COLORS[randInt(0, FIREWORK_COLORS.length - 1)],
    delay: Math.random() * 0.6,
    originX: 10 + Math.random() * 80,
    originY: 10 + Math.random() * 55,
  }));
}

function fireworksHTML(list) {
  return list.map((p) => {
    const rad = (p.angle * Math.PI) / 180;
    const dx = Math.cos(rad) * p.distance;
    const dy = Math.sin(rad) * p.distance;
    return `<span class="firework-particle" style="--dx:${dx}px; --dy:${dy}px; background:${p.color}; left:${p.originX}%; top:${p.originY}%; animation-delay:${p.delay}s;"></span>`;
  }).join("");
}

/* ---------- save slots (persisted to localStorage) ---------- */
function loadSaves() {
  try {
    // Storage key bumped to wipe all existing saves -- this is a dev
    // build with no other players, so a clean slate matters more than
    // preserving old data. The game simply stops reading the old key;
    // it's harmless leftover bytes in localStorage from here on. Bump
    // the suffix again any time a future dev wipe is needed.
    const raw = localStorage.getItem("dragonReckoningSaves_v2");
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.slots)) return parsed;
    }
  } catch (e) {}
  return null;
}

function makeSlot(n) {
  return { id: "s" + Date.now() + Math.random().toString(16).slice(2), name: `Slot ${n}`, data: null };
}

let SAVES = loadSaves() || { slots: [makeSlot(1), makeSlot(2), makeSlot(3)] };
while (SAVES.slots.length < 3) SAVES.slots.push(makeSlot(SAVES.slots.length + 1));

function persistSaves() {
  try { localStorage.setItem("dragonReckoningSaves_v2", JSON.stringify(SAVES)); } catch (e) {}
}

/* saveActiveSlot() runs after every single round, and each call serialized
   all three slots synchronously on the main thread. Coalesce the writes:
   the in-memory SAVES object updates immediately (so nothing is ever lost
   logically) and the actual localStorage write is debounced. flushSaves()
   forces it out on page unload. */
let persistTimer = null;
function persistSavesSoon() {
  if (persistTimer) return;
  persistTimer = setTimeout(() => { persistTimer = null; persistSaves(); }, 1000);
}
function flushSaves() {
  if (persistTimer) { clearTimeout(persistTimer); persistTimer = null; }
  persistSaves();
}

/* Save names come from a window.prompt and get interpolated straight into
   innerHTML. A kid typing "Sam <3" would otherwise break the layout. */
function esc(str) {
  return String(str).replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

/* ================= CELEBRATIONS =================
   Big full-screen moments: math rank up, boss beaten (and later: dragon
   grows up, new world). Queued so two at once play one after the other.
   While one is up, the problem timer is paused so the confetti doesn't eat
   the kid's speed bonus. */
const CELEBRATION_MS = 4000;

function celebrate(c) {
  S.celebrations.push(Object.assign({ confetti: makeFireworks(28) }, c));
  if (S.celebrations.length === 1) startCelebration();
}

function startCelebration() {
  const c = S.celebrations[0];
  if (!c) return;
  c.shownAt = Date.now();
  Sound.play("rankup");
  const rid = S.runId;
  setTimeout(() => { if (S.runId === rid && S.celebrations[0] === c) dismissCelebration(); }, CELEBRATION_MS);
  render();
}

function dismissCelebration() {
  const c = S.celebrations.shift();
  if (!c) return;
  // Give back the time the overlay covered an unanswered problem.
  if (!S.pick && S.problemShownAt) {
    const pausedFrom = Math.max(c.shownAt, S.problemShownAt);
    S.problemShownAt += Math.max(0, Date.now() - pausedFrom);
  }
  if (S.celebrations.length) startCelebration();
  else render();
}

function celebrationHTML() {
  const c = S.celebrations[0];
  return `
  <div class="celebrate-overlay" data-action="dismiss-celebration">
    <div class="fireworks">${fireworksHTML(c.confetti)}</div>
    <div class="card celebrate-card">
      <div class="celebrate-icon">${c.icon}</div>
      <div class="celebrate-kicker">${esc(c.kicker)}</div>
      <h2>${esc(c.title)}</h2>
      <p>${esc(c.sub)}</p>

}

  const band = getBand(change.band);

  celebrate({
    icon: unlockedTimes ? "🌟" : "⭐",
    kicker: unlockedTimes ? "Times tables unlocked!" : change.jumped ? "Double rank up!" : "Math rank up!",
    title: `Rank ${band.id}: ${band.name}`,

}

  creature_earth:    { name: "Rock Hurl",      dmg: [2, 4],   style: "rock",   colors: ["#e8d0a0", "#c8a070", "#8a6a40", "#5a4028"] },
  creature_water:    { name: "Water Jet",      dmg: [2, 5],   style: "stream", colors: ["#e0f8ff", "#7fd8ff", "#2f8fe0", "#1a5aa8"] },
  creature_air:      { name: "Gust",           dmg: [3, 6],   style: "wind",   colors: ["#ffffff", "#e8f4ff", "#bcd8f0"] },
  creature_ice:      { name: "Frost Breath",   dmg: [4, 7],   style: "shards", colors: ["#ffffff", "#d8f6ff", "#8fe0ff", "#4ab0e0"] },
  creature_storm:    { name: "Lightning",      dmg: [5, 8],   style: "bolt",   colors: ["#ffffff", "#fff38a", "#b48aff", "#6a4ad8"] },
  creature_crystal:  { name: "Crystal Shards", dmg: [6, 10],  style: "shards", colors: ["#fff0fb", "#ff9ae0", "#e060c8", "#9a3ab0"] },
  creature_onyx:     { name: "Obsidian Blast", dmg: [7, 11],  style: "rock",   colors: ["#b48aff", "#6a5a88", "#2a2438", "#ff7a3c"] },
