/* Derives the 3-step light ramp for a material from its base colour, so
   authoring only needs one colour per slot.

   v2: the ramp is HUE-SHIFTED, not just lightened/darkened. Highlights
   drift toward warm yellow and shadows toward cool violet -- the standard
   pixel-art trick that makes flat ramps look painted and lit instead of
   "the same colour, but greyer". Memoized since every bake calls it for
   every slot. */
const PIX_RAMP_CACHE = new Map();
function hueToward(h, target, amt) {
  let d = ((target - h + 540) % 360) - 180;
  return (h + d * amt + 360) % 360;
}
function hueShiftHex(hex, target, amt, satMul = 1) {
  const [h, sat, l] = rgbToHsl(...hexToRgb(hex));
  if (sat < 0.06) return hex;
  return rgbToHex(...hslToRgb(hueToward(h, target, amt), Math.min(1, sat * satMul), l));
}
function pixRamp(base) {
  let r = PIX_RAMP_CACHE.get(base);
  if (r) return r;
  // Same light/dark steps as the original ramp, then the hue nudge.
  const [h, , l] = rgbToHsl(...hexToRgb(base));
  const warmSkin = h < 50 && l > 0.55;   // a cool shift on skin reads as bruising
  const hi = hueShiftHex(shiftHex(base, 0.30), 55, 0.12, 1.05);
  const lo = hueShiftHex(shiftHex(base, -0.36), 255, warmSkin ? 0.03 : 0.1, 1.1);
  r = [hi, base, lo];
  PIX_RAMP_CACHE.set(base, r);
  return r;
}

const PIX_OUTLINE = "#140d10";

/* Paints one sprite frame onto a 2D context at `scale` device pixels per
   sprite pixel.

   v2 lighting passes, all resolved at bake time so the frame loop still
   only blits one image per sprite:
     1. Tinted outline ("sel-out"): the silhouette edge takes a very dark
        version of the colour it touches instead of flat black, so a green
        slime gets a deep-green rim and a fire dragon a deep-red one.
     2. Rim light: pixels whose top neighbour is empty catch the (upper)
        light; pixels sitting on empty space below pick up occlusion.
     3. Specular pips: the lightest pixel of a lit edge gets a tiny
        near-white highlight on big sprites. */
function paintPixelFrame(ctx, sprite, frameIdx, palette, scale, ox, oy, layer = "all") {
  // layer: "all" | "fill" (colour masses only) | "line" (outline, pupils,
  // eye whites) -- the smooth renderer softens fills but keeps lines crisp.
  const rows = sprite.frames[frameIdx];
  const w = sprite.w, h = sprite.h;
  const ramps = {};
  for (const ch of Object.keys(PIX_SLOT_KEY)) {
    const col = palette[PIX_SLOT_KEY[ch]];
    if (col) ramps[ch] = pixRamp(col);
  }

  const slotAt = (x, y) => {
    if (x < 0 || y < 0 || x >= w || y >= h) return ".";
    return rows[y].charAt(x * 2);
  };
  const filled = (x, y) => slotAt(x, y) !== ".";

  const colorAt = (x, y) => {
    const row = rows[y];
    const ch = row.charAt(x * 2);
    if (ch === ".") return null;
    if (ch === "e") return PIX_OUTLINE;
    if (ch === "W") return "#ffffff";
    const ramp = ramps[ch];
    if (!ramp) return null;
    const sh = parseInt(row.charAt(x * 2 + 1), 10);
    return ramp[isNaN(sh) ? 1 : sh];
  };
  const outlineFor = (x, y) => {
    // The first filled orthogonal neighbour decides the tint.
    const nb = [[x, y + 1], [x, y - 1], [x - 1, y], [x + 1, y]];
    for (const [nx, ny] of nb) {
      if (!filled(nx, ny)) continue;
      const ch = slotAt(nx, ny);
      const ramp = ramps[ch];
      if (!ramp) return PIX_OUTLINE;
      return shiftHex(ramp[2], -0.62);
    }
    return PIX_OUTLINE;
  };

  if (layer !== "fill" && layer !== "body") for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (filled(x, y)) continue;
      if (filled(x + 1, y) || filled(x - 1, y) || filled(x, y + 1) || filled(x, y - 1)) {
        ctx.fillStyle = outlineFor(x, y);
        ctx.fillRect(ox + x * scale, oy + y * scale, scale, scale);
      }
    }
  }

  const big = w * h >= 900;
  for (let y = 0; y < h; y++) {
    const row = rows[y];
    for (let x = 0; x < w; x++) {
      const ch = row.charAt(x * 2);
      let col = colorAt(x, y);
      if (!col) continue;
      const isLine = ch === "e" || ch === "W";
      // "body" = everything except the outer outline (used as a mask)
      if ((layer === "fill" && isLine) || (layer === "line" && !isLine)) continue;
      if (ch !== "e" && ch !== "W") {
        const topOpen = !filled(x, y - 1);
        const leftOpen = !filled(x - 1, y);
        const bottomOpen = !filled(x, y + 1);
        if (topOpen) col = shiftHex(col, 0.22);
        else if (leftOpen) col = shiftHex(col, 0.1);
        else if (bottomOpen) col = shiftHex(col, -0.16);
        if (big && topOpen && leftOpen) col = shiftHex(col, 0.45);
      }
      ctx.fillStyle = col;
      ctx.fillRect(ox + x * scale, oy + y * scale, scale, scale);
    }
  }
}

/* White silhouette of a baked frame, used for the one-frame "hit flash"
   every good action game has. */
function makeFlashCanvas(src, color) {
  const c = makeTextureCanvas(src.width, src.height);
  const cx = c.getContext("2d");
  cx.drawImage(src, 0, 0);
  cx.globalCompositeOperation = "source-in";
  cx.fillStyle = color || "#ffffff";
  cx.fillRect(0, 0, c.width, c.height);
  return c;
}


/* ================= SMOOTH ART =================
   The sprites are still authored as pixel grids (so the palettes, hue
   shading and outlines above keep working), but they are no longer SHOWN
   as blocky pixels. Each frame is painted at 1 sprite-pixel = 1 pixel,
   upscaled with EPX (the "Scale2x" edge-smoothing filter emulators use --
   it rounds diagonal staircases into smooth curves) several times, and
   then drawn with high-quality filtering at the final size. Results are
   cached, since EPX is far too slow to run every frame. */
function epx2(src) {
  const w = src.width, h = src.height;
  const s = new Uint32Array(src.getContext("2d").getImageData(0, 0, w, h).data.buffer);
  const out = makeTextureCanvas(w * 2, h * 2);
  const octx = out.getContext("2d");
  const od = octx.createImageData(w * 2, h * 2);
  const o = new Uint32Array(od.data.buffer);
  const W2 = w * 2;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const P = s[y * w + x];
      const A = y > 0 ? s[(y - 1) * w + x] : 0;
      const B = x < w - 1 ? s[y * w + x + 1] : 0;
      const C = x > 0 ? s[y * w + x - 1] : 0;
      const D = y < h - 1 ? s[(y + 1) * w + x] : 0;
      let e0 = P, e1 = P, e2 = P, e3 = P;
      if (C === A && C !== D && A !== B) e0 = A;
      if (A === B && A !== C && B !== D) e1 = B;
      if (D === C && D !== B && C !== A) e2 = C;
      if (B === D && B !== A && D !== C) e3 = D;
      const i = (y * 2) * W2 + x * 2;
      o[i] = e0; o[i + 1] = e1; o[i + W2] = e2; o[i + W2 + 1] = e3;
    }
  }
  octx.putImageData(od, 0, 0);
  return out;
}

/* EPX-upscale until the art is at least as big as it will be drawn
   (max 4 passes = 16x), then resample to exactly dw x dh. */
function renderSmooth(src, dw, dh, soft = 0.65, blurR = 0.45) {
  dw = Math.max(1, Math.round(dw)); dh = Math.max(1, Math.round(dh));
  let up = src, passes = 0;
  while (passes < 5 && (up.width < dw || up.height < dh)) { up = epx2(up); passes++; }
  if (passes === 0) up = epx2(up);             // always round the corners at least once
  const out = makeTextureCanvas(dw, dh);
  const ctx = out.getContext("2d");
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(up, 0, 0, dw, dh);
  if (soft > 0) {
    /* "Painted" pass: a blurred copy is laid back over the image, clipped
       to its own silhouette (source-atop). The blocky light/shadow steps
       inside a sprite melt into gradients while the outer outline stays
       crisp. blurR is in source pixels (0.45 = soft but still defined). */
    const px = dw / src.width;
    const blur = makeTextureCanvas(dw, dh);
    const bctx = blur.getContext("2d");
    bctx.filter = `blur(${Math.max(1, px * blurR)}px)`;
    bctx.drawImage(out, 0, 0);
    ctx.globalCompositeOperation = "source-atop";
    ctx.globalAlpha = soft;
    ctx.drawImage(blur, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  }
  return out;
}

/* Soft volume lighting for characters: a warm light from the upper left and
   a cool shade toward the lower right, clipped to the sprite. Makes the
   flat-shaded art read as rounded, painted forms. */
function addVolumeLight(c) {
  const ctx = c.getContext("2d"), w = c.width, h = c.height;
  ctx.globalCompositeOperation = "source-atop";
  const hi = ctx.createRadialGradient(w * 0.3, h * 0.2, 0, w * 0.3, h * 0.2, Math.max(w, h) * 0.75);
  hi.addColorStop(0, "rgba(255,244,220,0.22)"); hi.addColorStop(1, "rgba(255,244,220,0)");
  ctx.fillStyle = hi; ctx.fillRect(0, 0, w, h);
  const lo = ctx.createLinearGradient(0, h * 0.35, 0, h);
  lo.addColorStop(0, "rgba(30,10,60,0)"); lo.addColorStop(1, "rgba(30,10,60,0.28)");
  ctx.fillStyle = lo; ctx.fillRect(0, 0, w, h);
  ctx.globalCompositeOperation = "source-over";
  return c;
}

const SMOOTH_CACHE = new Map();
function renderSmoothCached(key, makeSrc, dw, dh) {
  const k = `${key}|${Math.round(dw)}x${Math.round(dh)}`;
  let c = SMOOTH_CACHE.get(k);
  if (!c) {
    if (SMOOTH_CACHE.size > 160) SMOOTH_CACHE.clear();
    c = renderSprite(makeSrc(), dw, dh);
    SMOOTH_CACHE.set(k, c);
  }
  return c;
}

/* One sprite frame at 1:1 with a 1px margin for the outline pass. */
function spriteSource(art, frame, palette) {
  const mk = (layer) => {
    const c = makeTextureCanvas(art.w + 2, art.h + 2);
    paintPixelFrame(c.getContext("2d"), art, frame % art.frames.length, palette, 1, 1, 1, layer);
    return c;
  };
  return { fill: mk("fill"), line: mk("line") };
}

function riderSource(hero, mountPalette, tier, frame) {

  const W = PIX_DRAGON.w + 2, H = PIX_DRAGON.h + over + 2;
  const heroPal = heroPaletteForTier(tier, hero);
  const one = (art, f, pal, x, y, layer) => {

/* Crisp edge smoothing: the silhouette is traced from a blurred copy of

/* Paints an HD drawing into a <canvas> element at its on-screen size x

/* Paints a smoothed source into a <canvas> element, sized to the canvas's

/* Largest whole-number scale that fits the sprite in the space available.
   Never fractional -- that's what keeps the pixels square. */

/* ---------- soft clay renderer (dragon) ----------
   Clay needs radial gradients and soft shadows, neither of which Phaser's
   Graphics can do. So instead of drawing the dragon shape-by-shape every
   frame, it's baked ONCE into canvas textures using the normal 2D context
   (which has both), and the frame loop just moves those textures around.
   That's not a compromise -- it's strictly faster than the Graphics path,
   because per-frame drawing drops to zero.

   The dragon is baked as a few separate strips rather than one image,
   split wherever the `moves` flag changes, so the wings and spikes can
   still lift independently of the body. */
const CLAY = {
  hi: 0.55,        // gradient highlight, toward white
  lo: 0.42,        // gradient shade, toward black
  gradCX: 0.32,    // light position within each part's bounding box
  gradCY: 0.28,
  gloss: 0.38,     // specular strength on round masses
  partShadow: 0.95,
  partBlur: 0.9,   // in grid units, scaled by `unit`
  partOffX: 0.5,
  partOffY: 0.8,
  minGlossSize: 6,
  pad: 4,          // grid units of margin so shadows aren't clipped
  // Bake at 2x and draw at half scale. The textures are only a couple of
  // hundred pixels square, so the extra memory is negligible, and the
  // downsample takes the hard stair-stepping off the gradients.
  ss: 2,
};

/* Splits a part list into consecutive runs of same `moves` value, so each
   run can become its own texture and be offset independently. */
function splitPartRuns(parts) {
  const runs = [];
  for (const part of parts) {
    const moves = !!part.moves;
    const last = runs[runs.length - 1];
    if (last && last.moves === moves) last.parts.push(part);
    else runs.push({ moves, parts: [part] });

  return runs;
}

function traceShape(ctx, shape, ox, oy, u) {
  ctx.beginPath();
  if (shape.type === "rect") {
    ctx.rect(ox + shape.x * u, oy + shape.y * u, shape.w * u, shape.h * u);
  } else if (shape.type === "circle") {
    ctx.arc(ox + shape.cx * u, oy + shape.cy * u, shape.r * u, 0, Math.PI * 2);
  } else if (shape.type === "ellipse") {
    ctx.ellipse(ox + shape.cx * u, oy + shape.cy * u, shape.rx * u, shape.ry * u, 0, 0, Math.PI * 2);
  } else {
    shape.pts.forEach(([x, y], i) => {
      const px = ox + x * u, py = oy + y * u;
      if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
    });
    ctx.closePath();

/* Paints one run of parts onto a 2D context in the clay style. Each mass
   gets a soft cast shadow (which is what separates the head from the body
   now that there are no outlines), a radial gradient, and a specular pip
   if it's a large rounded form. */
function paintClayParts(ctx, parts, ox, oy, u) {
  for (const part of parts) {
    const b = partBounds(part);
    const isOutlineColor = part.fill === DRAGON_OUTLINE;

    ctx.save();
    // The shadow is cast by the fill itself, so one fill call gives both.
    ctx.shadowColor = `rgba(18,11,6,${CLAY.partShadow})`;
    ctx.shadowBlur = u * CLAY.partBlur;
    ctx.shadowOffsetX = u * CLAY.partOffX;
    ctx.shadowOffsetY = u * CLAY.partOffY;

    if (isOutlineColor) {
      ctx.fillStyle = part.fill;
    } else {
      const cx = ox + (b.x + b.w * CLAY.gradCX) * u;
      const cy = oy + (b.y + b.h * CLAY.gradCY) * u;
      const r = Math.max(b.w, b.h) * u * 0.95;
      const grad = ctx.createRadialGradient(cx, cy, Math.max(0.5, r * 0.05), cx, cy, Math.max(1, r));
      grad.addColorStop(0, shiftHex(part.fill, CLAY.hi));
      grad.addColorStop(0.55, part.fill);
      grad.addColorStop(1, shiftHex(part.fill, -CLAY.lo));
      ctx.fillStyle = grad;
    }
    traceShape(ctx, part, ox, oy, u);
    ctx.fill();
    ctx.restore();

    // Specular highlight, clipped to the mass. Built from a transparent
    // radial gradient rather than a blur filter, since canvas filter
    // support is patchy on older mobile browsers.
    const round = part.type === "circle" || part.type === "ellipse";
    if (round && !isOutlineColor && Math.max(b.w, b.h) >= CLAY.minGlossSize) {
      ctx.save();
      traceShape(ctx, part, ox, oy, u);
      ctx.clip();
      const gx = ox + (b.x + b.w * 0.30) * u;
      const gy = oy + (b.y + b.h * 0.22) * u;
      const gr = Math.max(b.w * 0.26, b.h * 0.2) * u;
      const gl = ctx.createRadialGradient(gx, gy, 0, gx, gy, Math.max(1, gr));
      gl.addColorStop(0, `rgba(255,255,255,${CLAY.gloss})`);
      gl.addColorStop(0.6, `rgba(255,255,255,${CLAY.gloss * 0.35})`);
      gl.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = gl;
      ctx.fillRect(gx - gr * 1.6, gy - gr * 1.6, gr * 3.2, gr * 3.2);
      ctx.restore();
    }
  }
}

/* ==================== BATTLE STAGE (canvas, no engine) ====================
   Replaces a Phaser scene that pulled in a 1.2MB engine from a CDN for
   about forty API calls -- a dozen tweens, some text objects, a couple of
   canvas textures. Everything drawn here was already plain canvas 2D work;
   Phaser was just holding the canvas and moving things around.

   Dropping it means the game works with no internet after the first
   download, loads instantly, and stays a single self-contained file with
   nothing that can go down or get blocked on a school network.

/* ---------- tiny tween engine ---------- */
const EASE = {
  linear: (t) => t,
  quadOut: (t) => 1 - (1 - t) * (1 - t),
  cubicOut: (t) => 1 - Math.pow(1 - t, 3),

    ease: EASE[opts.ease] || EASE.linear,
    yoyo: !!opts.yoyo, repeat: opts.repeat || 0,
    onComplete: opts.onComplete || null,
    elapsed: 0, reversing: false,

    const v = props[k];
    if (v && typeof v === "object" && "from" in v) { t.from[k] = v.from; t.to[k] = v.to; target[k] = v.from; }
    else { t.from[k] = target[k] || 0; t.to[k] = v; }

}

  for (let i = tweens.length - 1; i >= 0; i--) if (tweens[i].target === target) tweens.splice(i, 1);
}
function updateTweens(dt) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const t = tweens[i];
    if (t.delay > 0) { t.delay -= dt; continue; }
    t.elapsed += dt;
    const p = Math.min(1, t.elapsed / t.duration);
    const e = t.ease(p);
    const k = t.reversing ? 1 - e : e;
    for (const key of Object.keys(t.to)) t.target[key] = t.from[key] + (t.to[key] - t.from[key]) * k;
    if (p >= 1) {
      if (t.yoyo && !t.reversing) { t.reversing = true; t.elapsed = 0; }
      else if (t.repeat > 0) { t.repeat -= 1; t.reversing = false; t.elapsed = 0; }
      else { tweens.splice(i, 1); if (t.onComplete) t.onComplete(); }
    }

/* ---------- drawable sprites ---------- */
function makeSprite(kind, opts = {}) {
  return Object.assign({ kind, x: 0, y: 0, alpha: 1, scale: 1, rotation: 0, visible: true }, opts);
}

  if (s.scale !== 1) ctx.scale(s.scale, s.scale);

    const w = s.dw || s.canvas.width, h = s.dh || s.canvas.height;

  c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h));

/* ================= SOUND =================
   Retro sound effects synthesized with the Web Audio API -- no audio
   files, so nothing to download and it works fully offline. The mute
   choice is a per-device setting kept in its own storage key, separate
   from the save slots. Audio can only start after a tap (browser/WebView
   autoplay rules), so the context is created lazily on first use. */

   describe the phone and whoever is holding it, not a kid's progress, so
   they live in localStorage rather than in a save slot. */
const PREFS_KEY = "dvmPrefs";
const Prefs = Object.assign(
  { textSize: "normal", motion: "auto", colorSafe: false, vibrate: true, autoRead: false },
  (() => { try { return JSON.parse(localStorage.getItem(PREFS_KEY)) || {}; } catch (e) { return {}; } })()

  Prefs[key] = value;

  applyPrefs();

/* "auto" follows the phone's own reduce-motion setting. */

  if (Prefs.motion === "on") return true;
  if (Prefs.motion === "off") return false;
  return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
}

  const h = document.documentElement.classList;
  h.toggle("text-large", Prefs.textSize === "large");
  h.toggle("text-xl", Prefs.textSize === "xl");
  h.toggle("reduce-motion", reduceMotion());

}
applyPrefs();

/* ================= READ ALOUD =================

   speechSynthesis in a browser). Only the problem on screen is spoken;
   nothing is recorded or sent anywhere. */

  native() { return window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.TextToSpeech; },

        .then(() => tts.speak({ text, lang: "en-US", rate: 0.9 })).catch(() => {});

const Sound = {
  ctx: null,
  muted: (() => { try { return localStorage.getItem("dvmMuted") === "1"; } catch (e) { return false; } })(),
  // 0-100, set in Settings. Kept separate from mute so unmuting restores it.
  volume: (() => { try { const v = parseInt(localStorage.getItem("dvmVolume"), 10); return isNaN(v) ? 70 : Math.max(0, Math.min(100, v)); } catch (e) { return 70; } })(),
  gainFor() { return 0.4 * (this.volume / 100); },
  setVolume(v) {

        case "gameover": [392, 349, 311, 262].forEach((f, i) => this.tone(f, i === 3 ? 0.6 : 0.22, { at: i * 0.22, type: "triangle", vol: 0.4 })); break;
        case "enemySwing": this.noise(0.16, { vol: 0.3, from: 1800, to: 300 }); this.tone(140, 0.14, { type: "sawtooth", to: 90, vol: 0.15 }); break;
        case "heal": [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, 0.12, { at: i * 0.05, type: "sine", vol: 0.3 })); break;
        case "poison": [300, 250, 340, 220].forEach((f, i) => this.tone(f, 0.09, { at: i * 0.07, type: "sine", to: f * 1.6, vol: 0.3 })); break;
        case "poisonTick": this.tone(260, 0.1, { type: "sine", to: 420, vol: 0.22 }); break;
        case "buy": this.tone(1319, 0.06, { vol: 0.25 }); this.tone(1568, 0.06, { at: 0.06, vol: 0.25 }); this.tone(2093, 0.18, { at: 0.12, vol: 0.25 }); break;
        case "knock": this.tone(180, 0.08, { type: "triangle", to: 120, vol: 0.5 }); this.noise(0.05, { vol: 0.3, from: 1200, to: 400 }); break;
        case "charge": this.tone(110, 0.9, { type: "sawtooth", to: 330, vol: 0.18 }); this.tone(55, 0.9, { type: "triangle", to: 165, vol: 0.3 }); break;
        case "shatter": this.noise(0.35, { vol: 0.45, from: 9000, to: 2000 }); [1568, 1319, 1760].forEach((f, i) => this.tone(f, 0.08, { at: i * 0.04, type: "triangle", vol: 0.25 })); break;
        case "split": this.tone(400, 0.25, { type: "sine", to: 120, vol: 0.4 }); this.tone(600, 0.2, { at: 0.08, type: "sine", to: 200, vol: 0.3 }); break;
        case "slurp": this.tone(150, 0.4, { type: "sine", to: 500, vol: 0.4 }); break;
        case "clink": this.tone(2637, 0.12, { type: "triangle", vol: 0.25 }); this.tone(3136, 0.15, { at: 0.04, type: "triangle", vol: 0.2 }); break;
        case "coin": this.tone(988, 0.07, { vol: 0.3 }); this.tone(1319, 0.18, { at: 0.07, vol: 0.3 }); break;

        case "rankup": [659, 831, 988, 1319].forEach((f, i) => this.tone(f, 0.12, { at: i * 0.08, type: "triangle", vol: 0.45 })); break;

        // dragon breath, one per element style
        case "breath_flame": this.noise(0.5, { vol: 0.4, from: 600, to: 3000 }); this.tone(150, 0.45, { type: "sawtooth", to: 320, vol: 0.12 }); break;

        case "breath_stream": this.noise(0.5, { vol: 0.3, from: 2500, to: 5000 }); this.tone(500, 0.4, { type: "sine", to: 300, vol: 0.12 }); break;
        case "breath_wind": this.noise(0.55, { vol: 0.35, from: 400, to: 2200 }); break;
        case "breath_shards": this.noise(0.3, { vol: 0.3, from: 6000, to: 3000 }); [2093, 2637, 3136].forEach((f, i) => this.tone(f, 0.06, { at: 0.05 + i * 0.05, type: "triangle", vol: 0.18 })); break;
        case "breath_bolt": this.noise(0.08, { vol: 0.6, from: 9000, to: 5000 }); this.noise(0.35, { at: 0.06, vol: 0.45, from: 1500, to: 80 }); break;

/* ---------- pixel helpers shared by the stage, title and icons ---------- */

/* Builds a sprite in the PIX_* row format from drawing calls instead of
   hand-typed strings. Used for the few small props (chest, swords) that
   are simple enough to describe as rectangles. */
function gridSprite(w, h, paint) {
  const g = Array.from({ length: h }, () => Array(w).fill(".."));
  const set = (x, y, code) => { if (x >= 0 && y >= 0 && x < w && y < h) g[y][x] = code; };
  const rect = (x, y, rw, rh, code) => { for (let j = 0; j < rh; j++) for (let i = 0; i < rw; i++) set(x + i, y + j, code); };
  paint(set, rect);
  return g.map((r) => r.join(""));
}

const CHEST_PIX_PALETTE = { body: "#b0703a", dark: "#6e3f1c", horn: "#f2c440", belly: "#fff1a8", wing: "#ffffff" };
function chestRows(open) {
  return gridSprite(28, 24, (set, rect) => {
    // body
    rect(3, 12, 22, 10, "b1"); rect(3, 20, 22, 2, "b2"); rect(3, 16, 22, 1, "d1");
    rect(6, 12, 2, 10, "h1"); rect(20, 12, 2, 10, "h1");
    rect(3, 21, 22, 1, "d2");
    if (!open) {
      rect(5, 5, 18, 1, "b0"); rect(4, 6, 20, 1, "b0"); rect(3, 7, 22, 4, "b1"); rect(3, 10, 22, 1, "b2");
      rect(6, 5, 2, 6, "h0"); rect(20, 5, 2, 6, "h0");
      rect(3, 11, 22, 1, "h2");
      rect(12, 9, 4, 5, "h0"); set(13, 11, "e1"); set(14, 11, "e1"); set(13, 12, "e1");
    } else {
      // lid flipped back, glowing loot inside
      rect(4, 2, 20, 1, "d0"); rect(3, 3, 22, 5, "d1"); rect(6, 2, 2, 6, "h1"); rect(20, 2, 2, 6, "h1");
      rect(3, 8, 22, 4, "l1"); rect(5, 9, 18, 2, "l0");
      [[7, 9], [10, 8], [13, 9], [16, 8], [19, 9], [12, 10], [15, 10], [9, 10], [18, 10]].forEach(([x, y]) => set(x, y, "h0"));
      rect(3, 11, 22, 1, "h2");
    }
  });
}
const PIX_CHEST_IDLE = { w: 28, h: 24, frames: [chestRows(false)] };
const PIX_CHEST_OPEN = { w: 28, h: 24, frames: [chestRows(true)] };

/* Five distinct swords for the shop, one silhouette per tier:
     1 Iron       plain short blade
     2 Steel      long blade, wide guard, blue pommel gem
     3 Flame      wavy blade licked with flame
     4 Storm      zig-zag lightning blade with a white-hot core
     5 Dragonfang curved fang blade, winged gold guard, red gem
   Drawn diagonally (hilt bottom-left, tip top-right) on a 20x20 grid. */
function swordIconRows(tier) {
  return gridSprite(20, 20, (set) => {
    const hx = 5, hy = 14;
    const len = [0, 9, 12, 12, 12, 12][tier];
    const perp = (i) => {                       // sideways wobble of the blade
      if (tier === 3) return Math.round(Math.sin(i * 1.1) * 0.9);
      if (tier === 4) return (Math.floor(i / 2) % 2) ? 1 : -1;
      if (tier === 5) return -Math.round(((i / len) ** 2) * 3);
      return 0;
    };
    for (let i = 1; i <= len; i++) {
      const o = perp(i), x = hx + i + o, y = hy - i + o;
      set(x, y, tier === 4 ? "W1" : "B1");              // storm: white-hot core
      set(x + 1, y, "B2");                              // shaded edge
      if (tier >= 2) set(x, y - 1, "B0");               // bright edge
      if (tier === 3 && i % 3 === 0) { set(x - 1, y - 2, "g0"); set(x - 2, y - 3, "g1"); }   // flame licks
      if (tier === 4 && i % 4 === 1) set(x + 2, y - 1, "B0");                                 // spark
    }
    const tip = len + 1, to = perp(len);
    set(hx + tip + to, hy - tip + to, "B0");
    // crossguard (perpendicular to the blade)
    const g = tier === 1 ? 2 : 3;
    for (let j = -g; j <= g; j++) set(hx + j, hy + j, tier === 5 && Math.abs(j) === g ? "g0" : "g1");
    if (tier === 5) { set(hx - 3, hy - 4, "g0"); set(hx + 4, hy + 3, "g0"); set(hx - 4, hy - 2, "g1"); set(hx + 2, hy + 4, "g1"); }  // wings
    // grip and pommel
    for (let k = 1; k <= 3; k++) set(hx - k, hy + k, "H1");
    set(hx - 4, hy + 4, tier >= 2 ? "C1" : "g1");
    set(hx - 4, hy + 5, "g2"); set(hx - 5, hy + 4, "g2");
  });
}
const SWORD_ICONS = [1, 2, 3, 4, 5].map((t) => ({ w: 20, h: 20, frames: [swordIconRows(t)] }));
const SWORD_GEMS = ["#e0a832", "#5ab0ff", "#ffcf3a", "#bff4ff", "#ff2a4a"];

/* Paints frame 0 of a pixel sprite into a canvas at the largest integer
   scale that fits, centred. Used for every small UI portrait: shop
   mounts, swords, multi-enemy minis, the boss intro, hero cards. */
function paintSpriteInto(cv, art, palette, frame = 0, key = "") {
  paintSmoothInto(cv, `icon|${key}|${frame}`, () => spriteSource(art, frame, palette));
}

/* Resolves a data-pix="kind:key" attribute to sprite art + palette. */
function pixIconSpec(spec) {
  const [kind, ...rest] = spec.split(":");
  const key = rest.join(":");
  if (kind === "enemy" || kind === "boss") {
    const a = PIX_ENEMY_ART[key];
    return a ? { art: a.art, palette: a.palette } : null;
  }
  if (kind === "mount") return { art: PIX_DRAGON, palette: ELEMENT_PALETTES[key] || ELEMENT_PALETTES.starter };
  if (kind === "sword") {
    const t = SWORD_TIERS[Math.max(0, Math.min(SWORD_TIERS.length - 1, Number(key) || 0))];
    const tier = Math.max(1, Math.min(5, Number(key) || 1));
    return { art: SWORD_ICONS[tier - 1], palette: { bladeColor: t.blade, hiltColor: t.hilt, gold: "#f2c440", clothF: SWORD_GEMS[tier - 1] } };
  }
  if (kind === "chest") return { art: PIX_CHEST_IDLE, palette: CHEST_PIX_PALETTE };
  return null;
}

function paintPixIcons() {
  document.querySelectorAll("canvas[data-pix]").forEach((cv) => {
    if (cv.dataset.pix.startsWith("mount:")) {
      const id = cv.dataset.pix.slice(6);
      paintHDInto(cv, `mount|${id}`, (ctx) => drawHDDragon(ctx, ELEMENT_PALETTES[id] || ELEMENT_PALETTES.starter, 0.15), HD_DRAGON_FIT, 1);
      return;
    }
    if (cv.dataset.pix.startsWith("pet:")) {
      const id = cv.dataset.pix.slice(4);
      paintHDInto(cv, `pet|${id}`, (ctx) => drawHDPet(ctx, id, 0.2), HD_PET_FIT, 1);
      return;
    }
    const spec = pixIconSpec(cv.dataset.pix);
    if (spec) paintSpriteInto(cv, spec.art, spec.palette, 0, cv.dataset.pix);
  });
}

/* 4x4 Bayer matrix for ordered dithering -- the "checkerboard blend"
   that 16-bit games used for smooth skies with a tiny palette. */
const BAYER4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map((v) => (v + 0.5) / 16);

function mulberry(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* Dithered vertical gradient through a list of colour stops. */
function paintDitherSky(ctx, w, h, stops) {
  const img = ctx.createImageData(w, h);
  const rgb = stops.map(hexToRgb);
  const bands = rgb.length - 1;
  for (let y = 0; y < h; y++) {
    const t = (y / Math.max(1, h - 1)) * bands;
    const i = Math.min(bands - 1, Math.floor(t));
    // quantize each band to 4 steps, dither between neighbouring steps
    const f = (t - i) * 4;
    const step = Math.floor(f), frac = f - step;
    for (let x = 0; x < w; x++) {
      const s = Math.min(4, step + (frac > BAYER4[(y & 3) * 4 + (x & 3)] ? 1 : 0)) / 4;
      const a = rgb[i], b = rgb[i + 1];
      const o = (y * w + x) * 4;
      img.data[o] = a[0] + (b[0] - a[0]) * s;
      img.data[o + 1] = a[1] + (b[1] - a[1]) * s;
      img.data[o + 2] = a[2] + (b[2] - a[2]) * s;
      img.data[o + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
}

/* Filled ridge line (mountains / hills) from a 1-D random walk. */
function paintRidge(ctx, w, h, rnd, baseY, amp, rough, color, capColor) {
  let y = baseY + (rnd() - 0.5) * amp;
  let vy = 0;
  const tops = [];
  for (let x = 0; x < w; x++) {
    vy += (rnd() - 0.5) * rough;
    vy *= 0.9;
    y += vy;
    y += (baseY - y) * 0.03;
    y = Math.max(baseY - amp, Math.min(baseY + amp, y));
    tops.push(Math.round(y));
  }
  ctx.fillStyle = color;
  for (let x = 0; x < w; x++) ctx.fillRect(x, tops[x], 1, h - tops[x]);
  if (capColor) {
    ctx.fillStyle = capColor;
    for (let x = 0; x < w; x++) if (tops[x] < baseY - amp * 0.45) ctx.fillRect(x, tops[x], 1, 2 + (x % 3 === 0 ? 1 : 0));
  }
  return tops;
}

function paintPine(ctx, x, groundY, hgt, col, hi) {
  ctx.fillStyle = col;
  ctx.fillRect(x, groundY - 2, 1, 3);
  for (let j = 0; j < hgt; j++) {
    const half = Math.floor((j % Math.max(3, Math.floor(hgt / 3))) * 0.6 + j * 0.28);
    ctx.fillRect(x - half, groundY - hgt + j, half * 2 + 1, 1);
  }
  if (hi) { ctx.fillStyle = hi; for (let j = 2; j < hgt; j += 3) ctx.fillRect(x - Math.floor(j * 0.25), groundY - hgt + j, 1, 1); }
}

/* Five battle biomes. Index order matches the old CSS BACKGROUND_STYLES
   (lava, lagoon, forest, night, ice) so arenaBiomeForWave keeps the same
   "two waves per backdrop" rhythm. */
const BIOMES = [
  { id: "volcano", sky: ["#1a0508", "#4a0f0c", "#a8321a", "#ff7a2c"], far: "#2a0c0c", mid: "#3d1410", ground: ["#6a2a1a", "#4a1c14", "#2a0e0a"], rim: "#ff9a4a", fx: "embers", glow: "#ff5a1a" },
  { id: "lagoon", sky: ["#0d2a4a", "#1f5f8a", "#5ab4d0", "#ffd9a0"], far: "#2a5a78", mid: "#1d4a5e", ground: ["#e8c98a", "#c9a868", "#8a6e40"], rim: "#fff1c4", fx: "sparkle", glow: "#9fe8ff" },
  { id: "forest", sky: ["#0e1f2a", "#1e3f3a", "#3f6a4a", "#9ac27a"], far: "#20403a", mid: "#16302a", ground: ["#4f8a3a", "#34602a", "#1e3a1a"], rim: "#a8e070", fx: "fireflies", glow: "#d8ff8a" },
  { id: "night", sky: ["#05040f", "#140c2e", "#2e1a52", "#5a2e6e"], far: "#1c1236", mid: "#120a24", ground: ["#4a4058", "#302840", "#1a1424"], rim: "#9a8ac0", fx: "stars", glow: "#c9a8ff" },
  { id: "ice", sky: ["#0a1a2e", "#1a3a5e", "#4a7eaa", "#cfe8f5"], far: "#6a8aaa", mid: "#3a5a7a", ground: ["#eaf6ff", "#bcd8ec", "#7a9cbc"], rim: "#ffffff", fx: "snow", glow: "#bff4ff" },
];

/* The arena follows the world map: WORLDS[i] is fought on BIOMES[i]. */
function arenaBiomeForWave(wave) {
  return worldIndexForWave(wave);
}

/* Paints one biome's static layers at low resolution (1 art pixel each).
   The stage scales it up with nearest-neighbour, so this runs once per
   biome change / resize rather than per frame. Returns the canvas plus
   anything the animated layer needs (star positions, ground line). */
function paintBiome(biomeIdx, bw, bh, groundY, smoothSky = false) {
  const B = BIOMES[biomeIdx];
  const c = makeTextureCanvas(bw, bh);
  const ctx = c.getContext("2d");
  const rnd = mulberry(1000 + biomeIdx * 77);
  // In smooth mode the sky is a real gradient painted at full resolution
  // underneath, so it's left transparent here.
  if (!smoothSky) paintDitherSky(ctx, bw, groundY + 2, B.sky);
  const extra = { stars: [] };

  if (B.id === "night" || B.id === "ice" || B.id === "forest") {
    const n = B.id === "night" ? 60 : 24;
    for (let i = 0; i < n; i++) extra.stars.push({ x: Math.floor(rnd() * bw), y: Math.floor(rnd() * groundY * 0.55), p: rnd() * 6.28, big: rnd() < 0.15 });
  }
  extra.celestial = null;
  if (smoothSky) {
    // drawn later at full resolution as smooth glowing discs
    if (B.id === "night") extra.celestial = { x: bw * 0.78, y: bh * 0.2, r: Math.max(6, bh * 0.1), core: "#fffbe8", edge: "#e8dcb0", glow: "rgba(200,180,255,0.35)" };
    if (B.id === "lagoon") extra.celestial = { x: bw * 0.25, y: groundY * 0.62, r: Math.max(7, bh * 0.1), core: "#fff6c8", edge: "#ffc56a", glow: "rgba(255,210,140,0.5)" };
    if (B.id === "volcano") extra.celestial = { x: bw * 0.2, y: groundY * 0.3, r: Math.max(8, bh * 0.12), core: "#ff9a5a", edge: "#e0401a", glow: "rgba(255,90,30,0.45)" };
  }
  if (B.id === "night" && !smoothSky) {
    // moon with crater dither
    const mx = Math.floor(bw * 0.78), my = Math.floor(bh * 0.2), r = Math.max(6, Math.floor(bh * 0.1));
    for (let y = -r - 3; y <= r + 3; y++) for (let x = -r - 3; x <= r + 3; x++) {
      const d = Math.hypot(x, y);
      if (d <= r) { ctx.fillStyle = (x + y) % 5 === 0 && d < r - 2 ? "#d8d0b0" : (x < -r * 0.3 && y < 0 ? "#fffbe8" : "#f0e8c8"); ctx.fillRect(mx + x, my + y, 1, 1); }
      else if (!smoothSky && d <= r + 3 && ((x + y) & 1)) { ctx.fillStyle = "#6a5a9a"; ctx.fillRect(mx + x, my + y, 1, 1); }
    }
  }
  if (B.id === "lagoon" && !smoothSky) {
    const sx = Math.floor(bw * 0.25), sy = Math.floor(groundY * 0.62), r = Math.max(7, Math.floor(bh * 0.1));
    for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) if (x * x + y * y <= r * r) { ctx.fillStyle = y < -r / 3 ? "#fff6c8" : "#ffd68a"; ctx.fillRect(sx + x, sy + y, 1, 1); }
  }
  if (B.id === "volcano" && !smoothSky) {
    const r = Math.max(8, Math.floor(bh * 0.12)), sx = Math.floor(bw * 0.2), sy = Math.floor(groundY * 0.3);
    for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) if (x * x + y * y <= r * r && ((x ^ y) & 1 || x * x + y * y < r * r * 0.6)) { ctx.fillStyle = "#ff5a2a"; ctx.fillRect(sx + x, sy + y, 1, 1); }
  }
  if (B.id === "ice" && !smoothSky) {
    // aurora ribbons
    for (let band = 0; band < 3; band++) {
      const col = ["#5affc8", "#5ad8ff", "#a88aff"][band];
      for (let x = 0; x < bw; x++) {
        const y = Math.floor(groundY * (0.18 + band * 0.08) + Math.sin(x / (9 + band * 3) + band) * 4);
        ctx.globalAlpha = 0.35; ctx.fillStyle = col; ctx.fillRect(x, y, 1, 3 + ((x >> 2) % 3));
      }
    }
    ctx.globalAlpha = 1;
  }

  // far range
  const farY = Math.floor(groundY * 0.55);
  paintRidge(ctx, bw, bh, rnd, farY, groundY * 0.2, 1.6, B.far, B.id === "ice" || B.id === "night" ? shiftHex(B.far, 0.45) : null);
  if (B.id === "volcano") {
    // volcano cone with lava crown and a lava river
    const vx = Math.floor(bw * 0.62), top = Math.floor(groundY * 0.28), base = groundY;
    for (let y = top; y < base; y++) {
      const half = Math.floor(5 + (y - top) * 0.9);
      ctx.fillStyle = "#3a1210"; ctx.fillRect(vx - half, y, half * 2, 1);
      ctx.fillStyle = "#4e1a14"; ctx.fillRect(vx - half, y, Math.floor(half * 0.6), 1);
    }
    ctx.fillStyle = "#ffb04a"; ctx.fillRect(vx - 5, top, 10, 1);
    ctx.fillStyle = "#ff5a1a"; ctx.fillRect(vx - 4, top + 1, 8, 1);
    let lx = vx;
    for (let y = top + 2; y < base; y++) { lx += Math.round((rnd() - 0.45) * 1.6); ctx.fillStyle = y % 3 ? "#ff5a1a" : "#ffb04a"; ctx.fillRect(lx, y, 2, 1); }
  }

  // mid layer
  const midY = Math.floor(groundY * 0.82);
  const midTops = paintRidge(ctx, bw, bh, rnd, midY, groundY * 0.08, 1.2, B.mid, null);
  if (B.id === "forest" || B.id === "ice") {
    for (let x = 2; x < bw; x += 4 + Math.floor(rnd() * 5)) paintPine(ctx, x, midTops[x] + 3, 10 + Math.floor(rnd() * 12), shiftHex(B.mid, -0.25), B.id === "ice" ? "#e8f6ff" : shiftHex(B.mid, 0.25));
  }
  if (B.id === "night") {
    // castle silhouette with lit windows
    const cx = Math.floor(bw * 0.18), baseY = midTops[cx] + 2, col = "#0a0616";
    ctx.fillStyle = col;
    ctx.fillRect(cx - 10, baseY - 14, 20, 16);
    [[-12, 22], [10, 18], [-2, 28]].forEach(([dx, hh]) => {
      ctx.fillRect(cx + dx, baseY - hh, 5, hh);
      for (let i = 0; i < 5; i += 2) ctx.fillRect(cx + dx + i, baseY - hh - 2, 1, 2);
    });
    ctx.fillStyle = "#ffcf5a";
    [[-11, 16], [11, 12], [0, 22], [-5, 8], [5, 8]].forEach(([dx, dy]) => ctx.fillRect(cx + dx, baseY - dy, 1, 2));
  }
  if (B.id === "lagoon") {
    // sea band with light streaks, then palm silhouettes
    const seaY = Math.floor(groundY * 0.72);
    ctx.fillStyle = "#1f6f98"; ctx.fillRect(0, seaY, bw, groundY - seaY + 2);
    ctx.fillStyle = "#2f8fb8"; for (let y = seaY + 2; y < groundY; y += 3) ctx.fillRect(0, y, bw, 1);
    [Math.floor(bw * 0.08), Math.floor(bw * 0.92)].forEach((px, k) => {
      const lean = k ? -1 : 1;
      ctx.fillStyle = "#3a2a1a";
      for (let j = 0; j < 22; j++) ctx.fillRect(px + Math.round(Math.sin(j / 9) * 3 * lean), groundY - j, 2, 1);
      const tx = px + Math.round(Math.sin(21 / 9) * 3 * lean), ty = groundY - 22;
      ctx.fillStyle = "#1e5a2a";
      for (let a = 0; a < 6; a++) { const ang = -Math.PI + a * (Math.PI / 5); for (let r = 0; r < 9; r++) ctx.fillRect(tx + Math.round(Math.cos(ang) * r), ty + Math.round(Math.sin(ang) * r * 0.5 + r * r * 0.05), 2, 1); }
    });
  }
  if (B.id === "volcano") {
    for (let x = 0; x < bw; x += 7 + Math.floor(rnd() * 8)) {
      const hh = 4 + Math.floor(rnd() * 8);
      ctx.fillStyle = "#1e0806";
      for (let j = 0; j < hh; j++) ctx.fillRect(x - Math.floor((hh - j) / 3), midTops[Math.min(bw - 1, x)] - j + 2, 1 + Math.floor((hh - j) / 1.5), 1);
    }
  }

  // ground platform: rim highlight, top face, textured body
  const [gTop, gMid, gDark] = B.ground;
  ctx.fillStyle = gMid; ctx.fillRect(0, groundY, bw, bh - groundY);
  ctx.fillStyle = gTop; ctx.fillRect(0, groundY, bw, 2);
  ctx.fillStyle = B.rim; for (let x = 0; x < bw; x += 1) if ((x * 7) % 11 < 6) ctx.fillRect(x, groundY, 1, 1);
  for (let y = groundY + 3; y < bh; y++) for (let x = 0; x < bw; x++) {
    const v = rnd();
    const t = (y - groundY) / Math.max(1, bh - groundY);
    const dens = smoothSky ? 0.35 : 1;   // smooth mode: calmer ground texture
    if (v < (0.08 + t * 0.35) * dens && BAYER4[(y & 3) * 4 + (x & 3)] < t + 0.2) { ctx.fillStyle = gDark; ctx.fillRect(x, y, 1, 1); }
    else if (v > 1 - 0.015 * dens) { ctx.fillStyle = gTop; ctx.fillRect(x, y, 1, 1); }
  }
  if (B.id === "forest" || B.id === "lagoon") {
    ctx.fillStyle = B.id === "forest" ? "#7ac04a" : "#f5deaa";
    for (let x = 1; x < bw; x += 3 + Math.floor(rnd() * 4)) { ctx.fillRect(x, groundY - 1, 1, 1); if (rnd() < 0.5) ctx.fillRect(x + 1, groundY - 2, 1, 2); }
  }
  if (B.id === "volcano") {
    ctx.fillStyle = "#ff7a2c";
    for (let i = 0; i < 6; i++) { let x = Math.floor(rnd() * bw), y = groundY + 3 + Math.floor(rnd() * (bh - groundY - 4)); for (let k = 0; k < 6; k++) { ctx.fillRect(x, y, 1, 1); x += 1; y += rnd() < 0.5 ? 0 : (rnd() < 0.5 ? -1 : 1); } }
  }
  extra.groundY = groundY;
  return { canvas: c, extra };
}

/* Dark corners so the combatants sit in a pool of light. Baked once. */
function makeVignette(w, h, rgb = "8,4,16", strength = 0.6) {
  const c = makeTextureCanvas(w, h);
  const ctx = c.getContext("2d");
  const g = ctx.createRadialGradient(w / 2, h * 0.62, Math.min(w, h) * 0.25, w / 2, h * 0.55, Math.max(w, h) * 0.75);
  g.addColorStop(0, `rgba(${rgb},0)`);
  g.addColorStop(1, `rgba(${rgb},${strength})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  return c;
}

/* Older Android WebViews (before Chrome 99) lack roundRect; a plain
   rectangle is a fine stand-in there. */
if (typeof CanvasRenderingContext2D !== "undefined" && !CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h) { this.rect(x, y, w, h); };
}

/* ---------- the stage ---------- */
const BattleStage = {
  ready: false,

  init(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.dragonStrips = []; this.enemyStrips = [];
    this.dragonFlash = []; this.enemyFlash = [];
    this.popups = []; this.effects = []; this.parts = []; this.fx = [];
    this._enemySprite = null; this._enemySpriteKey = null;
    this._palette = ELEMENT_PALETTES.starter; this._mountPalette = null; this._hero = "boy";
    this._enemyKind = "text"; this._enemyName = null; this._chestMode = "idle";
    this._chestEnemyRef = null; this._chestWasOpen = false;
    this._trackRef = null; this._trackHp = 0; this._deadRef = null;
    this._biome = -1; this._bg = null; this._bgPrev = null; this._bgFadeStart = 0;
    this._enemyGlow = "#ffffff"; this._isBoss = false; this._poisoned = false; this._charging = false;
    this.playerLayer = { x: 0, y: 0, scale: 1, alpha: 1 };
    this.enemyLayer = { x: 0, y: 0, scale: 1, alpha: 1 };
    this.enemyText = makeSprite("text", { text: "", fontSize: 40, color: "#ffffff", originY: 1, baseline: "bottom" });
    this.shakeUntil = 0; this.shakeMag = 0; this.flashUntil = 0; this.whiteUntil = 0;
    this.enemyFlashUntil = 0; this.playerFlashUntil = 0;
    this._last = 0; this._spawnAcc = 0;
    this.ready = true;
  },

  layout(w, h) {
    this.W = w; this.H = h;
    // Sprite scale follows the stage WIDTH (capped by height), so a tall
    // phone shows more sky instead of blowing the fighters up.
    this.unit = Math.max(1, (Math.min(h, w * 0.73) * 0.42) / DRAGON_ART_GRID);
    this.ap = Math.max(2, Math.round(h / 84));          // CSS px per background art pixel
    this.bw = Math.ceil(w / this.ap); this.bh = Math.ceil(h / this.ap);
    this.groundArtY = Math.floor(this.bh * 0.8);
    this.groundY = this.groundArtY * this.ap;
    this.playerBase = { x: w * 0.3, y: h * 0.93 };
    this.enemyBase = { x: w * 0.74, y: h * 0.92 };
    this.dragonOriginX = -(DRAGON_ART_GRID * this.unit) / 2;
    this.dragonOriginY = -(DRAGON_ART_GRID * this.unit) + this.unit * 5;
    this.playerLayer.x = this.playerBase.x; this.playerLayer.y = this.playerBase.y;
    this.enemyLayer.x = this.enemyBase.x; this.enemyLayer.y = this.enemyBase.y;
    const enemyFont = Math.round(Math.min(w * 0.22, h * 0.43));
    this.enemyText.fontSize = enemyFont;
    this.vignette = makeVignette(w, h);
    this.bossVignette = makeVignette(w, h, "255,30,10", 0.85);
    this._cachedPaletteKey = null; this._enemySpriteKey = null; this._biome = -1; this._bgPrev = null;
    this.rebuildCaches();
  },

  setBiome(idx) {
    if (idx === this._biome || !this.bw) return;
    const first = this._biome === -1;
    this._bgPrev = first ? null : this._bg;
    this._biome = idx;
    // Paint the scenery at low resolution, EPX-smooth it up to device
    // resolution, and lay it over a true gradient sky.
    const low = paintBiome(idx, this.bw, this.bh, this.groundArtY, true);
    const dpr = this.dpr || 1;
    const out = makeTextureCanvas(this.bw * this.ap * dpr, this.bh * this.ap * dpr);
    const octx = out.getContext("2d");
    const sky = octx.createLinearGradient(0, 0, 0, this.groundY * dpr);
    BIOMES[idx].sky.forEach((col, i, arr) => sky.addColorStop(i / (arr.length - 1), col));
    octx.fillStyle = sky; octx.fillRect(0, 0, out.width, out.height);
    if (BIOMES[idx].id === "ice") {
      // aurora: soft glowing ribbons
      const k = this.ap * dpr;
      octx.save(); octx.filter = `blur(${k * 1.2}px)`; octx.globalAlpha = 0.45; octx.lineCap = "round";
      ["#5affc8", "#5ad8ff", "#a88aff"].forEach((col, band) => {
        octx.strokeStyle = col; octx.lineWidth = k * (3 + band);
        octx.beginPath();
        for (let x = 0; x <= this.bw; x += 1) {
          const y = this.groundArtY * (0.18 + band * 0.08) + Math.sin(x / (9 + band * 3) + band) * 4;
          if (x) octx.lineTo(x * k, y * k); else octx.moveTo(x * k, y * k);
        }
        octx.stroke();
      });
      octx.restore();
    }
    const cel = low.extra.celestial;
    if (cel) {
      const k = this.ap * dpr, x = cel.x * k, y = cel.y * k, r = cel.r * k;
      const halo = octx.createRadialGradient(x, y, r * 0.8, x, y, r * 2.6);
      halo.addColorStop(0, cel.glow); halo.addColorStop(1, "rgba(0,0,0,0)");
      octx.fillStyle = halo; octx.beginPath(); octx.arc(x, y, r * 2.6, 0, Math.PI * 2); octx.fill();
      const disc = octx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
      disc.addColorStop(0, cel.core); disc.addColorStop(1, cel.edge);
      octx.fillStyle = disc; octx.beginPath(); octx.arc(x, y, r, 0, Math.PI * 2); octx.fill();
    }
    octx.drawImage(renderSmooth(low.canvas, out.width, out.height, 0), 0, 0);
    this._bg = { canvas: out, extra: low.extra };
    this._bgFadeStart = performance.now();
    this.parts = this.parts.filter((p) => !p.ambient);
  },

  rebuildCaches() {
    if (this.unit === undefined) return;
    const paletteKey = `${this._hero || "boy"}|` + (this._mountPalette
      ? `${this._mountPalette.body}|${this._mountPalette.dark}|${this._mountPalette.belly}|${this._mountPalette.wing}|${this._mountPalette.horn}`
      : "onfoot") + `|${this._swordTier || 0}|${this._growth || "adult"}`;
    if (paletteKey !== this._cachedPaletteKey) { this._cachedPaletteKey = paletteKey; this.bakePlayer(); }
    const petKey = `${this._petId || ""}|${this.unit}`;
    if (petKey !== this._cachedPetKey) { this._cachedPetKey = petKey; this.bakePet(); }
    let wantKey = null, wantSprite = null;
    if (this._enemyKind === "chest") {
      wantKey = "__chest_" + this._chestMode;
      wantSprite = { art: this._chestMode === "open" ? PIX_CHEST_OPEN : PIX_CHEST_IDLE, palette: CHEST_PIX_PALETTE, sizePct: 0.62 };
    } else if (this._enemyName && PIX_ENEMY_ART[this._enemyName]) {
      wantKey = this._enemyName; wantSprite = PIX_ENEMY_ART[this._enemyName];
    }
    if (wantKey !== this._enemySpriteKey) { this._enemySpriteKey = wantKey; this._enemySprite = wantSprite; this.bakeEnemy(); }
  },

  /* Sprites are baked once per look (hero, mount, sword tier, enemy) as
     smooth textures at device resolution; the frame loop only blits them. */
  /* The hero (and dragon mount) are HD vector drawings (hd-art.js),
     rendered at the "medium pixel" grid into textures at device resolution.
     Mounted: 4 wing-flap frames. On foot: 2 frames (cape sway). */
  bakePlayer() {
    const u = this.unit;
    if (!u || !isFinite(u)) return;
    this.dragonStrips = []; this.dragonFlash = [];
    const mounted = !!this._mountPalette;
    const hero = this._hero || "boy", tier = this._swordTier || 0;
    const H = hdHeroLook(hero, tier);
    const targetH = DRAGON_ART_GRID * u;
    const fit = mounted ? HD_DRAGON_FIT : HD_HERO_FIT;
    const growth = DRAGON_GROWTH.find((g) => g.id === this._growth) || DRAGON_GROWTH[2];
    const texH = mounted ? targetH * 0.9 * growth.scale : targetH * 0.86;
    const texW = texH * fit.w / fit.h;
    const dpr = this.dpr || 1;
    const frames = mounted ? 4 : 2;
    let meta = null;
    for (let f = 0; f < frames; f++) {
      const t = f / frames;
      const tex = hdRender((ctx) => {
        if (mounted) {
          drawHDDragon(ctx, this._mountPalette, t);
          if (growth.id === "elder") drawHDElderArmor(ctx, t);
          drawHDRider(ctx, H, t);
        } else drawHDHeroStanding(ctx, H, t);
      }, fit, texW, texH, dpr, 1);
      meta = meta || tex;
      this.dragonStrips.push(makeSprite("image", { canvas: tex, dw: texW, dh: texH, originX: 0, originY: 0 }));
      this.dragonFlash.push(makeSprite("image", { canvas: makeFlashCanvas(tex), dw: texW, dh: texH, originX: 0, originY: 0 }));
    }
    this._pixScale = 2;
    // flying mounts hover a little above the ground; heroes on foot stand on it
    this._stripBaseX = Math.round(this.dragonOriginX + (targetH - texW) / 2 - (mounted ? u * 2 : 0));
    this._stripBaseY = Math.round(this.dragonOriginY + DRAGON_ART_GRID * u - texH - (mounted ? u * 3 : 0));
    // design-space -> texture CSS px, for the sword effects and the fireball
    const k = meta._designScale, off = meta._designOffset;
    const toTex = (x, y) => ({ x: (x + off.x) * k, y: (y + off.y) * k });
    const R = (x, y) => mounted
      ? toTex(108 + HD_RIDER_FWD + (x - 108) * HD_RIDER_SCALE, HD_RIDER_Y + (y - 74) * HD_RIDER_SCALE)
      : toTex(x, y);
    // blade: from the hilt to the tip, sampled along its length
    const [h0, t0] = mounted ? [[130, 52], [157, 10]] : [[66, 50], [80, 4]];
    this._blade = [];
    for (let i = 0; i <= 10; i++) this._blade.push(R(h0[0] + (t0[0] - h0[0]) * i / 10, h0[1] + (t0[1] - h0[1]) * i / 10));
    this._blade.sort((a, b) => a.y - b.y);   // [0] = tip
    this._mouth = mounted ? toTex(180 + 40 * 1.15, 38 + 12 * 1.15) : this._blade[0];
    this._texW = texW; this._texH = texH;
  },

  /* sizePct lets minions (e.g. Ooze Spawn) render smaller than a full-size
     enemy, centred on the same full-size footprint so they don't float. */
  bakeEnemy() {
    const u = this.unit;
    if (!u || !isFinite(u)) return;
    this.enemyStrips = []; this.enemyFlash = [];
    const sprite = this._enemySprite;
    if (!sprite) return;
    const fullH = DRAGON_ART_GRID * u;
    const targetH = fullH * (sprite.sizePct || 1) * 0.92;
    const scale = targetH / sprite.art.h;
    const texW = (sprite.art.w + 2) * scale, texH = (sprite.art.h + 2) * scale;
    const dpr = this.dpr || 1;
    for (let f = 0; f < sprite.art.frames.length; f++) {
      const key = `enemy|${this._enemySpriteKey}|${f}`;
      const tex = renderSmoothCached(key, () => spriteSource(sprite.art, f, sprite.palette), texW * dpr, texH * dpr);
      this.enemyStrips.push(makeSprite("image", { canvas: tex, dw: texW, dh: texH, originX: 0, originY: 0 }));
      this.enemyFlash.push(makeSprite("image", { canvas: makeFlashCanvas(tex), dw: texW, dh: texH, originX: 0, originY: 0 }));
    }
    this._enemyPixScale = scale;
    this._eTexW = texW; this._eTexH = texH;
    this._enemyBaseX = Math.round(this.dragonOriginX + (fullH - texW) / 2);
    this._enemyBaseY = Math.round(this.dragonOriginY + DRAGON_ART_GRID * u - texH + scale);
  },

  /* ---------- particles ---------- */
  spawn(p) {
    if (this.parts.length > 420) return;
    this.parts.push(Object.assign({ vx: 0, vy: 0, g: 0, life: 600, age: 0, size: this.ap, color: "#fff", drag: 1 }, p));
  },
  burst(x, y, colors, count, speed, opts = {}) {
    if (document.documentElement.classList.contains("reduce-motion")) count = Math.ceil(count / 3);
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const v = speed * (0.35 + Math.random() * 0.65);
      this.spawn(Object.assign({
        x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - (opts.up || 0),
        g: opts.g ?? 0.0009, life: (opts.life || 520) * (0.6 + Math.random() * 0.6),
        color: colors[(Math.random() * colors.length) | 0], size: this.ap * (Math.random() < 0.3 ? 2 : 1), drag: 0.985,
      }, opts.extra || {}));
    }
  },

  updateParticles(dt) {
    for (let i = this.parts.length - 1; i >= 0; i--) {
      const p = this.parts[i];
      p.age += dt;
      if (p.age >= p.life) { this.parts.splice(i, 1); continue; }
      p.vy += p.g * dt;
      p.vx *= Math.pow(p.drag, dt / 16); p.vy *= Math.pow(p.drag, dt / 16);
      if (p.wobble) p.vx += Math.sin((p.age + p.seed) / 260) * p.wobble;
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
  },

  drawParticles(ctx, now, front) {
    for (const p of this.parts) {
      if (!!p.front !== front) continue;
      const t = p.age / p.life;
      let a = p.fadeIn ? Math.min(1, p.age / 250) * (1 - t) : (t > 0.6 ? 1 - (t - 0.6) / 0.4 : 1);
      if (p.twinkle) a *= 0.5 + 0.5 * Math.sin(now / 90 + p.seed);
      if (a <= 0) continue;
      ctx.globalAlpha = a;
      ctx.fillStyle = p.hue !== undefined ? `hsl(${(p.hue + now / 6) % 360},95%,65%)` : p.color;
      const r = Math.max(1, p.size * 0.6);
      const x = p.x, y = p.y;
      ctx.beginPath();
      if (p.shape === "plus") {
        // four-point twinkle star
        const L = r * 2.6, n = r * 0.45;
        ctx.moveTo(x, y - L); ctx.lineTo(x + n, y - n); ctx.lineTo(x + L, y); ctx.lineTo(x + n, y + n);
        ctx.lineTo(x, y + L); ctx.lineTo(x - n, y + n); ctx.lineTo(x - L, y); ctx.lineTo(x - n, y - n);
        ctx.closePath(); ctx.fill();
      } else if (p.shape === "ring") {
        // bubble
        ctx.lineWidth = Math.max(1, r * 0.5); ctx.strokeStyle = ctx.fillStyle;
        ctx.arc(x, y, r * 1.6, 0, Math.PI * 2); ctx.stroke();
      } else {
        ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  },

  spawnAmbient(dt, now) {
    const B = BIOMES[this._biome];
    if (!B) return;
    this._spawnAcc += dt;
    const every = { embers: 90, sparkle: 260, fireflies: 320, stars: 900, snow: 70 }[B.fx] || 400;
    while (this._spawnAcc > every) {
      this._spawnAcc -= every;
      const W = this.W, H = this.H;
      if (B.fx === "embers") this.spawn({ ambient: true, x: Math.random() * W, y: H + 4, vx: (Math.random() - 0.5) * 0.02, vy: -0.03 - Math.random() * 0.05, life: 5000, color: Math.random() < 0.5 ? "#ffb04a" : "#ff5a1a", wobble: 0.0006, seed: Math.random() * 999, fadeIn: true });
      else if (B.fx === "snow") this.spawn({ ambient: true, x: Math.random() * W * 1.2, y: -4, vx: -0.012, vy: 0.025 + Math.random() * 0.03, life: 9000, color: "#ffffff", wobble: 0.0004, seed: Math.random() * 999, fadeIn: true, size: this.ap * (Math.random() < 0.25 ? 2 : 1) });
      else if (B.fx === "fireflies") this.spawn({ ambient: true, x: Math.random() * W, y: this.groundY * (0.4 + Math.random() * 0.55), vx: (Math.random() - 0.5) * 0.02, vy: (Math.random() - 0.5) * 0.01, life: 4200, color: "#e8ff8a", wobble: 0.0008, seed: Math.random() * 999, fadeIn: true, twinkle: true });
      else if (B.fx === "sparkle") this.spawn({ ambient: true, x: Math.random() * W, y: this.groundY * (0.74 + Math.random() * 0.2), life: 900, color: "#ffffff", twinkle: true, seed: Math.random() * 999, fadeIn: true, shape: Math.random() < 0.3 ? "plus" : null });
      else if (B.fx === "stars") this.spawn({ ambient: true, x: Math.random() * W, y: Math.random() * this.groundY * 0.4, vx: -0.35, vy: 0.12, life: 420, color: "#ffffff", drag: 1 });
    }
    // Effect-driven ambient: poison bubbles, boss wind-up.
    // Sword effects by tier: glints (1-2), embers (3), sparks (4), dragon aura (5).
    const tier = this._swordTier || 0;
    if (this._blade && this._blade.length && tier > 0) {
      const bx = this.playerLayer.x + this._stripBaseX, by = this.playerLayer.y + this._stripBaseY;
      const pt = this._blade[(Math.random() * this._blade.length) | 0];
      const rate = [0, 900, 600, 45, 35, 40][tier];
      if (Math.random() < dt / rate) {
        if (tier <= 2) this.spawn({ x: bx + pt.x, y: by + pt.y, life: 500, color: "#ffffff", twinkle: true, seed: Math.random() * 999, shape: "plus", size: this.ap * 1.2, front: true });
        else if (tier === 3) this.spawn({ x: bx + pt.x, y: by + pt.y, vx: (Math.random() - 0.5) * 0.02, vy: -0.05 - Math.random() * 0.05, life: 600, color: ["#fff3b0", "#ffcf3a", "#ff7a1c", "#d8321f"][(Math.random() * 4) | 0], wobble: 0.0006, seed: Math.random() * 999, front: true });
        else if (tier === 4) this.spawn({ x: bx + pt.x, y: by + pt.y, vx: (Math.random() - 0.5) * 0.25, vy: (Math.random() - 0.5) * 0.25, life: 180, color: Math.random() < 0.5 ? "#ffffff" : "#8fe9ff", drag: 0.9, front: true, size: this.ap * 0.8 });
        else this.spawn({ x: bx + pt.x + (Math.random() - 0.5) * this.unit * 3, y: by + pt.y, vy: -0.03, life: 900, color: Math.random() < 0.6 ? "#ff2a4a" : "#f2c440", twinkle: true, seed: Math.random() * 999, fadeIn: true, front: true });
      }
    }
    // Answer streak 7+: sparks crackle along the blade.
    if (this._fire >= 3 && this._blade && this._blade.length && Math.random() < dt / (this._fire >= 4 ? 18 : 30)) {
      const pt = this._blade[(Math.random() * this._blade.length) | 0];

  /* ---------- frame ---------- */
  draw(now) {
    const ctx = this.ctx;
    if (!ctx || !this.unit) return;
    const dt = Math.min(50, now - (this._last || now)); this._last = now;
    this.spawnAmbient(dt, now);
    this.updateParticles(dt);
    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0, 0, this.W, this.H);

    // Reduce motion (Settings or the phone setting): no shake, no white flash.

    if (!calm && now < this.shakeUntil) {
      const mag = this.unit * (this.shakeMag || 0.5);
      sx = Math.round((Math.random() - 0.5) * mag); sy = Math.round((Math.random() - 0.5) * mag);
    }
    ctx.save(); ctx.translate(sx, sy);
    this.drawBackground(ctx, now);
    this.drawParticles(ctx, now, false);
    this.drawQueue(ctx, now);
    this.drawPlayer(ctx, now);
    this.drawPet(ctx, now);
    this.drawShield(ctx, now);
    this.drawEnemy(ctx, now);
    for (const e of this.effects) drawSprite(ctx, e);
    this.drawFx(ctx, now);
    this.drawParticles(ctx, now, true);
    this.drawStaminaBars(ctx, now);
    for (const p of this.popups) drawSprite(ctx, p);

    if (this.vignette) ctx.drawImage(this.vignette, 0, 0, this.W, this.H);
    if (this._isBoss && this.bossVignette) {

      ctx.globalAlpha = 1;

      const remain = (this.flashUntil - now) / 350;

      ctx.fillRect(0, 0, this.W, this.H);
    }
    if (!calm && now < this.whiteUntil) {

      ctx.fillRect(0, 0, this.W, this.H);

  },

  /* ---------- pet: stands by the dragon's tail, pounces on its turn ---------- */
  bakePet() {

  petHome() {

  drawPet(ctx, now) {

  /* ---------- stamina bars over the dragon and the pet ---------- */

  /* ---------- dragon breath: rise, breathe, land ---------- */
  dragonBreath(b) {

      const x0 = this.playerLayer.x + this._stripBaseX + m.x, y0 = this.playerLayer.y + this._stripBaseY + m.y;

    }, 340);

      const E = this.enemyBox(), t = performance.now();

      this.burst(E.cx, E.cy, b.colors, 40, 0.34, { up: 0.08, g: 0.0008, life: 650, extra: { front: true, shape: b.style === "shards" ? "plus" : null } });

  drawBreath(ctx, f, t, now) {

    } else if (f.style === "rock" || f.style === "shards") {
      const count = f.style === "rock" ? 3 : 5;
      for (let k = 0; k < count; k++) {
        const ek = Math.max(0, Math.min(1, e * 1.25 - k * 0.07));
        if (ek <= 0) continue;
        const off = (k - (count - 1) / 2) * u * 2.4 * (1 - ek);
        const x = f.x0 + (f.x1 - f.x0) * ek, y = f.y0 + (f.y1 - f.y0) * ek - Math.sin(ek * Math.PI) * u * (f.style === "rock" ? 7 : 2) + off;

        const x = f.x0 + (f.x1 - f.x0) * ek, y = f.y0 + (f.y1 - f.y0) * ek;

  },

  /* ---------- answer streak, drawn on the rider's sword ---------- */
  streakPoints(dy) {
    const b = this._blade;
    if (!b || !b.length) return null;
    return { tip: { x: this._stripBaseX + b[0].x, y: this._stripBaseY + b[0].y + dy }, hilt: { x: this._stripBaseX + b[b.length - 1].x, y: this._stripBaseY + b[b.length - 1].y + dy } };
  },
  drawStreakBlade(ctx, now, dy) {
    const lv = this._fire, pts = this.streakPoints(dy);
    if (!pts) return;
    const pulse = 0.75 + 0.25 * Math.sin(now / (lv >= 4 ? 90 : 160));

    const label = `🔥${n}`;
    ctx.save();
    ctx.font = `900 ${fs}px Nunito, sans-serif`;
    const tw = ctx.measureText(label).width, bw = tw + fs * 0.8, bh = fs * 1.35;
    const bx = Math.min(this.W - this.playerLayer.x - bw - 2, pts.tip.x - bw / 2), by = pts.tip.y - bh - this.unit * 2 + Math.sin(now / 300) * this.unit * 0.5;
    ctx.fillStyle = "#140d10"; ctx.beginPath(); ctx.roundRect(bx - 2, by - 2, bw + 4, bh + 4, bh / 2 + 2); ctx.fill();

  },
  drawSpeedLines(ctx, now) {

  },

  /* Dragon Scales: a faint shimmering bubble plus one pip per hit left. */
  drawShield(ctx, now) {
    const n = S.shieldHits || 0;
