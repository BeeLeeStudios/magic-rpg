/* Derives the 3-step light ramp for a material from its base colour, so
   authoring only needs one colour per slot.

   v2: the ramp is HUE-SHIFTED, not just lightened/darkened. Highlights
   drift toward warm yellow and shadows toward cool violet -- the standard
   pixel-art trick that makes flat ramps look painted and lit instead of
   "the same colour, but greyer". Memoized since every bake calls it for
   every slot. */
const PIX_RAMP_CACHE = new Map();
function hueToward(h, target, amt) {
  let d = ((target - h + 540) % 360) - 180;
  return (h + d * amt + 360) % 360;
}
function hueShiftHex(hex, target, amt, satMul = 1) {
  const [h, sat, l] = rgbToHsl(...hexToRgb(hex));
  if (sat < 0.06) return hex;
  return rgbToHex(...hslToRgb(hueToward(h, target, amt), Math.min(1, sat * satMul), l));
}
function pixRamp(base) {
  let r = PIX_RAMP_CACHE.get(base);
  if (r) return r;
  // Same light/dark steps as the original ramp, then the hue nudge.
  const [h, , l] = rgbToHsl(...hexToRgb(base));
  const warmSkin = h < 50 && l > 0.55;   // a cool shift on skin reads as bruising
  const hi = hueShiftHex(shiftHex(base, 0.30), 55, 0.12, 1.05);
  const lo = hueShiftHex(shiftHex(base, -0.36), 255, warmSkin ? 0.03 : 0.1, 1.1);
  r = [hi, base, lo];
  PIX_RAMP_CACHE.set(base, r);
  return r;
}

const PIX_OUTLINE = "#140d10";

/* Paints one sprite frame onto a 2D context at `scale` device pixels per
   sprite pixel.

   v2 lighting passes, all resolved at bake time so the frame loop still
   only blits one image per sprite:
     1. Tinted outline ("sel-out"): the silhouette edge takes a very dark
        version of the colour it touches instead of flat black, so a green
        slime gets a deep-green rim and a fire dragon a deep-red one.
     2. Rim light: pixels whose top neighbour is empty catch the (upper)
        light; pixels sitting on empty space below pick up occlusion.
     3. Specular pips: the lightest pixel of a lit edge gets a tiny
        near-white highlight on big sprites. */
function paintPixelFrame(ctx, sprite, frameIdx, palette, scale, ox, oy) {
  const rows = sprite.frames[frameIdx];
  const w = sprite.w, h = sprite.h;
  const ramps = {};
  for (const ch of Object.keys(PIX_SLOT_KEY)) {
    const col = palette[PIX_SLOT_KEY[ch]];
    if (col) ramps[ch] = pixRamp(col);
  }

  const slotAt = (x, y) => {
    if (x < 0 || y < 0 || x >= w || y >= h) return ".";
    return rows[y].charAt(x * 2);
  };
  const filled = (x, y) => slotAt(x, y) !== ".";

  const colorAt = (x, y) => {
    const row = rows[y];
    const ch = row.charAt(x * 2);
    if (ch === ".") return null;
    if (ch === "e") return PIX_OUTLINE;
    if (ch === "W") return "#ffffff";
    const ramp = ramps[ch];
    if (!ramp) return null;
    const sh = parseInt(row.charAt(x * 2 + 1), 10);
    return ramp[isNaN(sh) ? 1 : sh];
  };
  const outlineFor = (x, y) => {
    // The first filled orthogonal neighbour decides the tint.
    const nb = [[x, y + 1], [x, y - 1], [x - 1, y], [x + 1, y]];
    for (const [nx, ny] of nb) {
      if (!filled(nx, ny)) continue;
      const ch = slotAt(nx, ny);
      const ramp = ramps[ch];
      if (!ramp) return PIX_OUTLINE;
      return shiftHex(ramp[2], -0.62);
    }
    return PIX_OUTLINE;
  };

  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (filled(x, y)) continue;
      if (filled(x + 1, y) || filled(x - 1, y) || filled(x, y + 1) || filled(x, y - 1)) {
        ctx.fillStyle = outlineFor(x, y);
        ctx.fillRect(ox + x * scale, oy + y * scale, scale, scale);
      }
    }
  }

  const big = w * h >= 900;
  for (let y = 0; y < h; y++) {
    const row = rows[y];
    for (let x = 0; x < w; x++) {
      const ch = row.charAt(x * 2);
      let col = colorAt(x, y);
      if (!col) continue;
      if (ch !== "e" && ch !== "W") {
        const topOpen = !filled(x, y - 1);
        const leftOpen = !filled(x - 1, y);
        const bottomOpen = !filled(x, y + 1);
        if (topOpen) col = shiftHex(col, 0.22);
        else if (leftOpen) col = shiftHex(col, 0.1);
        else if (bottomOpen) col = shiftHex(col, -0.16);
        if (big && topOpen && leftOpen) col = shiftHex(col, 0.45);
      }
      ctx.fillStyle = col;
      ctx.fillRect(ox + x * scale, oy + y * scale, scale, scale);
    }
  }
}

/* White silhouette of a baked frame, used for the one-frame "hit flash"
   every good action game has. */
function makeFlashCanvas(src, color) {
  const c = makeTextureCanvas(src.width, src.height);
  const cx = c.getContext("2d");
  cx.drawImage(src, 0, 0);
  cx.globalCompositeOperation = "source-in";
  cx.fillStyle = color || "#ffffff";
  cx.fillRect(0, 0, c.width, c.height);
  return c;
}

/* Largest whole-number scale that fits the sprite in the space available.
   Never fractional -- that's what keeps the pixels square. */
function pixScaleFor(sprite, targetH) {
  return Math.max(1, Math.floor(targetH / sprite.h));
}

/* ---------- soft clay renderer (dragon) ----------
   Clay needs radial gradients and soft shadows, neither of which Phaser's
   Graphics can do. So instead of drawing the dragon shape-by-shape every
   frame, it's baked ONCE into canvas textures using the normal 2D context
   (which has both), and the frame loop just moves those textures around.
   That's not a compromise -- it's strictly faster than the Graphics path,
   because per-frame drawing drops to zero.

   The dragon is baked as a few separate strips rather than one image,
   split wherever the `moves` flag changes, so the wings and spikes can
   still lift independently of the body. */
const CLAY = {
  hi: 0.55,        // gradient highlight, toward white
  lo: 0.42,        // gradient shade, toward black
  gradCX: 0.32,    // light position within each part's bounding box
  gradCY: 0.28,
  gloss: 0.38,     // specular strength on round masses
  partShadow: 0.95,
  partBlur: 0.9,   // in grid units, scaled by `unit`
  partOffX: 0.5,
  partOffY: 0.8,
  minGlossSize: 6,
  pad: 4,          // grid units of margin so shadows aren't clipped
  // Bake at 2x and draw at half scale. The textures are only a couple of
  // hundred pixels square, so the extra memory is negligible, and the
  // downsample takes the hard stair-stepping off the gradients.
  ss: 2,
};

/* Splits a part list into consecutive runs of same `moves` value, so each
   run can become its own texture and be offset independently. */
function splitPartRuns(parts) {
  const runs = [];
  for (const part of parts) {
    const moves = !!part.moves;
    const last = runs[runs.length - 1];
    if (last && last.moves === moves) last.parts.push(part);
    else runs.push({ moves, parts: [part] });
  }
  return runs;
}

function traceShape(ctx, shape, ox, oy, u) {
  ctx.beginPath();
  if (shape.type === "rect") {
    ctx.rect(ox + shape.x * u, oy + shape.y * u, shape.w * u, shape.h * u);
  } else if (shape.type === "circle") {
    ctx.arc(ox + shape.cx * u, oy + shape.cy * u, shape.r * u, 0, Math.PI * 2);
  } else if (shape.type === "ellipse") {
    ctx.ellipse(ox + shape.cx * u, oy + shape.cy * u, shape.rx * u, shape.ry * u, 0, 0, Math.PI * 2);
  } else {
    shape.pts.forEach(([x, y], i) => {
      const px = ox + x * u, py = oy + y * u;
      if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
    });
    ctx.closePath();
  }
}

/* Paints one run of parts onto a 2D context in the clay style. Each mass
   gets a soft cast shadow (which is what separates the head from the body
   now that there are no outlines), a radial gradient, and a specular pip
   if it's a large rounded form. */
function paintClayParts(ctx, parts, ox, oy, u) {
  for (const part of parts) {
    const b = partBounds(part);
    const isOutlineColor = part.fill === DRAGON_OUTLINE;

    ctx.save();
    // The shadow is cast by the fill itself, so one fill call gives both.
    ctx.shadowColor = `rgba(18,11,6,${CLAY.partShadow})`;
    ctx.shadowBlur = u * CLAY.partBlur;
    ctx.shadowOffsetX = u * CLAY.partOffX;
    ctx.shadowOffsetY = u * CLAY.partOffY;

    if (isOutlineColor) {
      ctx.fillStyle = part.fill;
    } else {
      const cx = ox + (b.x + b.w * CLAY.gradCX) * u;
      const cy = oy + (b.y + b.h * CLAY.gradCY) * u;
      const r = Math.max(b.w, b.h) * u * 0.95;
      const grad = ctx.createRadialGradient(cx, cy, Math.max(0.5, r * 0.05), cx, cy, Math.max(1, r));
      grad.addColorStop(0, shiftHex(part.fill, CLAY.hi));
      grad.addColorStop(0.55, part.fill);
      grad.addColorStop(1, shiftHex(part.fill, -CLAY.lo));
      ctx.fillStyle = grad;
    }
    traceShape(ctx, part, ox, oy, u);
    ctx.fill();
    ctx.restore();

    // Specular highlight, clipped to the mass. Built from a transparent
    // radial gradient rather than a blur filter, since canvas filter
    // support is patchy on older mobile browsers.
    const round = part.type === "circle" || part.type === "ellipse";
    if (round && !isOutlineColor && Math.max(b.w, b.h) >= CLAY.minGlossSize) {
      ctx.save();
      traceShape(ctx, part, ox, oy, u);
      ctx.clip();
      const gx = ox + (b.x + b.w * 0.30) * u;
      const gy = oy + (b.y + b.h * 0.22) * u;
      const gr = Math.max(b.w * 0.26, b.h * 0.2) * u;
      const gl = ctx.createRadialGradient(gx, gy, 0, gx, gy, Math.max(1, gr));
      gl.addColorStop(0, `rgba(255,255,255,${CLAY.gloss})`);
      gl.addColorStop(0.6, `rgba(255,255,255,${CLAY.gloss * 0.35})`);
      gl.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = gl;
      ctx.fillRect(gx - gr * 1.6, gy - gr * 1.6, gr * 3.2, gr * 3.2);
      ctx.restore();
    }
  }
}

/* ==================== BATTLE STAGE (canvas, no engine) ====================
   Replaces a Phaser scene that pulled in a 1.2MB engine from a CDN for
   about forty API calls -- a dozen tweens, some text objects, a couple of
   canvas textures. Everything drawn here was already plain canvas 2D work;
   Phaser was just holding the canvas and moving things around.

   Dropping it means the game works with no internet after the first
   download, loads instantly, and stays a single self-contained file with
   nothing that can go down or get blocked on a school network.
   ========================================================================= */

/* ---------- tiny tween engine ---------- */
const EASE = {
  linear: (t) => t,
  quadOut: (t) => 1 - (1 - t) * (1 - t),
  cubicOut: (t) => 1 - Math.pow(1 - t, 3),
  cubicIn: (t) => t * t * t,
  sineInOut: (t) => -(Math.cos(Math.PI * t) - 1) / 2,
};
const tweens = [];
function tweenTo(target, props, opts = {}) {
  const t = {
    target, from: {}, to: {},
    duration: opts.duration || 300, delay: opts.delay || 0,
    ease: EASE[opts.ease] || EASE.linear,
    yoyo: !!opts.yoyo, repeat: opts.repeat || 0,
    onComplete: opts.onComplete || null,
    elapsed: 0, reversing: false,
  };
  for (const k of Object.keys(props)) {
    const v = props[k];
    if (v && typeof v === "object" && "from" in v) { t.from[k] = v.from; t.to[k] = v.to; target[k] = v.from; }
    else { t.from[k] = target[k] || 0; t.to[k] = v; }
  }
  tweens.push(t);
  return t;
}
function killTweensOf(target) {
  for (let i = tweens.length - 1; i >= 0; i--) if (tweens[i].target === target) tweens.splice(i, 1);
}
function updateTweens(dt) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const t = tweens[i];
    if (t.delay > 0) { t.delay -= dt; continue; }
    t.elapsed += dt;
    const p = Math.min(1, t.elapsed / t.duration);
    const e = t.ease(p);
    const k = t.reversing ? 1 - e : e;
    for (const key of Object.keys(t.to)) t.target[key] = t.from[key] + (t.to[key] - t.from[key]) * k;
    if (p >= 1) {
      if (t.yoyo && !t.reversing) { t.reversing = true; t.elapsed = 0; }
      else if (t.repeat > 0) { t.repeat -= 1; t.reversing = false; t.elapsed = 0; }
      else { tweens.splice(i, 1); if (t.onComplete) t.onComplete(); }
    }
  }
}

/* ---------- drawable sprites ---------- */
function makeSprite(kind, opts = {}) {
  return Object.assign({ kind, x: 0, y: 0, alpha: 1, scale: 1, rotation: 0, visible: true }, opts);
}
function drawSprite(ctx, s) {
  if (!s.visible || s.alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha *= s.alpha;
  ctx.translate(s.x, s.y);
  if (s.rotation) ctx.rotate(s.rotation);
  if (s.scale !== 1) ctx.scale(s.scale, s.scale);
  if (s.kind === "image" && s.canvas) {
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(s.canvas, -s.canvas.width * (s.originX ?? 0), -s.canvas.height * (s.originY ?? 0));
  } else if (s.kind === "text" && s.text) {
    ctx.font = `${s.fontWeight || 400} ${s.fontSize}px ${s.fontFamily || "'Pixelify Sans', monospace"}`;
    ctx.textAlign = "center";
    ctx.textBaseline = s.baseline || "middle";
    if (s.glow) { ctx.shadowColor = s.glow; ctx.shadowBlur = s.glowBlur || 12; }
    if (s.stroke) {
      ctx.lineWidth = s.strokeWidth || 3; ctx.strokeStyle = s.stroke; ctx.lineJoin = "round";
      ctx.strokeText(s.text, 0, 0);
    }
    ctx.fillStyle = s.color || "#ffffff";
    ctx.fillText(s.text, 0, 0);
  }
  ctx.restore();
}
function drawGeomCtx(ctx, geom, dy, stroke) {
  ctx.beginPath();
  if (geom.type === "rect") ctx.rect(geom.x, geom.y + dy, geom.w, geom.h);
  else if (geom.type === "circle") ctx.arc(geom.cx, geom.cy + dy, Math.max(0.1, geom.r), 0, Math.PI * 2);
  else if (geom.type === "ellipse") ctx.ellipse(geom.cx, geom.cy + dy, Math.max(0.1, geom.w / 2), Math.max(0.1, geom.h / 2), 0, 0, Math.PI * 2);
  else {
    const pts = geom.basePts;
    for (let i = 0; i < pts.length; i++) { if (i) ctx.lineTo(pts[i].x, pts[i].y + dy); else ctx.moveTo(pts[i].x, pts[i].y + dy); }
    ctx.closePath();
  }
  if (stroke) ctx.stroke(); else ctx.fill();
}
function makeTextureCanvas(w, h) {
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h));
  return c;
}

/* ---------- pixel helpers shared by the stage, title and icons ---------- */

/* Builds a sprite in the PIX_* row format from drawing calls instead of
   hand-typed strings. Used for the few small props (chest, swords) that
   are simple enough to describe as rectangles. */
function gridSprite(w, h, paint) {
  const g = Array.from({ length: h }, () => Array(w).fill(".."));
  const set = (x, y, code) => { if (x >= 0 && y >= 0 && x < w && y < h) g[y][x] = code; };
  const rect = (x, y, rw, rh, code) => { for (let j = 0; j < rh; j++) for (let i = 0; i < rw; i++) set(x + i, y + j, code); };
  paint(set, rect);
  return g.map((r) => r.join(""));
}

const CHEST_PIX_PALETTE = { body: "#b0703a", dark: "#6e3f1c", horn: "#f2c440", belly: "#fff1a8", wing: "#ffffff" };
function chestRows(open) {
  return gridSprite(28, 24, (set, rect) => {
    // body
    rect(3, 12, 22, 10, "b1"); rect(3, 20, 22, 2, "b2"); rect(3, 16, 22, 1, "d1");
    rect(6, 12, 2, 10, "h1"); rect(20, 12, 2, 10, "h1");
    rect(3, 21, 22, 1, "d2");
    if (!open) {
      rect(5, 5, 18, 1, "b0"); rect(4, 6, 20, 1, "b0"); rect(3, 7, 22, 4, "b1"); rect(3, 10, 22, 1, "b2");
      rect(6, 5, 2, 6, "h0"); rect(20, 5, 2, 6, "h0");
      rect(3, 11, 22, 1, "h2");
      rect(12, 9, 4, 5, "h0"); set(13, 11, "e1"); set(14, 11, "e1"); set(13, 12, "e1");
    } else {
      // lid flipped back, glowing loot inside
      rect(4, 2, 20, 1, "d0"); rect(3, 3, 22, 5, "d1"); rect(6, 2, 2, 6, "h1"); rect(20, 2, 2, 6, "h1");
      rect(3, 8, 22, 4, "l1"); rect(5, 9, 18, 2, "l0");
      [[7, 9], [10, 8], [13, 9], [16, 8], [19, 9], [12, 10], [15, 10], [9, 10], [18, 10]].forEach(([x, y]) => set(x, y, "h0"));
      rect(3, 11, 22, 1, "h2");
    }
  });
}
const PIX_CHEST_IDLE = { w: 28, h: 24, frames: [chestRows(false)] };
const PIX_CHEST_OPEN = { w: 28, h: 24, frames: [chestRows(true)] };

/* Sword icons for the shop's power upgrades, recoloured per SWORD_TIERS. */
const PIX_SWORD = { w: 16, h: 16, frames: [gridSprite(16, 16, (set) => {
  for (let i = 0; i < 10; i++) { set(5 + i, 10 - i, "B0"); set(5 + i, 11 - i, "B1"); set(6 + i, 11 - i, "B2"); }
  set(15, 0, "B0");
  [[2, 10], [3, 11], [4, 12], [5, 13], [6, 14], [3, 9], [7, 13]].forEach(([x, y]) => set(x, y, "g1"));
  [[4, 11], [3, 12], [2, 13]].forEach(([x, y]) => set(x, y, "H1"));
  set(1, 14, "g0"); set(2, 14, "g1"); set(1, 13, "g2");
})] };

/* Paints frame 0 of a pixel sprite into a canvas at the largest integer
   scale that fits, centred. Used for every small UI portrait: shop
   mounts, swords, multi-enemy minis, the boss intro, hero cards. */
function paintSpriteInto(cv, art, palette, frame = 0) {
  const ctx = cv.getContext("2d");
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, cv.width, cv.height);
  const scale = Math.max(1, Math.floor(Math.min((cv.width - 2) / art.w, (cv.height - 2) / art.h)));
  const ox = Math.round((cv.width - art.w * scale) / 2);
  const oy = Math.round((cv.height - art.h * scale) / 2);
  paintPixelFrame(ctx, art, frame % art.frames.length, palette, scale, ox, oy);
}

/* Resolves a data-pix="kind:key" attribute to sprite art + palette. */
function pixIconSpec(spec) {
  const [kind, ...rest] = spec.split(":");
  const key = rest.join(":");
  if (kind === "enemy" || kind === "boss") {
    const a = PIX_ENEMY_ART[key];
    return a ? { art: a.art, palette: a.palette } : null;
  }
  if (kind === "mount") return { art: PIX_DRAGON, palette: ELEMENT_PALETTES[key] || ELEMENT_PALETTES.starter };
  if (kind === "sword") {
    const t = SWORD_TIERS[Math.max(0, Math.min(SWORD_TIERS.length - 1, Number(key) || 0))];
    return { art: PIX_SWORD, palette: { bladeColor: t.blade, hiltColor: t.hilt, gold: "#e0a832" } };
  }
  if (kind === "chest") return { art: PIX_CHEST_IDLE, palette: CHEST_PIX_PALETTE };
  return null;
}

function paintPixIcons() {
  document.querySelectorAll("canvas[data-pix]").forEach((cv) => {
    const spec = pixIconSpec(cv.dataset.pix);
    if (spec) paintSpriteInto(cv, spec.art, spec.palette);
  });
}

/* 4x4 Bayer matrix for ordered dithering -- the "checkerboard blend"
   that 16-bit games used for smooth skies with a tiny palette. */
const BAYER4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map((v) => (v + 0.5) / 16);

function mulberry(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* Dithered vertical gradient through a list of colour stops. */
function paintDitherSky(ctx, w, h, stops) {
  const img = ctx.createImageData(w, h);
  const rgb = stops.map(hexToRgb);
  const bands = rgb.length - 1;
  for (let y = 0; y < h; y++) {
    const t = (y / Math.max(1, h - 1)) * bands;
    const i = Math.min(bands - 1, Math.floor(t));
    // quantize each band to 4 steps, dither between neighbouring steps
    const f = (t - i) * 4;
    const step = Math.floor(f), frac = f - step;
    for (let x = 0; x < w; x++) {
      const s = Math.min(4, step + (frac > BAYER4[(y & 3) * 4 + (x & 3)] ? 1 : 0)) / 4;
      const a = rgb[i], b = rgb[i + 1];
      const o = (y * w + x) * 4;
      img.data[o] = a[0] + (b[0] - a[0]) * s;
      img.data[o + 1] = a[1] + (b[1] - a[1]) * s;
      img.data[o + 2] = a[2] + (b[2] - a[2]) * s;
      img.data[o + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
}

/* Filled ridge line (mountains / hills) from a 1-D random walk. */
function paintRidge(ctx, w, h, rnd, baseY, amp, rough, color, capColor) {
  let y = baseY + (rnd() - 0.5) * amp;
  let vy = 0;
  const tops = [];
  for (let x = 0; x < w; x++) {
    vy += (rnd() - 0.5) * rough;
    vy *= 0.9;
    y += vy;
    y += (baseY - y) * 0.03;
    y = Math.max(baseY - amp, Math.min(baseY + amp, y));
    tops.push(Math.round(y));
  }
  ctx.fillStyle = color;
  for (let x = 0; x < w; x++) ctx.fillRect(x, tops[x], 1, h - tops[x]);
  if (capColor) {
    ctx.fillStyle = capColor;
    for (let x = 0; x < w; x++) if (tops[x] < baseY - amp * 0.45) ctx.fillRect(x, tops[x], 1, 2 + (x % 3 === 0 ? 1 : 0));
  }
  return tops;
}

function paintPine(ctx, x, groundY, hgt, col, hi) {
  ctx.fillStyle = col;
  ctx.fillRect(x, groundY - 2, 1, 3);
  for (let j = 0; j < hgt; j++) {
    const half = Math.floor((j % Math.max(3, Math.floor(hgt / 3))) * 0.6 + j * 0.28);
    ctx.fillRect(x - half, groundY - hgt + j, half * 2 + 1, 1);
  }
  if (hi) { ctx.fillStyle = hi; for (let j = 2; j < hgt; j += 3) ctx.fillRect(x - Math.floor(j * 0.25), groundY - hgt + j, 1, 1); }
}

/* Five battle biomes. Index order matches the old CSS BACKGROUND_STYLES
   (lava, lagoon, forest, night, ice) so arenaBiomeForWave keeps the same
   "two waves per backdrop" rhythm. */
const BIOMES = [
  { id: "volcano", sky: ["#1a0508", "#4a0f0c", "#a8321a", "#ff7a2c"], far: "#2a0c0c", mid: "#3d1410", ground: ["#6a2a1a", "#4a1c14", "#2a0e0a"], rim: "#ff9a4a", fx: "embers", glow: "#ff5a1a" },
  { id: "lagoon", sky: ["#0d2a4a", "#1f5f8a", "#5ab4d0", "#ffd9a0"], far: "#2a5a78", mid: "#1d4a5e", ground: ["#e8c98a", "#c9a868", "#8a6e40"], rim: "#fff1c4", fx: "sparkle", glow: "#9fe8ff" },
  { id: "forest", sky: ["#0e1f2a", "#1e3f3a", "#3f6a4a", "#9ac27a"], far: "#20403a", mid: "#16302a", ground: ["#4f8a3a", "#34602a", "#1e3a1a"], rim: "#a8e070", fx: "fireflies", glow: "#d8ff8a" },
  { id: "night", sky: ["#05040f", "#140c2e", "#2e1a52", "#5a2e6e"], far: "#1c1236", mid: "#120a24", ground: ["#4a4058", "#302840", "#1a1424"], rim: "#9a8ac0", fx: "stars", glow: "#c9a8ff" },
  { id: "ice", sky: ["#0a1a2e", "#1a3a5e", "#4a7eaa", "#cfe8f5"], far: "#6a8aaa", mid: "#3a5a7a", ground: ["#eaf6ff", "#bcd8ec", "#7a9cbc"], rim: "#ffffff", fx: "snow", glow: "#bff4ff" },
];

function arenaBiomeForWave(wave) {
  const pairIndex = Math.floor((Math.max(1, wave) - 1) / 2);
  return Math.floor(seededRandom01(pairIndex) * BIOMES.length);
}

/* Paints one biome's static layers at low resolution (1 art pixel each).
   The stage scales it up with nearest-neighbour, so this runs once per
   biome change / resize rather than per frame. Returns the canvas plus
   anything the animated layer needs (star positions, ground line). */
function paintBiome(biomeIdx, bw, bh, groundY) {
  const B = BIOMES[biomeIdx];
  const c = makeTextureCanvas(bw, bh);
  const ctx = c.getContext("2d");
  const rnd = mulberry(1000 + biomeIdx * 77);
  paintDitherSky(ctx, bw, groundY + 2, B.sky);
  const extra = { stars: [] };

  if (B.id === "night" || B.id === "ice" || B.id === "forest") {
    const n = B.id === "night" ? 60 : 24;
    for (let i = 0; i < n; i++) extra.stars.push({ x: Math.floor(rnd() * bw), y: Math.floor(rnd() * groundY * 0.55), p: rnd() * 6.28, big: rnd() < 0.15 });
  }
  if (B.id === "night") {
    // moon with crater dither
    const mx = Math.floor(bw * 0.78), my = Math.floor(bh * 0.2), r = Math.max(6, Math.floor(bh * 0.1));
    for (let y = -r - 3; y <= r + 3; y++) for (let x = -r - 3; x <= r + 3; x++) {
      const d = Math.hypot(x, y);
      if (d <= r) { ctx.fillStyle = (x + y) % 5 === 0 && d < r - 2 ? "#d8d0b0" : (x < -r * 0.3 && y < 0 ? "#fffbe8" : "#f0e8c8"); ctx.fillRect(mx + x, my + y, 1, 1); }
      else if (d <= r + 3 && ((x + y) & 1)) { ctx.fillStyle = "#6a5a9a"; ctx.fillRect(mx + x, my + y, 1, 1); }
    }
  }
  if (B.id === "lagoon") {
    const sx = Math.floor(bw * 0.25), sy = Math.floor(groundY * 0.62), r = Math.max(7, Math.floor(bh * 0.1));
    for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) if (x * x + y * y <= r * r) { ctx.fillStyle = y < -r / 3 ? "#fff6c8" : "#ffd68a"; ctx.fillRect(sx + x, sy + y, 1, 1); }
  }
  if (B.id === "volcano") {
    const r = Math.max(8, Math.floor(bh * 0.12)), sx = Math.floor(bw * 0.2), sy = Math.floor(groundY * 0.3);
    for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) if (x * x + y * y <= r * r && ((x ^ y) & 1 || x * x + y * y < r * r * 0.6)) { ctx.fillStyle = "#ff5a2a"; ctx.fillRect(sx + x, sy + y, 1, 1); }
  }
  if (B.id === "ice") {
    // aurora ribbons
    for (let band = 0; band < 3; band++) {
      const col = ["#5affc8", "#5ad8ff", "#a88aff"][band];
      for (let x = 0; x < bw; x++) {
        const y = Math.floor(groundY * (0.18 + band * 0.08) + Math.sin(x / (9 + band * 3) + band) * 4);
        ctx.globalAlpha = 0.35; ctx.fillStyle = col; ctx.fillRect(x, y, 1, 3 + ((x >> 2) % 3));
      }
    }
    ctx.globalAlpha = 1;
  }

  // far range
  const farY = Math.floor(groundY * 0.55);
  paintRidge(ctx, bw, bh, rnd, farY, groundY * 0.2, 1.6, B.far, B.id === "ice" || B.id === "night" ? shiftHex(B.far, 0.45) : null);
  if (B.id === "volcano") {
    // volcano cone with lava crown and a lava river
    const vx = Math.floor(bw * 0.62), top = Math.floor(groundY * 0.28), base = groundY;
    for (let y = top; y < base; y++) {
      const half = Math.floor(5 + (y - top) * 0.9);
      ctx.fillStyle = "#3a1210"; ctx.fillRect(vx - half, y, half * 2, 1);
      ctx.fillStyle = "#4e1a14"; ctx.fillRect(vx - half, y, Math.floor(half * 0.6), 1);
    }
    ctx.fillStyle = "#ffb04a"; ctx.fillRect(vx - 5, top, 10, 1);
    ctx.fillStyle = "#ff5a1a"; ctx.fillRect(vx - 4, top + 1, 8, 1);
    let lx = vx;
    for (let y = top + 2; y < base; y++) { lx += Math.round((rnd() - 0.45) * 1.6); ctx.fillStyle = y % 3 ? "#ff5a1a" : "#ffb04a"; ctx.fillRect(lx, y, 2, 1); }
  }

  // mid layer
  const midY = Math.floor(groundY * 0.82);
  const midTops = paintRidge(ctx, bw, bh, rnd, midY, groundY * 0.08, 1.2, B.mid, null);
  if (B.id === "forest" || B.id === "ice") {
    for (let x = 2; x < bw; x += 4 + Math.floor(rnd() * 5)) paintPine(ctx, x, midTops[x] + 3, 10 + Math.floor(rnd() * 12), shiftHex(B.mid, -0.25), B.id === "ice" ? "#e8f6ff" : shiftHex(B.mid, 0.25));
  }
  if (B.id === "night") {
    // castle silhouette with lit windows
    const cx = Math.floor(bw * 0.18), baseY = midTops[cx] + 2, col = "#0a0616";
    ctx.fillStyle = col;
    ctx.fillRect(cx - 10, baseY - 14, 20, 16);
    [[-12, 22], [10, 18], [-2, 28]].forEach(([dx, hh]) => {
      ctx.fillRect(cx + dx, baseY - hh, 5, hh);
      for (let i = 0; i < 5; i += 2) ctx.fillRect(cx + dx + i, baseY - hh - 2, 1, 2);
    });
    ctx.fillStyle = "#ffcf5a";
    [[-11, 16], [11, 12], [0, 22], [-5, 8], [5, 8]].forEach(([dx, dy]) => ctx.fillRect(cx + dx, baseY - dy, 1, 2));
  }
  if (B.id === "lagoon") {
    // sea band with light streaks, then palm silhouettes
    const seaY = Math.floor(groundY * 0.72);
    ctx.fillStyle = "#1f6f98"; ctx.fillRect(0, seaY, bw, groundY - seaY + 2);
    ctx.fillStyle = "#2f8fb8"; for (let y = seaY + 2; y < groundY; y += 3) ctx.fillRect(0, y, bw, 1);
    [Math.floor(bw * 0.08), Math.floor(bw * 0.92)].forEach((px, k) => {
      const lean = k ? -1 : 1;
      ctx.fillStyle = "#3a2a1a";
      for (let j = 0; j < 22; j++) ctx.fillRect(px + Math.round(Math.sin(j / 9) * 3 * lean), groundY - j, 2, 1);
      const tx = px + Math.round(Math.sin(21 / 9) * 3 * lean), ty = groundY - 22;
      ctx.fillStyle = "#1e5a2a";
      for (let a = 0; a < 6; a++) { const ang = -Math.PI + a * (Math.PI / 5); for (let r = 0; r < 9; r++) ctx.fillRect(tx + Math.round(Math.cos(ang) * r), ty + Math.round(Math.sin(ang) * r * 0.5 + r * r * 0.05), 2, 1); }
    });
  }
  if (B.id === "volcano") {
    for (let x = 0; x < bw; x += 7 + Math.floor(rnd() * 8)) {
      const hh = 4 + Math.floor(rnd() * 8);
      ctx.fillStyle = "#1e0806";
      for (let j = 0; j < hh; j++) ctx.fillRect(x - Math.floor((hh - j) / 3), midTops[Math.min(bw - 1, x)] - j + 2, 1 + Math.floor((hh - j) / 1.5), 1);
    }
  }

  // ground platform: rim highlight, top face, textured body
  const [gTop, gMid, gDark] = B.ground;
  ctx.fillStyle = gMid; ctx.fillRect(0, groundY, bw, bh - groundY);
  ctx.fillStyle = gTop; ctx.fillRect(0, groundY, bw, 2);
  ctx.fillStyle = B.rim; for (let x = 0; x < bw; x += 1) if ((x * 7) % 11 < 6) ctx.fillRect(x, groundY, 1, 1);
  for (let y = groundY + 3; y < bh; y++) for (let x = 0; x < bw; x++) {
    const v = rnd();
    const t = (y - groundY) / Math.max(1, bh - groundY);
    if (v < 0.08 + t * 0.35 && BAYER4[(y & 3) * 4 + (x & 3)] < t + 0.2) { ctx.fillStyle = gDark; ctx.fillRect(x, y, 1, 1); }
    else if (v > 0.985) { ctx.fillStyle = gTop; ctx.fillRect(x, y, 1, 1); }
  }
  if (B.id === "forest" || B.id === "lagoon") {
    ctx.fillStyle = B.id === "forest" ? "#7ac04a" : "#f5deaa";
    for (let x = 1; x < bw; x += 3 + Math.floor(rnd() * 4)) { ctx.fillRect(x, groundY - 1, 1, 1); if (rnd() < 0.5) ctx.fillRect(x + 1, groundY - 2, 1, 2); }
  }
  if (B.id === "volcano") {
    ctx.fillStyle = "#ff7a2c";
    for (let i = 0; i < 6; i++) { let x = Math.floor(rnd() * bw), y = groundY + 3 + Math.floor(rnd() * (bh - groundY - 4)); for (let k = 0; k < 6; k++) { ctx.fillRect(x, y, 1, 1); x += 1; y += rnd() < 0.5 ? 0 : (rnd() < 0.5 ? -1 : 1); } }
  }
  extra.groundY = groundY;
  return { canvas: c, extra };
}

/* Dark corners so the combatants sit in a pool of light. Baked once. */
function makeVignette(w, h, rgb = "8,4,16", strength = 0.6) {
  const c = makeTextureCanvas(w, h);
  const ctx = c.getContext("2d");
  const g = ctx.createRadialGradient(w / 2, h * 0.62, Math.min(w, h) * 0.25, w / 2, h * 0.55, Math.max(w, h) * 0.75);
  g.addColorStop(0, `rgba(${rgb},0)`);
  g.addColorStop(1, `rgba(${rgb},${strength})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  return c;
}

const AURA_FX = {
  aura: { colors: ["#ffd08a", "#ff7a2c", "#ff3b1a"], vy: -0.05, glow: "#ff7a2c" },
  sparkle: { colors: ["#ffffff", "#fff3a8", "#ffd76b"], vy: -0.015, glow: "#fff3a8", twinkle: true },
  frostaura: { colors: ["#ffffff", "#bff4ff", "#7fd8ff"], vy: 0.02, glow: "#7fd8ff" },
  rainbowaura: { colors: null, vy: -0.03, glow: "#ff8aff" },
};

/* ---------- the stage ---------- */
const BattleStage = {
  ready: false,

  init(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.dragonStrips = []; this.enemyStrips = [];
    this.dragonFlash = []; this.enemyFlash = [];
    this.popups = []; this.effects = []; this.parts = []; this.fx = [];
    this._enemySprite = null; this._enemySpriteKey = null;
    this._palette = ELEMENT_PALETTES.starter; this._mountPalette = null; this._hero = "boy";
    this._enemyKind = "text"; this._enemyName = null; this._chestMode = "idle";
    this._chestEnemyRef = null; this._chestWasOpen = false;
    this._trackRef = null; this._trackHp = 0; this._deadRef = null;
    this._biome = -1; this._bg = null; this._bgPrev = null; this._bgFadeStart = 0;
    this._aura = null; this._enemyGlow = "#ffffff"; this._isBoss = false; this._poisoned = false; this._charging = false;
    this.playerLayer = { x: 0, y: 0, scale: 1, alpha: 1 };
    this.enemyLayer = { x: 0, y: 0, scale: 1, alpha: 1 };
    this.enemyText = makeSprite("text", { text: "", fontSize: 40, color: "#ffffff", originY: 1, baseline: "bottom" });
    this.playerAccessory = makeSprite("text", { text: "", fontSize: 20 });
    this.playerPet = makeSprite("text", { text: "", fontSize: 20 });
    this.shakeUntil = 0; this.shakeMag = 0; this.flashUntil = 0; this.whiteUntil = 0;
    this.enemyFlashUntil = 0; this.playerFlashUntil = 0;
    this._last = 0; this._spawnAcc = 0;
    this.ready = true;
  },

  layout(w, h) {
    this.W = w; this.H = h;
    this.unit = Math.max(1, (h * 0.6) / DRAGON_ART_GRID);
    this.ap = Math.max(2, Math.round(h / 84));          // CSS px per background art pixel
    this.bw = Math.ceil(w / this.ap); this.bh = Math.ceil(h / this.ap);
    this.groundArtY = Math.floor(this.bh * 0.8);
    this.groundY = this.groundArtY * this.ap;
    this.playerBase = { x: w * 0.3, y: h * 0.93 };
    this.enemyBase = { x: w * 0.74, y: h * 0.92 };
    this.dragonOriginX = -(DRAGON_ART_GRID * this.unit) / 2;
    this.dragonOriginY = -(DRAGON_ART_GRID * this.unit) + this.unit * 5;
    this.playerLayer.x = this.playerBase.x; this.playerLayer.y = this.playerBase.y;
    this.enemyLayer.x = this.enemyBase.x; this.enemyLayer.y = this.enemyBase.y;
    const enemyFont = Math.round(Math.min(w * 0.32, h * 0.62));
    this.enemyText.fontSize = enemyFont;
    this.playerAccessory.fontSize = Math.round(this.unit * 4);
    this.playerAccessory.x = DRAGON_ART_GRID * this.unit * 0.28;
    this.playerAccessory.y = this.dragonOriginY - this.unit;
    this.playerPet.fontSize = Math.round(this.unit * 4);
    this.playerPet.x = this.dragonOriginX - this.unit;
    this.playerPet.y = -this.unit;
    this.vignette = makeVignette(w, h);
    this.bossVignette = makeVignette(w, h, "255,30,10", 0.85);
    this._cachedPaletteKey = null; this._enemySpriteKey = null; this._biome = -1; this._bgPrev = null;
    this.rebuildCaches();
  },

  setBiome(idx) {
    if (idx === this._biome || !this.bw) return;
    const first = this._biome === -1;
    this._bgPrev = first ? null : this._bg;
    this._biome = idx;
    this._bg = paintBiome(idx, this.bw, this.bh, this.groundArtY);
    this._bgFadeStart = performance.now();
    this.parts = this.parts.filter((p) => !p.ambient);
  },

  rebuildCaches() {
    if (this.unit === undefined) return;
    const paletteKey = `${this._hero || "boy"}|` + (this._mountPalette
      ? `${this._mountPalette.body}|${this._mountPalette.dark}|${this._mountPalette.belly}|${this._mountPalette.wing}|${this._mountPalette.horn}`
      : "onfoot") + `|${this._swordTier || 0}`;
    if (paletteKey !== this._cachedPaletteKey) { this._cachedPaletteKey = paletteKey; this.bakePlayer(); }
    let wantKey = null, wantSprite = null;
    if (this._enemyKind === "chest") {
      wantKey = "__chest_" + this._chestMode;
      wantSprite = { art: this._chestMode === "open" ? PIX_CHEST_OPEN : PIX_CHEST_IDLE, palette: CHEST_PIX_PALETTE, sizePct: 0.62 };
    } else if (this._enemyName && PIX_ENEMY_ART[this._enemyName]) {
      wantKey = this._enemyName; wantSprite = PIX_ENEMY_ART[this._enemyName];
    }
    if (wantKey !== this._enemySpriteKey) { this._enemySpriteKey = wantKey; this._enemySprite = wantSprite; this.bakeEnemy(); }
  },

  bakePlayer() {
    const u = this.unit;
    if (!u || !isFinite(u)) return;
    this.dragonStrips = []; this.dragonFlash = [];
    const mounted = !!this._mountPalette;
    const rider = heroSprite(this._hero, mounted);
    const heroPal = heroPaletteForTier(this._swordTier || 0);
    const targetH = DRAGON_ART_GRID * u;
    const scale = mounted ? pixScaleFor(PIX_DRAGON, targetH) : pixScaleFor(rider, targetH * 0.78);
    this._pixScale = scale;
    const overhangY = mounted ? Math.max(0, -SADDLE_Y) : 0;
    const texW = ((mounted ? PIX_DRAGON.w : rider.w) + 2) * scale;
    const texH = ((mounted ? PIX_DRAGON.h : rider.h) + overhangY + 2) * scale;
    if (texW <= 0 || texW > 4096 || texH > 4096) return;
    const frames = mounted ? PIX_DRAGON.frames.length : rider.frames.length;
    for (let f = 0; f < frames; f++) {
      const c = makeTextureCanvas(texW, texH);
      const cx = c.getContext("2d");
      cx.imageSmoothingEnabled = false;
      if (mounted) {
        paintPixelFrame(cx, PIX_DRAGON, f, this._mountPalette, scale, scale, (overhangY + 1) * scale);
        paintPixelFrame(cx, rider, f % rider.frames.length, heroPal, scale, (SADDLE_X + 1) * scale, (SADDLE_Y + overhangY + 1) * scale);
      } else {
        paintPixelFrame(cx, rider, f, heroPal, scale, scale, scale);
      }
      this.dragonStrips.push(makeSprite("image", { canvas: c, originX: 0, originY: 0 }));
      this.dragonFlash.push(makeSprite("image", { canvas: makeFlashCanvas(c), originX: 0, originY: 0 }));
    }
    this._stripBaseX = Math.round(this.dragonOriginX + (targetH - texW) / 2);
    this._stripBaseY = Math.round(this.dragonOriginY + DRAGON_ART_GRID * u - texH + scale);
  },

  /* sizePct lets minions (e.g. Ooze Spawn) render smaller than a full-size
     enemy, centred on the same full-size footprint so they don't float. */
  bakeEnemy() {
    const u = this.unit;
    if (!u || !isFinite(u)) return;
    this.enemyStrips = []; this.enemyFlash = [];
    const sprite = this._enemySprite;
    if (!sprite) return;
    const fullH = DRAGON_ART_GRID * u;
    const targetH = fullH * (sprite.sizePct || 1);
    const scale = pixScaleFor(sprite.art, targetH);
    const texW = (sprite.art.w + 2) * scale, texH = (sprite.art.h + 2) * scale;
    if (texW <= 0 || texW > 4096) return;
    for (let f = 0; f < sprite.art.frames.length; f++) {
      const c = makeTextureCanvas(texW, texH);
      const cx = c.getContext("2d");
      cx.imageSmoothingEnabled = false;
      paintPixelFrame(cx, sprite.art, f, sprite.palette, scale, scale, scale);
      this.enemyStrips.push(makeSprite("image", { canvas: c, originX: 0, originY: 0 }));
      this.enemyFlash.push(makeSprite("image", { canvas: makeFlashCanvas(c), originX: 0, originY: 0 }));
    }
    this._enemyPixScale = scale;
    this._enemyBaseX = Math.round(this.dragonOriginX + (fullH - texW) / 2);
    this._enemyBaseY = Math.round(this.dragonOriginY + DRAGON_ART_GRID * u - texH + scale);
  },

  /* ---------- particles ---------- */
  spawn(p) {
    if (this.parts.length > 420) return;
    this.parts.push(Object.assign({ vx: 0, vy: 0, g: 0, life: 600, age: 0, size: this.ap, color: "#fff", drag: 1 }, p));
  },
  burst(x, y, colors, count, speed, opts = {}) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const v = speed * (0.35 + Math.random() * 0.65);
      this.spawn(Object.assign({
        x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - (opts.up || 0),
        g: opts.g ?? 0.0009, life: (opts.life || 520) * (0.6 + Math.random() * 0.6),
        color: colors[(Math.random() * colors.length) | 0], size: this.ap * (Math.random() < 0.3 ? 2 : 1), drag: 0.985,
      }, opts.extra || {}));
    }
  },

  updateParticles(dt) {
    for (let i = this.parts.length - 1; i >= 0; i--) {
      const p = this.parts[i];
      p.age += dt;
      if (p.age >= p.life) { this.parts.splice(i, 1); continue; }
      p.vy += p.g * dt;
      p.vx *= Math.pow(p.drag, dt / 16); p.vy *= Math.pow(p.drag, dt / 16);
      if (p.wobble) p.vx += Math.sin((p.age + p.seed) / 260) * p.wobble;
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
  },

  drawParticles(ctx, now, front) {
    const ap = this.ap;
    for (const p of this.parts) {
      if (!!p.front !== front) continue;
      const t = p.age / p.life;
      let a = p.fadeIn ? Math.min(1, p.age / 250) * (1 - t) : (t > 0.6 ? 1 - (t - 0.6) / 0.4 : 1);
      if (p.twinkle) a *= 0.5 + 0.5 * Math.sin(now / 90 + p.seed);
      if (a <= 0) continue;
      ctx.globalAlpha = a;
      ctx.fillStyle = p.hue !== undefined ? `hsl(${(p.hue + now / 6) % 360},95%,65%)` : p.color;
      const s = p.size;
      const x = Math.round(p.x / ap) * ap, y = Math.round(p.y / ap) * ap;
      if (p.shape === "plus" && s >= ap) {
        ctx.fillRect(x - ap, y, ap * 3, ap); ctx.fillRect(x, y - ap, ap, ap * 3);
      } else if (p.shape === "ring") {
        ctx.fillRect(x - ap, y, ap, ap); ctx.fillRect(x + ap, y, ap, ap); ctx.fillRect(x, y - ap, ap, ap); ctx.fillRect(x, y + ap, ap, ap);
      } else {
        ctx.fillRect(x, y, s, s);
      }
    }
    ctx.globalAlpha = 1;
  },

  spawnAmbient(dt, now) {
    const B = BIOMES[this._biome];
    if (!B) return;
    this._spawnAcc += dt;
    const every = { embers: 90, sparkle: 260, fireflies: 320, stars: 900, snow: 70 }[B.fx] || 400;
    while (this._spawnAcc > every) {
      this._spawnAcc -= every;
      const W = this.W, H = this.H;
      if (B.fx === "embers") this.spawn({ ambient: true, x: Math.random() * W, y: H + 4, vx: (Math.random() - 0.5) * 0.02, vy: -0.03 - Math.random() * 0.05, life: 5000, color: Math.random() < 0.5 ? "#ffb04a" : "#ff5a1a", wobble: 0.0006, seed: Math.random() * 999, fadeIn: true });
      else if (B.fx === "snow") this.spawn({ ambient: true, x: Math.random() * W * 1.2, y: -4, vx: -0.012, vy: 0.025 + Math.random() * 0.03, life: 9000, color: "#ffffff", wobble: 0.0004, seed: Math.random() * 999, fadeIn: true, size: this.ap * (Math.random() < 0.25 ? 2 : 1) });
      else if (B.fx === "fireflies") this.spawn({ ambient: true, x: Math.random() * W, y: this.groundY * (0.4 + Math.random() * 0.55), vx: (Math.random() - 0.5) * 0.02, vy: (Math.random() - 0.5) * 0.01, life: 4200, color: "#e8ff8a", wobble: 0.0008, seed: Math.random() * 999, fadeIn: true, twinkle: true });
      else if (B.fx === "sparkle") this.spawn({ ambient: true, x: Math.random() * W, y: this.groundY * (0.74 + Math.random() * 0.2), life: 900, color: "#ffffff", twinkle: true, seed: Math.random() * 999, fadeIn: true, shape: Math.random() < 0.3 ? "plus" : null });
      else if (B.fx === "stars") this.spawn({ ambient: true, x: Math.random() * W, y: Math.random() * this.groundY * 0.4, vx: -0.35, vy: 0.12, life: 420, color: "#ffffff", drag: 1 });
    }
    // Effect-driven ambient: aura, poison bubbles, boss wind-up.
    if (this._aura && Math.random() < dt / 70) {
      const A = AURA_FX[this._aura];
      const x = this.playerLayer.x + (Math.random() - 0.5) * this.unit * 30;
      const y = this.playerLayer.y + this.dragonOriginY * (0.1 + Math.random() * 0.8);
      this.spawn({ x, y, vx: (Math.random() - 0.5) * 0.02, vy: A.vy - Math.random() * 0.02, life: 1100, color: A.colors ? A.colors[(Math.random() * A.colors.length) | 0] : "#fff", hue: A.colors ? undefined : Math.random() * 360, twinkle: !!A.twinkle, seed: Math.random() * 999, fadeIn: true, shape: A.twinkle && Math.random() < 0.4 ? "plus" : null });
    }
    if (this._poisoned && Math.random() < dt / 160) {
      this.spawn({ x: this.enemyLayer.x + (Math.random() - 0.5) * this.unit * 20, y: this.enemyLayer.y - this.unit * 6, vy: -0.04, life: 1300, color: Math.random() < 0.5 ? "#7cff5a" : "#b06aff", wobble: 0.0005, seed: Math.random() * 999, shape: "ring", front: true });
    }
    if (this._charging && Math.random() < dt / 30) {
      const a = Math.random() * Math.PI * 2, r = this.unit * 26;
      const cx = this.enemyLayer.x, cy = this.enemyLayer.y + this.dragonOriginY * 0.5;
      this.spawn({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r * 0.7, vx: -Math.cos(a) * 0.12, vy: -Math.sin(a) * 0.09, life: 520, color: Math.random() < 0.5 ? "#7de0c4" : "#c9a8ff", front: true });
    }
  },

  /* ---------- frame ---------- */
  draw(now) {
    const ctx = this.ctx;
    if (!ctx || !this.unit) return;
    const dt = Math.min(50, now - (this._last || now)); this._last = now;
    this.spawnAmbient(dt, now);
    this.updateParticles(dt);
    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0, 0, this.W, this.H);
    let sx = 0, sy = 0;
    if (now < this.shakeUntil) {
      const mag = this.unit * (this.shakeMag || 0.5);
      sx = Math.round((Math.random() - 0.5) * mag); sy = Math.round((Math.random() - 0.5) * mag);
    }
    ctx.save(); ctx.translate(sx, sy);
    this.drawBackground(ctx, now);
    this.drawParticles(ctx, now, false);
    this.drawPlayer(ctx, now);
    this.drawEnemy(ctx, now);
    for (const e of this.effects) drawSprite(ctx, e);
    this.drawFx(ctx, now);
    this.drawParticles(ctx, now, true);
    for (const p of this.popups) drawSprite(ctx, p);
    ctx.restore();
    if (this.vignette) ctx.drawImage(this.vignette, 0, 0, this.W, this.H);
    if (this._isBoss && this.bossVignette) {
      // pulsing red edges: "danger" without muddying the scene itself
      ctx.globalAlpha = 0.45 + 0.3 * Math.sin(now / 300);
      ctx.drawImage(this.bossVignette, 0, 0, this.W, this.H);
      ctx.globalAlpha = 1;
    }
    if (now < this.flashUntil) {
      const remain = (this.flashUntil - now) / 350;
      ctx.fillStyle = `rgba(255,40,40,${0.35 * remain})`;
      ctx.fillRect(0, 0, this.W, this.H);
    }
    if (now < this.whiteUntil) {
      ctx.fillStyle = `rgba(255,255,240,${0.55 * (this.whiteUntil - now) / 140})`;
      ctx.fillRect(0, 0, this.W, this.H);
    }
  },

  drawBackground(ctx, now) {
    if (!this._bg) return;
    const W = this.bw * this.ap, H = this.bh * this.ap;
    const fade = this._bgPrev ? Math.min(1, (now - this._bgFadeStart) / 700) : 1;
    if (this._bgPrev && fade < 1) ctx.drawImage(this._bgPrev.canvas, 0, 0, W, H);
    else this._bgPrev = null;
    ctx.globalAlpha = fade;
    ctx.drawImage(this._bg.canvas, 0, 0, W, H);
    ctx.globalAlpha = 1;
    const ap = this.ap;
    for (const st of this._bg.extra.stars) {
      const tw = Math.sin(now / 400 + st.p);
      if (tw < -0.3) continue;
      ctx.globalAlpha = 0.5 + tw * 0.5;
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(st.x * ap, st.y * ap, ap, ap);
      if (st.big && tw > 0.6) { ctx.fillRect((st.x - 1) * ap, st.y * ap, ap * 3, ap); ctx.fillRect(st.x * ap, (st.y - 1) * ap, ap, ap * 3); }
    }
    ctx.globalAlpha = 1;
    const B = BIOMES[this._biome];
    if (B && B.id === "volcano") {
      ctx.globalAlpha = 0.1 + 0.07 * Math.sin(now / 520);
      ctx.fillStyle = "#ff5a1a"; ctx.fillRect(0, this.groundY - ap * 8, this.W, ap * 8);
      ctx.globalAlpha = 1;
    }
    if (B && B.id === "lagoon") {
      ctx.fillStyle = "#c8f4ff";
      for (let i = 0; i < 7; i++) {
        const x = ((i * 53 + now / 40) % (this.W + 40)) - 20;
        const y = this.groundY - ap * (2 + (i % 4) * 2);
        ctx.globalAlpha = 0.6; ctx.fillRect(Math.round(x / ap) * ap, y, ap * 3, ap);
      }
      ctx.globalAlpha = 1;
    }
  },

  groundShadow(ctx, rx, ry, glow) {
    const cx = this.dragonOriginX + 24 * this.unit, cy = this.dragonOriginY + 46 * this.unit;
    if (glow) {
      ctx.globalAlpha = 0.22;
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.ellipse(cx, cy, rx * this.unit * 1.25, ry * this.unit * 1.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    // stepped (pixel) shadow instead of a soft blur
    const ap = this.ap;
    for (let i = 3; i >= 1; i--) {
      ctx.fillStyle = "rgba(0,0,0,0.16)";
      const w = Math.round(rx * this.unit * (i / 3) / ap) * ap, h = Math.max(ap, Math.round(ry * this.unit * (i / 3) / ap) * ap);
      ctx.fillRect(Math.round((cx - w) / ap) * ap, Math.round((cy - h / 2) / ap) * ap, w * 2, h);
    }
  },

  drawPlayer(ctx, now) {
    ctx.save();
    ctx.translate(this.playerLayer.x, this.playerLayer.y);
    if (this.playerLayer.scale !== 1) ctx.scale(this.playerLayer.scale, this.playerLayer.scale);
    const aura = this._aura ? AURA_FX[this._aura] : null;
    this.groundShadow(ctx, 15, 2.6, aura ? (aura.glow) : null);
    if (aura) {
      const cy = this.dragonOriginY * 0.45;
      const g = ctx.createRadialGradient(0, cy, 0, 0, cy, this.unit * 26);
      const col = this._aura === "rainbowaura" ? `hsl(${(now / 6) % 360},90%,65%)` : aura.glow;
      g.addColorStop(0, col); g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.globalAlpha = 0.28 + 0.08 * Math.sin(now / 400);
      ctx.fillStyle = g; ctx.fillRect(-this.unit * 28, cy - this.unit * 28, this.unit * 56, this.unit * 56);
      ctx.globalAlpha = 1;
    }
    const scale = this._pixScale || 1;
    const n = Math.max(1, this.dragonStrips.length);
    const frame = Math.floor(now / 380) % n;
    const bobPx = Math.sin(now / 500) > 0 ? 1 : 0;
    const flash = now < this.playerFlashUntil;
    const strips = flash ? this.dragonFlash : this.dragonStrips;
    const img = strips[frame];
    if (img) {
      img.visible = true; img.alpha = this.playerLayer.alpha;
      img.x = this._stripBaseX; img.y = this._stripBaseY - bobPx * scale;
      drawSprite(ctx, img);
    }
    drawSprite(ctx, this.playerAccessory);
    drawSprite(ctx, this.playerPet);
    ctx.restore();
  },

  drawEnemy(ctx, now) {
    const active = getActiveEnemy();
    if (active && this._deadRef === active && !active.isChest) return;
    ctx.save();
    ctx.translate(this.enemyLayer.x, this.enemyLayer.y);
    if (this.enemyLayer.scale !== 1) ctx.scale(this.enemyLayer.scale, this.enemyLayer.scale);
    ctx.globalAlpha = this.enemyLayer.alpha;
    this.groundShadow(ctx, 14, 2.4, this._enemyGlow);
    ctx.globalAlpha = this.enemyLayer.alpha;
    const hasPixel = this.enemyStrips.length > 0;
    if (hasPixel) {
      const scale = this._enemyPixScale || 1;
      const n = this.enemyStrips.length;
      const frame = Math.floor(now / 420) % n;
      const idle = this._enemyKind === "chest" && this._chestMode === "idle";
      const bobPx = idle ? (Math.sin(now / 260) > 0.6 ? 1 : 0) : (Math.sin(now / 560) > 0 ? 1 : 0);
      const flash = now < this.enemyFlashUntil;
      const img = (flash ? this.enemyFlash : this.enemyStrips)[frame];
      if (img) {
        img.visible = true; img.alpha = this.enemyLayer.alpha;
        img.x = this._enemyBaseX; img.y = this._enemyBaseY - bobPx * scale;
        drawSprite(ctx, img);
      }
      if (this._enemyKind === "chest" && this._chestMode === "open" && Math.random() < 0.3) {
        // loot glitter while the lid is open
        this.spawn({ x: this.enemyLayer.x + (Math.random() - 0.5) * this.unit * 12, y: this.enemyLayer.y + this.dragonOriginY * 0.35, vy: -0.05, life: 700, color: Math.random() < 0.5 ? "#fff3a8" : "#ffcf3a", twinkle: true, seed: Math.random() * 999, front: true });
      }
    } else if (this._enemyKind === "text") {
      drawSprite(ctx, this.enemyText);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  },

  /* Short-lived vector-free effects: slash arcs, impact stars, rings. All
     plotted on the background art grid so they share the sprites' pixel
     size instead of looking like smooth vector overlays. */
  drawFx(ctx, now) {
    const ap = this.ap;
    const plot = (x, y, s = 1) => ctx.fillRect(Math.round(x / ap) * ap, Math.round(y / ap) * ap, ap * s, ap * s);
    for (let i = this.fx.length - 1; i >= 0; i--) {
      const f = this.fx[i];
      const t = (now - f.t0) / f.dur;
      if (t < 0) continue;
      if (t >= 1) { this.fx.splice(i, 1); continue; }
      if (f.type === "slash") {
        const r = this.unit * 16;
        const a0 = -2.4, a1 = 0.5;
        const head = a0 + (a1 - a0) * Math.min(1, t * 1.8);
        const tail = a0 + (a1 - a0) * Math.max(0, t * 1.8 - 0.6);
        for (let a = tail; a <= head; a += 0.05) {
          const k = (a - tail) / Math.max(0.001, head - tail);
          const thick = Math.round(1 + k * 2);
          ctx.fillStyle = k > 0.75 ? "#ffffff" : (k > 0.35 ? "#fff3a8" : "#ffb04a");
          ctx.globalAlpha = 1 - t * 0.6;
          for (let j = 0; j < thick; j++) plot(f.x + Math.cos(a) * (r - j * ap), f.y + Math.sin(a) * (r - j * ap) * 0.8);
        }
        ctx.globalAlpha = 1;
      } else if (f.type === "star") {
        const len = this.unit * (4 + 10 * Math.sin(Math.min(1, t * 1.6) * Math.PI));
        ctx.fillStyle = t < 0.3 ? "#ffffff" : f.color;
        ctx.globalAlpha = 1 - t;
        for (let k = 0; k < 8; k++) {
          const a = k * Math.PI / 4 + 0.2;
          const L = k % 2 ? len * 0.55 : len;
          for (let d = 0; d < L; d += ap) plot(f.x + Math.cos(a) * d, f.y + Math.sin(a) * d, d < L * 0.35 ? 2 : 1);
        }
        ctx.globalAlpha = 1;
      } else if (f.type === "ring") {
        const r = this.unit * f.r * (0.2 + t);
        ctx.fillStyle = f.color; ctx.globalAlpha = 1 - t;
        const steps = Math.max(16, Math.round(r / ap * 6));
        for (let k = 0; k < steps; k++) { const a = (k / steps) * Math.PI * 2; plot(f.x + Math.cos(a) * r, f.y + Math.sin(a) * r * 0.75); }
        ctx.globalAlpha = 1;
      } else if (f.type === "fireball") {
        const e = EASE.cubicIn(Math.min(1, t));
        const x = f.x0 + (f.x1 - f.x0) * e;
        const y = f.y0 + (f.y1 - f.y0) * e - Math.sin(e * Math.PI) * this.unit * 8;
        const R = Math.round(this.unit * (2.4 + e * 1.8) / ap);
        const rings = [["#d8321f", R + 1], ["#ff7a1c", R], ["#ffcf3a", R - 1], ["#fff3b0", Math.max(1, R - 2)]];
        for (const [col, rr] of rings) {
          ctx.fillStyle = col;
          for (let yy = -rr; yy <= rr; yy++) for (let xx = -rr; xx <= rr; xx++) if (xx * xx + yy * yy <= rr * rr + (now / 60 % 2)) plot(x + xx * ap, y + yy * ap);
        }
        for (let k = 0; k < 3; k++) this.spawn({ x: x - ap * 2, y: y + (Math.random() - 0.5) * ap * 4, vx: -0.05 - Math.random() * 0.08, vy: (Math.random() - 0.5) * 0.04, life: 380, color: ["#ffcf3a", "#ff7a1c", "#d8321f", "#5a2a1a"][(Math.random() * 4) | 0], front: true });
      }
    }
  },

  /* ---------- state sync ---------- */
  syncFromState() {
    if (!this.ready) return;
    const levelInfo = levelFromXP(S.xp);
    const lvlStyle = LEVEL_STYLES[(levelInfo.level - 1) % LEVEL_STYLES.length];
    this._hue = lvlStyle.hue;
    const creature = COSMETICS.find((c) => c.id === S.equippedCreature);
    const aura = COSMETICS.find((c) => c.id === S.equippedAura);
    const accessory = COSMETICS.find((c) => c.id === S.equippedAccessory);
    const pet = COSMETICS.find((c) => c.id === S.equippedPet);
    this._hero = S.hero || "boy";
    this._swordTier = getSwordTier();
    this._mountPalette = creature && ELEMENT_PALETTES[creature.id]
      ? ELEMENT_PALETTES[creature.id] : (creature ? ELEMENT_PALETTES.starter : null);
    this._palette = creature && ELEMENT_PALETTES[creature.id]
      ? ELEMENT_PALETTES[creature.id] : hueRotatePalette(ELEMENT_PALETTES.starter, this._hue);
    this._aura = aura ? aura.id : null;
    this.playerAccessory.text = accessory ? accessory.emoji : "";
    this.playerPet.text = pet ? pet.emoji : "";
    this.setBiome(arenaBiomeForWave(S.wave));
    const activeEnemy = getActiveEnemy();
    this._isBoss = !!(activeEnemy && activeEnemy.isBoss && activeEnemy.hp > 0);
    this._poisoned = !!(activeEnemy && activeEnemy.poisonTurns > 0 && activeEnemy.hp > 0);
    this._charging = !!(activeEnemy && activeEnemy.charging > 0);
    if (activeEnemy) {
      this._enemyGlow = activeEnemy.glow || "#ffffff";
      if (activeEnemy.isChest) {
        if (this._chestEnemyRef !== activeEnemy) { this._chestEnemyRef = activeEnemy; this._chestWasOpen = false; }
        this._enemyKind = "chest"; this._enemyName = null;
        const nowOpen = activeEnemy.hp <= 0;
        if (nowOpen && !this._chestWasOpen) {
          this._chestWasOpen = true;
          killTweensOf(this.enemyLayer);
          tweenTo(this.enemyLayer, { scale: { from: 1, to: 1.2 } }, { duration: 220, yoyo: true, ease: "quadOut" });
          const cx = this.enemyBase.x, cy = this.enemyBase.y + this.dragonOriginY * 0.35;
          this.burst(cx, cy, ["#ffcf3a", "#fff3a8", "#f2c440", "#ffffff"], 46, 0.28, { up: 0.22, g: 0.0011, life: 1100, extra: { front: true } });
          this.fx.push({ type: "ring", x: cx, y: cy, r: 18, color: "#fff3a8", t0: performance.now(), dur: 450 });
        }
        this._chestMode = nowOpen ? "open" : "idle";
      } else {
        this._enemyKind = "text"; this._chestEnemyRef = null;
        this._enemyName = activeEnemy.name || null;
        this.enemyText.text = activeEnemy.emoji;
        this.enemyText.glow = activeEnemy.glow || "#ffffff"; this.enemyText.glowBlur = 22;
      }
    }
    this.rebuildCaches();
    this.trackEnemyLife(activeEnemy);
  },

  /* Detects a kill (hp crossed to 0 on the enemy we were watching) and a
     new arrival (the active enemy object changed), which is what drives
     the dissolve-into-pixels death and the drop-in entrance. */
  trackEnemyLife(active) {
    if (!active) return;
    if (active !== this._trackRef) {
      const first = this._trackRef === null;
      this._trackRef = active; this._trackHp = active.hp;
      if (!first && active.hp > 0) this.enemyEnter(active);
      return;
    }
    if (this._trackHp > 0 && active.hp <= 0 && !active.isChest) this.enemyDie();
    this._trackHp = active.hp;
  },

  enemyEnter(enemy) {
    killTweensOf(this.enemyLayer);
    this.enemyLayer.x = this.enemyBase.x;
    tweenTo(this.enemyLayer, { y: { from: this.enemyBase.y - this.H * 0.6, to: this.enemyBase.y }, alpha: { from: 0, to: 1 } }, {
      duration: 380, ease: "cubicIn",
      onComplete: () => {
        this.shakeUntil = performance.now() + 160; this.shakeMag = enemy.isBoss ? 1.4 : 0.6;
        this.burst(this.enemyBase.x, this.enemyBase.y - this.ap, BIOMES[this._biome] ? BIOMES[this._biome].ground : ["#aaa"], enemy.isBoss ? 30 : 16, 0.16, { up: 0.1, g: 0.0008, life: 500 });
      },
    });
  },

  enemyDie() {
    const strip = this.enemyStrips[0];
    this._deadRef = this._trackRef;
    const ox = this.enemyLayer.x + (this._enemyBaseX || 0), oy = this.enemyLayer.y + (this._enemyBaseY || 0);
    const glow = this._enemyGlow || "#ffffff";
    if (strip && strip.canvas) {
      // Sample the sprite on its own pixel grid; every opaque sprite pixel
      // becomes a particle that keeps that pixel's colour.
      const c = strip.canvas, sc = this._enemyPixScale || 1;
      let data = null;
      try { data = c.getContext("2d").getImageData(0, 0, c.width, c.height).data; } catch (e) { data = null; }
      if (data) {
        const step = Math.max(sc, Math.round(this.ap));
        for (let y = 0; y < c.height; y += step) for (let x = 0; x < c.width; x += step) {
          const o = (y * c.width + x) * 4;
          if (data[o + 3] < 128 || Math.random() < 0.35) continue;
          this.spawn({
            x: ox + x, y: oy + y, vx: (Math.random() - 0.5) * 0.12, vy: -0.05 - Math.random() * 0.14,
            g: 0.00025, life: 700 + Math.random() * 700, size: step,
            color: `rgb(${data[o]},${data[o + 1]},${data[o + 2]})`, drag: 0.99, front: true,
          });
        }
      }
    }
    const cx = this.enemyBase.x, cy = this.enemyBase.y + this.dragonOriginY * 0.45;
    this.fx.push({ type: "ring", x: cx, y: cy, r: 22, color: glow, t0: performance.now(), dur: 500 });
    this.burst(cx, cy, ["#ffcf3a", "#fff3a8"], 14, 0.22, { up: 0.18, g: 0.001, life: 900, extra: { front: true, shape: "plus" } });
  },

  /* ---------- combat hooks (called through BattleFX) ---------- */
  playerAttack() {
    killTweensOf(this.playerLayer);
    tweenTo(this.playerLayer, { x: this.playerBase.x + this.unit * 22 }, { duration: 175, yoyo: true, ease: "quadOut" });
    const now = performance.now();
    this.fx.push({ type: "slash", x: this.enemyBase.x - this.unit * 2, y: this.enemyBase.y + this.dragonOriginY * 0.5, t0: now + 130, dur: 260 });
    for (let k = 0; k < 8; k++) this.spawn({ x: this.playerBase.x - this.unit * 6, y: this.playerBase.y - this.ap * (1 + Math.random() * 3), vx: -0.04 - Math.random() * 0.05, vy: -0.02, life: 300, color: "#e8e0f0" });
  },
  playerHit() {
    const now = performance.now();
    this.shakeUntil = now + 300; this.shakeMag = 0.8; this.flashUntil = now + 350;
    this.playerFlashUntil = now + 110;
    killTweensOf(this.playerLayer);
    tweenTo(this.playerLayer, { x: this.playerBase.x - this.unit * 6 }, { duration: 55, yoyo: true, repeat: 3, ease: "sineInOut" });
    const cx = this.playerBase.x, cy = this.playerBase.y + this.dragonOriginY * 0.5;
    this.burst(cx, cy, ["#ff5a4a", "#ffffff", "#ffb04a"], 16, 0.25, { life: 420 });
  },
  enemyAttack() {
    killTweensOf(this.enemyLayer);
    this.enemyLayer.alpha = 1;
    tweenTo(this.enemyLayer, { x: this.enemyBase.x - this.W * 0.18 }, { duration: 175, yoyo: true, ease: "quadOut" });
  },
  enemyHit() {
    const now = performance.now();
    killTweensOf(this.enemyLayer); killTweensOf(this.enemyText);
    this.enemyLayer.alpha = 1; this.enemyLayer.y = this.enemyBase.y;
    this.enemyFlashUntil = now + 110;
    tweenTo(this.enemyText, { alpha: { from: 1, to: 0.25 } }, { duration: 60, yoyo: true, repeat: 1 });
    tweenTo(this.enemyLayer, { scale: { from: 1, to: 1.12 }, x: { from: this.enemyBase.x + this.unit * 3, to: this.enemyBase.x } }, { duration: 90, yoyo: true, ease: "quadOut" });
    const cx = this.enemyBase.x, cy = this.enemyBase.y + this.dragonOriginY * 0.5;
    const glow = this._enemyGlow || "#ffffff";
    this.burst(cx, cy, [glow, "#ffffff", "#fff3a8"], 22, 0.3, { life: 480, extra: { front: true } });
    this.shakeUntil = now + 120; this.shakeMag = 0.4;
  },
  fireballCast() {
    const now = performance.now();
    const x0 = this.playerBase.x + this.unit * 8, y0 = this.playerBase.y + this.dragonOriginY * 0.7;
    const x1 = this.enemyBase.x, y1 = this.enemyBase.y + this.dragonOriginY * 0.45;
    this.fx.push({ type: "fireball", x0, y0, x1, y1, t0: now, dur: 500 });
    setTimeout(() => {
      const t = performance.now();
      this.fx.push({ type: "ring", x: x1, y: y1, r: 26, color: "#ffcf3a", t0: t, dur: 420 });
      this.fx.push({ type: "ring", x: x1, y: y1, r: 16, color: "#ff5a1a", t0: t + 60, dur: 420 });
      this.burst(x1, y1, ["#fff3b0", "#ffcf3a", "#ff7a1c", "#d8321f", "#5a2a1a"], 60, 0.42, { up: 0.08, g: 0.0007, life: 700, extra: { front: true } });
      this.whiteUntil = t + 140; this.shakeUntil = t + 320; this.shakeMag = 1.3;
    }, 490);
  },
  showPopup(text, side, kind) {
    const base = side === "enemy" ? this.enemyBase : this.playerBase;
    const colors = { dmg: "#ff6b5b", heal: "#6ee7a8", poison: "#9cff6a", crit: "#ffd700" };
    const color = colors[kind] || "#fff0e0";
    const fontSize = kind === "crit" ? Math.round(this.unit * 9) : Math.round(this.unit * 7.2);
    // Stagger popups that land at the same moment so "WEAK!" and the damage
    // number don't print on top of each other.
    const stack = this.popups.filter((q) => q._side === side && q._age < 400).length;
    const p = makeSprite("text", {
      text, fontSize, color, x: base.x + (stack % 2 ? this.unit * 7 : 0), y: base.y + this.dragonOriginY * 0.85 - stack * fontSize * 0.9,
      stroke: "#140d10", strokeWidth: Math.max(3, Math.round(this.unit * 1.3)),
      fontFamily: "'Pixelify Sans', monospace", fontWeight: 700, scale: 1.8, _side: side, _age: 0,
    });
    this.popups.push(p);
    tweenTo(p, { scale: 1, _age: 400 }, { duration: 160, ease: "quadOut" });
    tweenTo(p, { y: p.y - this.unit * 14 }, {
      delay: 120, duration: 2400, ease: "cubicOut",
      onComplete: () => { const i = this.popups.indexOf(p); if (i >= 0) this.popups.splice(i, 1); },
    });
    tweenTo(p, { alpha: { from: 1, to: 0 } }, { delay: 1100, duration: 1400 });
    if (kind === "crit") { const now = performance.now(); this.whiteUntil = now + 120; this.shakeUntil = now + 260; this.shakeMag = 1.1; }
    if (kind === "heal") this.burst(base.x, base.y + this.dragonOriginY * 0.4, ["#6ee7a8", "#c8ffe0"], 12, 0.08, { up: 0.08, g: -0.00005, life: 900, extra: { shape: "plus" } });
  },
  showImpact(side) {
    const base = side === "enemy" ? this.enemyBase : this.playerBase;
    this.fx.push({ type: "star", x: base.x, y: base.y + this.dragonOriginY * 0.55, color: side === "enemy" ? "#ffcf3a" : "#ff5a4a", t0: performance.now(), dur: 280 });
  },
};

/* The rider's palette with the sword recoloured to the owned DMG tier. */
function heroPaletteForTier(tier) {
  const t = SWORD_TIERS[Math.max(0, Math.min(SWORD_TIERS.length - 1, tier || 0))];
  return Object.assign({}, HERO_PALETTE, { bladeColor: t.blade, hiltColor: t.hilt });
}

/* ---------- plumbing: host element, loop, resize sync ---------- */
const battleStageHost = document.createElement("div");
battleStageHost.id = "battle-stage-host";
const battleCanvas = document.createElement("canvas");
battleStageHost.appendChild(battleCanvas);
document.body.appendChild(battleStageHost);

let stageAwake = false;
let lastFrame = 0;

function ensureBattleGame(width, height) {
  if (BattleStage.ready) return;
  BattleStage.init(battleCanvas);
  resizeStage(width, height);
  BattleStage.syncFromState();
  requestAnimationFrame(frameLoop);
}

function resizeStage(w, h) {
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  battleCanvas.width = Math.max(1, Math.round(w * dpr));
  battleCanvas.height = Math.max(1, Math.round(h * dpr));
  battleCanvas.style.width = `${w}px`;
  battleCanvas.style.height = `${h}px`;
  const ctx = battleCanvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  BattleStage.layout(w, h);
}

function setBattleLoopAwake(awake) { stageAwake = awake; }

function frameLoop(now) {
  requestAnimationFrame(frameLoop);
  const dt = Math.min(50, now - (lastFrame || now));
  lastFrame = now;
  if (!stageAwake || !BattleStage.ready || document.hidden) return;
  updateTweens(dt);
  BattleStage.draw(now);
}

function syncBattleStage() {
  const anchor = document.getElementById("battlefield-anchor");
  if (!anchor) { battleStageHost.style.display = "none"; setBattleLoopAwake(false); return; }
  const r = anchor.getBoundingClientRect();
  battleStageHost.style.display = "block";
  battleStageHost.style.left = `${r.left + window.scrollX}px`;
  battleStageHost.style.top = `${r.top + window.scrollY}px`;
  battleStageHost.style.width = `${r.width}px`;
  battleStageHost.style.height = `${r.height}px`;
  const w = Math.round(r.width), h = Math.round(r.height);
  if (w <= 0 || h <= 0) return;
  if (!BattleStage.ready) { ensureBattleGame(w, h); setBattleLoopAwake(true); return; }
  setBattleLoopAwake(true);
  if (BattleStage.W !== w || BattleStage.H !== h) resizeStage(w, h);
  BattleStage.syncFromState();
}
window.addEventListener("resize", syncBattleStage);
window.addEventListener("orientationchange", () => setTimeout(syncBattleStage, 250));

const BattleFX = {
  playerAttack() { if (BattleStage.ready) BattleStage.playerAttack(); },
  playerHit() { if (BattleStage.ready) BattleStage.playerHit(); },
  enemyAttack() { if (BattleStage.ready) BattleStage.enemyAttack(); },
  enemyHit() { if (BattleStage.ready) BattleStage.enemyHit(); },
  fireballCast() { if (BattleStage.ready) BattleStage.fireballCast(); },
  showPopup(text, side, kind) { if (BattleStage.ready) BattleStage.showPopup(text, side, kind); },
  showImpact(side) { if (BattleStage.ready) BattleStage.showImpact(side); },
};

render();
</script>
