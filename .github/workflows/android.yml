name: Android build

# Builds a debug APK (for sideloading onto a test phone) and a release App
# Bundle (.aab) for Google Play on every push and on demand. The .aab is
# signed with your upload key when the four ANDROID_* secrets are set in
# the repo (Settings > Secrets and variables > Actions); otherwise it is
# built unsigned and Play Console will refuse it.

on:
  push:
    branches: [main, "claude/**"]
    # Website, deploy and docs changes don't touch the app, so they don't rebuild it.
    paths-ignore: ["site/**", "docs/**", "deploy/**", "**/*.md", "scripts/build-site-assets.mjs", ".github/workflows/deploy-site.yml"]
  pull_request:
    paths-ignore: ["site/**", "docs/**", "deploy/**", "**/*.md", "scripts/build-site-assets.mjs", ".github/workflows/deploy-site.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The ubuntu runner ships with the Android SDK (ANDROID_HOME is set and
      # licenses are accepted), so no setup action is needed; Gradle fetches
      # any missing platform (API 36) itself.
      - name: Install dependencies
        run: npm ci

      - name: Copy web game into the Android project
        run: npx cap sync android

      - name: Restore upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build debug APK and release bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: dragons-vs-math-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: dragons-vs-math-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
