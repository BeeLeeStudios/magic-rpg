name: Deploy website

# Uploads site/ to your VPS whenever the website changes (or on demand from
# the Actions tab). Needs the secrets printed by deploy/setup-vps.sh:
# VPS_HOST, VPS_PORT, VPS_USER, VPS_SSH_KEY and VPS_KNOWN_HOSTS.
# Until they're set, this workflow just skips.

on:
  push:
    branches: [main, "claude/**"]
    paths: ["site/**", ".github/workflows/deploy-site.yml"]
  workflow_dispatch:

concurrency: deploy-site

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Upload site to the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "::notice::VPS secrets are not set yet (see docs/WEBSITE.md); skipping deploy."
            exit 0
          fi
          PORT="${VPS_PORT:-22}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$PORT" "$VPS_HOST" > ~/.ssh/known_hosts
          fi
          rsync -rlz --delete --chmod=D755,F644 \
            -e "ssh -i ~/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=yes" \
            site/ "${VPS_USER:-sitedeploy}@$VPS_HOST:/var/www/dragonsvsmath/"
          echo "Deployed."
